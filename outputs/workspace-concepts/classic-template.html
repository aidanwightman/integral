<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Integral Workspace</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMyMzM4NTQiLz48dGV4dCB4PSIxOSIgeT0iMjkiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJHZW9yZ2lhLHNlcmlmIiBmb250LXN0eWxlPSJpdGFsaWMiIGZvbnQtd2VpZ2h0PSJib2xkIiBmb250LXNpemU9IjMwIiBmaWxsPSIjZmZmIj5pLjwvdGV4dD48L3N2Zz4=">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f6f6f3;--panel:#fff;--sunken:#f0f0ec;--hover:#f3f4f0;--line:#e3e3dd;--line2:#d2d3cb;
  --text:#1c1f1b;--muted:#5f645c;--faint:#6f746b;
  --accent:#1f6a4e;--accent-ink:#fff;--accent-soft:#e3efe8;
  --crit:#b42b20;--crit-soft:#fbe8e5;--warn:#93590a;--warn-soft:#fbf0db;--info:#2d5cae;--info-soft:#e7eefa;--ok:#2b7a3d;--ok-soft:#e4f2e7;
  --shadow:0 10px 40px #10201814;--r:8px;
  font:calc(13px * var(--workspace-text-scale, 1))/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121614;--panel:#1a1f1c;--sunken:#151917;--hover:#202622;--line:#2b322e;--line2:#3a433e;
  --text:#e7ece8;--muted:#a1aaa4;--faint:#727b75;--accent:#7fcca9;--accent-ink:#0e1a14;--accent-soft:#1f3a2e;
  --crit:#f08b80;--crit-soft:#3a1f1c;--warn:#e7b260;--warn-soft:#3a2e18;--info:#8fb2f0;--info-soft:#1d2a40;--ok:#86cf96;--ok-soft:#1d3323;--shadow:0 10px 40px #0007;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#121614;--panel:#1a1f1c;--sunken:#151917;--hover:#202622;--line:#2b322e;--line2:#3a433e;
  --text:#e7ece8;--muted:#a1aaa4;--faint:#727b75;--accent:#7fcca9;--accent-ink:#0e1a14;--accent-soft:#1f3a2e;
  --crit:#f08b80;--crit-soft:#3a1f1c;--warn:#e7b260;--warn-soft:#3a2e18;--info:#8fb2f0;--info-soft:#1d2a40;--ok:#86cf96;--ok-soft:#1d3323;--shadow:0 10px 40px #0007;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;line-height:1.2;white-space:nowrap}
button:hover{background:var(--hover)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:550}
button.pri:hover{filter:brightness(.95)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--hover)}
button.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
button.link:hover{text-decoration:underline}
button.sm{padding:4px 8px;font-size:calc(12px * var(--workspace-text-scale, 1))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],input[type=text],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px}
h1{font-size:calc(18px * var(--workspace-text-scale, 1));font-weight:620;margin:0;letter-spacing:-.2px}
h2{font-size:calc(13px * var(--workspace-text-scale, 1));font-weight:620;margin:0}
h3{font-size:calc(12px * var(--workspace-text-scale, 1));font-weight:600;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* shell */
.shell{--rail:212px;display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:minmax(0,1fr);height:100%;transition:grid-template-columns .15s}
.shell>.rail,.shell>.main{min-height:0}
.shell.ai{--rail:360px}
.rail{background:var(--sunken);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:8px;font-weight:650;letter-spacing:-.2px;border:1px solid transparent;background:none;width:100%;border-radius:6px;white-space:normal;min-width:0}
.brand:hover{background:var(--hover);border-color:var(--line)}
/* The initials are artwork within the badge. Keep their proportions at every reading size. */
.brand b,.menu b{--mark-side:22px;--mark-type:11px;width:var(--mark-side);height:var(--mark-side);flex:none;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:var(--mark-type)}
.rail .sec{font-size:calc(11px * var(--workspace-text-scale, 1));color:var(--faint);padding:12px 10px 4px;font-weight:550}
.nav{width:100%;border:0;background:none;justify-content:flex-start;padding:6px 10px;border-radius:6px;color:var(--muted);gap:9px}
.nav:hover{background:var(--hover);color:var(--text)}
.nav[aria-current]{background:var(--panel);color:var(--text);font-weight:560;box-shadow:0 0 0 1px var(--line)}
.nav .ct{margin-left:auto;font-size:calc(11px * var(--workspace-text-scale, 1));color:var(--muted);font-variant-numeric:tabular-nums}
.nav .ct.hot{color:var(--crit);font-weight:600}
.rail .foot{margin-top:auto;padding:10px;font-size:calc(11px * var(--workspace-text-scale, 1));color:var(--faint);border-top:1px solid var(--line)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:48px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel)}
.cmd{display:flex;align-items:center;gap:8px;width:min(440px,50vw);color:var(--muted);background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:5px 9px;justify-content:flex-start}
.cmd kbd,kbd{margin-left:auto;font:calc(11px * var(--workspace-text-scale, 1)) ui-monospace,monospace;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel)}
.menu-btn{display:none}
.content{flex:1;min-height:0;overflow:auto}
.page{padding:16px 20px 28px;max-width:1680px;margin:0 auto}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.phead .sub{color:var(--muted)}
.phead .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--sunken);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 9px;border-radius:4px;color:var(--muted);font-size:calc(12px * var(--workspace-text-scale, 1))}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line);font-weight:550}
.concept{font-size:calc(11px * var(--workspace-text-scale, 1));color:var(--faint);margin-right:2px}

/* pills, tags */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:calc(11px * var(--workspace-text-scale, 1));padding:1px 7px;border-radius:99px;background:var(--sunken);color:var(--muted);border:1px solid var(--line);white-space:nowrap;font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.now{background:var(--crit)}.dot.today{background:var(--warn)}.dot.week{background:var(--info)}.dot.ok{background:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:calc(12px * var(--workspace-text-scale, 1));border:0}
.chip button{border:0;background:none;padding:1px;color:inherit;border-radius:99px}
.reclink{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:2px 7px;font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--text)}
.reclink:hover{border-color:var(--accent);color:var(--accent);background:var(--panel)}

/* cards & panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card>.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.card>.bd{padding:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:calc(12.5px * var(--workspace-text-scale, 1))}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)}.bar.crit>i{background:var(--crit)}
.empty{padding:36px;text-align:center;color:var(--muted)}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:calc(12.5px * var(--workspace-text-scale, 1))}
.tbl th{position:sticky;top:0;z-index:1;background:var(--sunken);text-align:left;font-weight:550;color:var(--muted);font-size:calc(11.5px * var(--workspace-text-scale, 1));padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--text)}
.tbl th .ar{opacity:.7;margin-left:2px}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.dense .tbl td{padding:4px 10px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tbody tr.sel td{background:var(--hover)}
.tbl tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl tbody tr.grp td{background:var(--sunken);font-weight:600;cursor:default;padding:6px 10px;position:sticky;top:30px}
.tbl .r{text-align:right}
.tbl input[type=checkbox]{margin:0;accent-color:var(--accent)}
.tbl .name{font-weight:550}
.tbl .code{font:calc(11.5px * var(--workspace-text-scale, 1)) ui-monospace,monospace;color:var(--muted)}
.tablewrap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:auto;max-height:calc(100vh - 205px)}

/* split layout with detail */
.split{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.split.open{grid-template-columns:minmax(0,1fr) 380px}
.detail{position:sticky;top:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 110px);overflow:auto}
.detail .dh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;position:sticky;top:0;background:var(--panel);z-index:1}
.detail .db{padding:14px;display:grid;gap:16px}
.detail .sect{display:grid;gap:8px}
.taskbar{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px}
.taskbar.done{border-color:var(--ok);background:var(--ok-soft)}
.taskbar .lbl{font-size:calc(11px * var(--workspace-text-scale, 1));font-weight:600;color:var(--warn);text-transform:uppercase;letter-spacing:.4px}
.taskbar.done .lbl{color:var(--ok)}
.list{display:grid}
.list .li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:calc(12.5px * var(--workspace-text-scale, 1))}
.list .li:last-child{border-bottom:0}
.list .li.click{cursor:pointer}.list .li.click:hover{color:var(--accent)}

/* packages page */
.pk{display:grid;grid-template-columns:208px minmax(0,1fr);gap:14px;align-items:start}
.pk.open{grid-template-columns:208px minmax(0,1fr) 380px}
.facets{position:sticky;top:0;display:grid;gap:14px;font-size:calc(12.5px * var(--workspace-text-scale, 1));max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
.facet h3{margin-bottom:4px;display:flex;justify-content:space-between}
.facet label{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:5px;cursor:pointer}
.facet label:hover{background:var(--hover)}
.facet label .n{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums;font-size:calc(11.5px * var(--workspace-text-scale, 1))}
.facet label.zero{opacity:.45}
.facet input{accent-color:var(--accent);margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto;overflow-y:hidden}
.tabs button{border:0;border-radius:0;background:none;padding:7px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent);font-weight:560}
.tabs .n{color:var(--faint);font-size:calc(11px * var(--workspace-text-scale, 1));font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 8px;width:min(340px,100%)}
.search input{border:0;background:none;padding:6px 0;outline:0;width:100%}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bulk{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);margin-bottom:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:7px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--line2)}.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.filtersbtn{display:none}

/* home */
.daybar{display:flex;gap:8px;overflow:auto;padding-bottom:2px;margin-bottom:12px}
.mtg{flex:none;min-width:190px;max-width:240px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 10px;text-align:left;display:grid;gap:2px;align-content:start}
.mtg.past{opacity:.55}.mtg.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mtg .t{font-size:calc(11.5px * var(--workspace-text-scale, 1));color:var(--muted);font-variant-numeric:tabular-nums}
.triage{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:14px;align-items:start}
.queue{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qgroup{padding:8px 12px 4px;font-size:calc(11.5px * var(--workspace-text-scale, 1));font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;background:var(--sunken);border-bottom:1px solid var(--line)}
.qi{display:grid;grid-template-columns:auto 18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;border-radius:0;border-left:0;border-right:0;border-top:0;background:var(--panel);text-align:left;white-space:normal}
.qi:hover{background:var(--hover)}
.qi[aria-selected=true]{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.qi .ti{font-weight:550}.qi .me{font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted)}
.qi .due{font-size:calc(11.5px * var(--workspace-text-scale, 1));color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.qi .k{color:var(--muted)}
.preview{position:sticky;top:0;max-height:calc(100vh - 110px);overflow:auto}
.preview .pv{display:grid;gap:14px;padding:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{border-radius:99px;padding:3px 10px;font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted)}
.fbtn[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.fbtn .n{opacity:.7;font-variant-numeric:tabular-nums}
.summary{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);margin-top:2px}
.summary b{color:var(--text);font-variant-numeric:tabular-nums}

.dayplan{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:14px;align-items:start}
.agenda .slot{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.agenda .slot:last-child{border-bottom:0}
.agenda .slot .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:calc(12px * var(--workspace-text-scale, 1));padding-top:1px}
.agenda .slot.nowline{padding:0 12px;border-bottom:0}
.agenda .slot.nowline div{height:0;border-top:2px solid var(--crit);margin:4px 0;position:relative}
.agenda .slot.past{opacity:.55}
.agenda .rel{margin-top:6px;display:grid;gap:4px}
.agenda .rel button{justify-content:flex-start;border:0;background:var(--sunken);font-size:calc(12px * var(--workspace-text-scale, 1));padding:5px 8px;white-space:normal;text-align:left}
.agenda .rel button:hover{background:var(--hover)}
.check{display:flex;gap:9px;align-items:flex-start;padding:7px 12px;border-bottom:1px solid var(--line)}
.check input{margin-top:2px;accent-color:var(--accent)}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.tile .hd .n{font-size:calc(20px * var(--workspace-text-scale, 1));font-weight:620;font-variant-numeric:tabular-nums}
.tile .it{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;border-radius:0;border-left:0;border-right:0;border-top:0;background:none;text-align:left;white-space:normal}
.tile .it:hover{background:var(--hover)}
.tile .ft{padding:8px 12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.metric{padding:10px 12px}
.metric .v{font-size:calc(18px * var(--workspace-text-scale, 1));font-weight:620;font-variant-numeric:tabular-nums}
.metric .l{font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:#0003;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;overflow:auto}

/* inbox */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr) 300px;height:calc(100vh - 48px)}
.inbox>div{overflow:auto;border-right:1px solid var(--line)}
.inbox>div:last-child{border-right:0}
.thread{display:grid;gap:2px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;border-radius:0;border-left:3px solid transparent;border-right:0;border-top:0;background:var(--panel);text-align:left;white-space:normal}
.thread:hover{background:var(--hover)}
.thread[aria-selected=true]{background:var(--hover);border-left-color:var(--accent)}
.thread.unread .fr{font-weight:650}
.thread .sn{color:var(--muted);font-size:calc(12px * var(--workspace-text-scale, 1));overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.msg{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel)}
.msg.out{background:var(--sunken)}
.msg p{margin:8px 0 0;white-space:pre-wrap}

/* calendar */
.week{display:grid;grid-template-columns:48px repeat(5,minmax(120px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.week .dh2{padding:8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-weight:560;background:var(--sunken)}
.week .dh2.today{color:var(--accent)}
.week .hrs{position:relative}
.week .hr{height:64px;font-size:calc(11px * var(--workspace-text-scale, 1));color:var(--faint);text-align:right;padding-right:6px;transform:translateY(-6px)}
.week .col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 63px,var(--line) 63px 64px)}
.week .col.today{background-color:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.ev{position:absolute;left:3px;right:3px;border-radius:5px;padding:3px 6px;font-size:calc(11.5px * var(--workspace-text-scale, 1));background:var(--info-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-left:3px solid var(--info);overflow:hidden;text-align:left;display:block;white-space:nowrap;text-overflow:ellipsis;line-height:1.25}
.ev.linked{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);border-left-color:var(--accent)}
.ev.sel{box-shadow:0 0 0 2px var(--text)}
.ev .flag{float:right;margin-left:4px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:calc(10.5px * var(--workspace-text-scale, 1));padding:0 5px;border-radius:99px}
.allday-l{font-size:calc(10.5px * var(--workspace-text-scale, 1));color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.allday{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:grid;gap:2px;align-content:start;min-height:28px}
.adi{font-size:calc(11px * var(--workspace-text-scale, 1));padding:2px 6px;border-radius:4px;justify-content:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;width:100%}
.adi.ev-e{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.adi.ev-t{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.adi.ev-t.late{background:var(--crit-soft);color:var(--crit)}
.pk.open .c-type,.pk.open .c-upd{display:none}
.split.open .c-tlead,.split.open .c-tnext{display:none}
.stepper{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.stepper li{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;font-size:calc(12px * var(--workspace-text-scale, 1));padding:5px 4px;border-radius:5px;background:var(--sunken);color:var(--muted)}
.stepper li.done{color:var(--accent)}
.stepper li.cur{background:var(--accent-soft);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.ctx-inline{display:none;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--sunken)}
.ctx-inline summary{cursor:pointer;font-weight:550}
.ctx-inline[open] summary{margin-bottom:8px}
.own{width:24px;height:24px;border-radius:50%;background:var(--sunken);border:1px solid var(--line);font-size:calc(10px * var(--workspace-text-scale, 1));font-weight:600;display:grid;place-items:center;color:var(--muted)}
.own.blank{visibility:hidden;width:0;border:0;margin-right:-10px}
.qi .due.late{color:var(--crit);font-weight:600}
.mtg.on{background:var(--warn-soft);border-color:var(--warn)}
.tbl .bar{flex:1;min-width:56px}
.kv dd{min-width:0;overflow-wrap:anywhere}
.reclink{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.detail .cmp{grid-template-columns:1fr}
.detail .cmp button{white-space:normal}
button:disabled{opacity:.5;cursor:not-allowed}
/* side panels: let long single-line text truncate instead of widening the column */
.detail .db,.preview .pv,.drawer .pv,.ibctx,.sect,.list{grid-template-columns:minmax(0,1fr)}
.card,.sect,.list .li{min-width:0}
.nowmark{position:absolute;left:0;right:0;border-top:2px solid var(--crit);z-index:2}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp .card{padding:10px 12px}
.cmp .diff{background:var(--warn-soft)}
.conn{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:14px}

/* palette */
.pal{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:31;overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:13px 14px;font-size:calc(15px * var(--workspace-text-scale, 1));background:none;outline:0}
.pal .res{max-height:50vh;overflow:auto;padding:6px}
.pal .grp{font-size:calc(11px * var(--workspace-text-scale, 1));color:var(--faint);padding:8px 8px 3px;font-weight:600}
.pal .o{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;justify-content:flex-start;text-align:left}
.pal .o[aria-selected=true]{background:var(--accent-soft)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 10px 8px 14px;border-radius:8px;display:none;gap:12px;align-items:center;z-index:40;box-shadow:var(--shadow);font-size:calc(12.5px * var(--workspace-text-scale, 1))}
#toast.on{display:flex}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;padding:2px 4px}

.facets{overflow-x:hidden}
.facet{min-width:0}
.facet label .ell{flex:1;min-width:0}

/* round 3: scenarios, territories, AI */
.menu{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:grid;gap:2px;margin:0 0 8px;z-index:30}
.menu button{border:0;background:none;justify-content:flex-start;text-align:left;white-space:normal;padding:7px 8px;gap:8px;width:100%}
.menu button:hover,.menu button[aria-current=true]{background:var(--hover)}
.menu b{--mark-side:24px;--mark-type:10px}
.scopebox{position:relative}
.scopebox .menu.right{position:absolute;top:calc(100% + 4px);left:0;min-width:220px}
.scopebox .lookmenu{
  width:min(320px,calc(100vw - 24px));
  max-height:calc(100vh - 80px);
  max-height:calc(100dvh - 80px);
  overflow-y:auto;
  overscroll-behavior:contain;
}
.lookmenu .workspace-size{margin:4px 4px 8px}
:root[data-classic-large-type] .hm-scope{flex-basis:7em}
:root[data-classic-large-type] .hm-slot{grid-template-columns:max-content minmax(0,1fr) auto}
@media(min-width:601px) and (max-width:1850px){
  :root[data-classic-large-type] .top .scopebox>.ghost[data-v=scope]{font-size:0;gap:0;padding-inline:6px}
  :root[data-classic-large-type] .top :is(.ns-alert-label,.hide-sm.num){display:none}
}
@media(max-width:600px){
  :root[data-classic-large-type] .top .ds-site-home{min-width:0;max-width:100%;white-space:normal;line-height:1.15}
  :root[data-classic-large-type] .shell .top{position:relative}
  :root[data-classic-large-type] .top .scopebox:has(>[data-v=look]){position:static}
  :root[data-classic-large-type] .top .scopebox .lookmenu{position:absolute;top:calc(100% + 4px);right:0!important;min-width:0;max-height:calc(100dvh - 128px)}
}
.sw{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex:none}
.sw i{width:12px;height:24px;display:block}
.chip.scoped{background:var(--accent);color:var(--accent-ink);padding:4px 6px 4px 10px;font-weight:550}
.viewas{display:flex;align-items:center;gap:6px;font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted)}
.viewas select{font-size:calc(12px * var(--workspace-text-scale, 1));padding:4px 6px}
.nav.askai{margin-top:12px;color:var(--accent);font-weight:560;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.nav.askai:hover{background:var(--accent-soft)}
.nav.askai kbd{margin-left:auto}
.rail .foot{margin-top:12px}
.spark{border:0;background:none;padding:3px;color:var(--faint);border-radius:5px;line-height:0;visibility:hidden;opacity:0;transition:opacity .15s ease,visibility 0s linear .15s}
.spark:hover,.spark:focus-visible{color:var(--accent);background:var(--accent-soft)}
/* ✦ appears only after hovering a title or row for a moment, so it never adds noise while scanning.
   Keyboard focus shows it at once; touch screens keep it on record headers. */
:root{--spark-delay:1.5s}
.phead .row:hover .spark,.hm-head:hover .spark,.dh:hover .spark,.pv:hover>.row .spark,.qrow:hover .spark,.tbl tr:hover .spark,.sumct:hover .spark{visibility:visible;opacity:1;transition:opacity .2s ease var(--spark-delay),visibility 0s linear var(--spark-delay)}
.spark:focus-visible,.qrow:has(:focus-visible) .spark,.tbl tr:focus-visible .spark,.dh:has(:focus-visible) .spark,.hm-head:focus-within .spark,.phead .row:focus-within .spark{visibility:visible;opacity:1;transition:none}
@media (hover:none){.spark{visibility:visible;opacity:1}}
.qrow{position:relative;display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.qrow .qi{border-bottom:0;flex:1}
.qrow .spark.row{align-self:center;margin:0 6px 0 -4px;flex:none}
.tbl th.sk,.tbl td.sk{width:28px;padding:0 4px;text-align:center}
.sumct{display:inline-flex;align-items:center;gap:2px}
.tbl tr.scoped td{background:var(--accent-soft)}
.tbl tr.totrow td{background:var(--sunken);font-weight:600;cursor:default}
.tbl tr.morerow td{text-align:center;cursor:default}
.mini4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini4 div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid}
.mini4 b{font-size:calc(16px * var(--workspace-text-scale, 1))}.mini4 span{font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted)}
.aipanel{display:flex;flex-direction:column;height:100%;min-height:0;margin:-12px -8px;background:var(--panel)}
.aihd{display:flex;align-items:center;gap:6px;padding:8px 10px;height:48px;border-bottom:1px solid var(--line);flex:none}
.aictx{padding:8px 10px;border-bottom:1px solid var(--line);flex:none;display:flex;gap:8px;align-items:center;min-width:0}
.aictx .chip{max-width:100%;min-width:0;background:var(--sunken);color:var(--text);border:1px solid var(--line)}
.aictx .chip b{font-weight:550;min-width:0}
.aictx .chip.off{color:var(--muted)}
.aithread{flex:1;min-height:0;overflow:auto;overflow-x:hidden;padding:12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start}
.aiol{grid-template-columns:minmax(0,1fr)}.aiol li,.aim.ai .li{min-width:0}
.aiempty{color:var(--muted);font-size:calc(12.5px * var(--workspace-text-scale, 1))}.aiempty p{margin:0 0 8px}
.aim{display:grid;min-width:0}
.aim.user{justify-items:end}
.aim.user>div{background:var(--accent);color:var(--accent-ink);padding:7px 10px;border-radius:10px 10px 2px 10px;max-width:88%;white-space:pre-wrap}
.aim.ai>*{min-width:0}
.aim.ai p{margin:0 0 6px}
.aim.ai h4,.bdcard h4{margin:8px 0 4px;font-size:calc(11px * var(--workspace-text-scale, 1));text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.bdcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.bdcard p{margin:4px 0;color:var(--muted)}
.bdcard ul{margin:2px 0;padding-left:18px;display:grid;gap:3px}
.rule{font-size:calc(11.5px * var(--workspace-text-scale, 1));color:var(--info);background:var(--info-soft);padding:1px 6px;border-radius:4px}
.based{font-size:calc(11.5px * var(--workspace-text-scale, 1));margin-top:6px}
.acts.col{flex-direction:column;align-items:stretch}
.acts.col button{justify-content:flex-start;white-space:normal;text-align:left}
.aiol{margin:0;padding-left:18px;display:grid;gap:6px}
.diff{border:1px solid var(--accent);border-radius:8px;padding:10px 12px;display:grid;gap:8px;background:color-mix(in srgb,var(--accent-soft) 40%,var(--panel))}
.diff.ws{border-color:var(--info);background:color-mix(in srgb,var(--info-soft) 45%,var(--panel))}
.drows{display:grid;gap:2px}
.drow{display:flex;gap:6px;align-items:flex-start;font-size:calc(12.5px * var(--workspace-text-scale, 1));padding:3px 0}
.drow input{margin-top:2px;accent-color:var(--accent)}
.drow s{color:var(--muted)}
.op{font:600 calc(12px * var(--workspace-text-scale, 1)) ui-monospace,monospace;width:14px;text-align:center;flex:none}
.opa{color:var(--ok)}.opc{color:var(--warn)}.opr{color:var(--crit)}
.impact{font-size:calc(12.5px * var(--workspace-text-scale, 1));padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.receipt{font-size:calc(12.5px * var(--workspace-text-scale, 1));padding:7px 10px;border-radius:8px;background:var(--ok-soft);color:var(--text);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.receipt.faint{background:var(--sunken)}
.mtbl{width:100%;border-collapse:collapse;font-size:calc(12px * var(--workspace-text-scale, 1));margin:2px 0 8px}
.mtbl th,.mtbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.mtbl th:first-child,.mtbl td:first-child{text-align:left;color:var(--muted)}
.aichips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex:none}
.aichips button{white-space:normal;text-align:left;font-size:calc(12px * var(--workspace-text-scale, 1))}
.aiin{display:flex;gap:6px;padding:0 10px 6px;flex:none;align-items:flex-end}
.aiin textarea{min-height:40px;max-height:120px;flex:1}
.aifoot{font-size:calc(11px * var(--workspace-text-scale, 1));padding:0 10px 10px;flex:none}
.shell.ai .rail{padding:12px 8px;overflow:hidden}
@media (max-width:1440px){.shell.ai{--rail:320px}}
@media (max-width:1180px){
  .shell.ai{--rail:212px}
  .shell.ai .rail{position:fixed;inset:0 auto 0 0;width:360px;z-index:24;box-shadow:var(--shadow);background:var(--panel)}
  .shell.ai .main{grid-column:2}
}
@media (max-width:760px){
  .shell.ai .rail{width:100vw;transform:none}
  .shell.ai .main{grid-column:1}
}
@media (max-width:1560px){
  .pk.open{grid-template-columns:minmax(0,1fr) 360px}
  .pk.open .facets{display:none}
  .pk.open .filtersbtn{display:inline-flex}

}

  .inbox>div:last-child{display:none}

}
@media (max-width:980px){
  .triage,.dayplan{grid-template-columns:1fr}
  .preview{position:static;max-height:none}
  .split.open,.pk.open,.pk{grid-template-columns:1fr}
  .facets{display:none;position:static;max-height:none}
  .pk.showf .facets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .filtersbtn{display:inline-flex}
  .detail{position:fixed;inset:0 0 0 auto;width:min(440px,100vw);max-height:none;border-radius:0;z-index:21;box-shadow:var(--shadow)}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:240px;z-index:25;transform:translateX(-100%);transition:transform .15s}
  .shell.navopen .rail{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:inline-flex}
  .page{padding:12px 16px 24px}
  .cmd{width:auto;flex:1}
  .cmd kbd{display:none}
  .inbox{grid-template-columns:1fr;height:auto}
  .inbox>div{border-right:0}
  .inbox.reading>div:first-child{display:none}
  .inbox:not(.reading)>div:nth-child(2){display:none}
  .week{grid-template-columns:40px repeat(5,minmax(110px,1fr))}
  .weekwrap{overflow:auto}
  .cmp{grid-template-columns:1fr}
  .kv{grid-template-columns:96px 1fr}
  .hide-sm{display:none}
  .shell{grid-template-columns:minmax(0,1fr)}
  .top{gap:4px;padding:0 8px}
  .cmd{min-width:0}
  .cmd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .phead .right{margin-left:0;flex-wrap:wrap;width:100%}
  .phead .right .seg{max-width:100%;overflow-x:auto}
  .concept{display:none}
  .summary{gap:10px}
}


/* ============ Home v2: segmented dashboard ============ */
.home-wrap{container:home/inline-size}
.home{display:grid;gap:16px;align-items:start;
  grid-template-columns:minmax(0,1fr) 320px;
  grid-template-areas:"head head" "kpis side" "now side" "work side"}
.hm-head{grid-area:head;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hm-head h1{margin-right:4px}
.hm-scope{color:var(--muted);font-size:calc(12px * var(--workspace-text-scale, 1));flex:1;min-width:0;padding-bottom:3px}

/* shared section chrome */
.hm-now,.hm-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.hm-sec-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:40px}
.hm-sec-h h2{font-size:calc(13px * var(--workspace-text-scale, 1));font-weight:620;letter-spacing:0}
.hm-ct{font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--faint);font-variant-numeric:tabular-nums}
.hm-urgent{font-size:calc(11px * var(--workspace-text-scale, 1));font-weight:600;color:var(--crit);background:var(--crit-soft);border-radius:99px;padding:1px 7px}
.hm-sec-x{margin-left:auto;font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted);text-decoration:none;border:0;background:none;padding:2px 0;cursor:pointer;white-space:nowrap}
.hm-sec-x:hover{color:var(--accent);text-decoration:underline}

/* numbers */
.hm-kpis{grid-area:kpis;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hm-kpi{display:grid;gap:1px;justify-items:start;text-align:left;white-space:normal;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.hm-kpi:hover{background:var(--hover);border-color:var(--line2)}
.hm-kpi-l{font-size:calc(11.5px * var(--workspace-text-scale, 1));color:var(--muted)}
.hm-kpi-v{font-size:calc(20px * var(--workspace-text-scale, 1));font-weight:650;line-height:1.2;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.hm-kpi-s{font-size:calc(11.5px * var(--workspace-text-scale, 1));color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hm-kpi.is-warn .hm-kpi-v{color:var(--warn)}
.hm-kpi.is-crit .hm-kpi-v{color:var(--crit)}

/* priority band */
.hm-now{grid-area:now;border-color:color-mix(in srgb,var(--crit) 45%,var(--line));box-shadow:inset 0 3px 0 var(--crit)}
.hm-now>.hm-sec-h{background:var(--crit-soft);padding-top:12px}
.hm-now>.hm-sec-h h2{font-size:calc(14px * var(--workspace-text-scale, 1))}
.hm-now>.hm-sec-h .hm-ct{color:var(--crit);font-weight:650;font-size:calc(13px * var(--workspace-text-scale, 1))}
.hm-now-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:-1px}
.hm-now.is-clear{box-shadow:inset 0 3px 0 var(--ok);border-color:var(--line)}
.hm-now.is-clear>.hm-sec-h{background:var(--ok-soft);border-bottom:0}
.hm-now.is-clear .hm-ct{color:var(--ok)}
.hm-more{display:none;width:100%;border:0;border-top:1px solid var(--line);border-radius:0;background:none;justify-content:center;color:var(--accent);font-size:calc(12px * var(--workspace-text-scale, 1));padding:8px}

/* rows (shared by band, cards, next-events) */
.hm-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;
  padding:8px 14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;white-space:normal;box-shadow:none}
.hm-row:hover{background:var(--hover)}
.hm-row[aria-selected=true]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.hm-rows>.hm-row:last-child,.hm-next>.hm-row:last-child{border-bottom:0}
.hm-ti{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hm-me{font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-main{min-width:0;display:grid}
.hm-due{font-size:calc(11.5px * var(--workspace-text-scale, 1));color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hm-due.late{color:var(--crit);font-weight:600}
.hm-k{color:var(--muted);line-height:0}
.hm-row .own{width:22px;height:22px}
.hm-row-lg{padding:10px 14px;min-height:54px}
.hm-row-lg:nth-child(odd){border-right:1px solid var(--line)}
.hm-row-lg .hm-ti{font-weight:600}

/* workstream cards */
.hm-work{grid-area:work;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.hm-work>.hm-card:last-child:nth-child(odd){grid-column:1/-1}
.hm-card .hm-row .hm-ti{font-weight:500}
.hm-sub{padding:6px 14px 4px;font-size:calc(11px * var(--workspace-text-scale, 1));color:var(--faint);background:var(--sunken);border-bottom:1px solid var(--line)}
.hm-foot{display:block;width:100%;text-align:left;border:0;border-radius:0;cursor:pointer;padding:7px 14px;font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted);border-top:1px solid var(--line);background:var(--sunken)}
.hm-card.is-clear>.hm-sec-h{border-bottom:0}
.hm-card.is-clear h2{color:var(--muted);font-weight:550}
.hm-card.is-clear .hm-ct{color:var(--ok)}

/* schedule column */
.hm-side{grid-area:side;display:grid;gap:16px;position:sticky;top:0;align-self:start;min-width:0}
.hm-slot{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;
  padding:9px 14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;white-space:normal;
  box-shadow:inset 3px 0 0 var(--accent)}
.hm-slot:last-child{border-bottom:0}
.hm-slot:hover{background:var(--hover)}
.hm-slot.internal{box-shadow:inset 3px 0 0 var(--line2)}
.hm-slot.past{opacity:.5}
.hm-slot.next{background:var(--accent-soft)}
.hm-time{font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.hm-slot.next .hm-time{color:var(--accent);font-weight:650}
.hm-open{font-size:calc(11px * var(--workspace-text-scale, 1));font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:1px 7px;white-space:nowrap}
.hm-nowline{height:0;border-top:2px solid var(--crit);margin:-1px 0 0;position:relative;z-index:1}
.hm-next .hm-row{grid-template-columns:minmax(0,1fr) auto}

/* non-modal preview drawer on Home */
.drawer.hm-drawer{width:min(420px,100vw);top:48px}

/* ---- responsive: by available width, so it also reacts to the AI rail ---- */
@container home (min-width:1480px){
  .hm-work{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hm-work>.hm-card:last-child:nth-child(odd){grid-column:auto}
}
@container home (max-width:959px){
  .home{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "kpis" "now" "side" "work"}
  .hm-side{position:static;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .hm-now-grid{grid-template-columns:minmax(0,1fr)}
  .hm-row-lg:nth-child(odd){border-right:0}
  .hm-row-lg:nth-child(n+7){display:none}
  .hm-now.show-all .hm-row-lg{display:grid}
  .hm-more{display:flex}
  .hm-now.show-all .hm-more{display:none}
}
@container home (max-width:599px){
  .home{gap:12px}
  .hm-kpis{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(150px,46%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px}
  .hm-kpi{scroll-snap-align:start}
  .hm-side,.hm-work{grid-template-columns:minmax(0,1fr)}

  .hm-row-lg:nth-child(n+7){display:none}

  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font:calc(13px * var(--workspace-text-scale, 1))/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root[data-look="brut"]:not([data-theme=light]){
  --bg:#161412;--panel:#211e1a;--sunken:#1b1916;--hover:#2d2920;--line:#3a352c;--line2:#efe7d6;
  --text:#f4eddc;--muted:#b9b09d;--faint:#8f8777;
  --accent:#9aa8ff;--accent-ink:#12122e;--accent-soft:#2a2e63;
  --crit:#ff7b6e;--crit-soft:#4b1c17;--warn:#ffc24a;--warn-soft:#44330a;--info:#6fd9d2;--info-soft:#103a39;--ok:#82dd8c;--ok-soft:#173a1d;
  --shadow:6px 6px 0 #000;--ink:#efe7d6;--hard:#000;--pop:#ffd23f;--sel:#463c12;color-scheme:dark}}
:root[data-look="brut"][data-theme=dark]{
  --bg:#161412;--panel:#211e1a;--sunken:#1b1916;--hover:#2d2920;--line:#3a352c;--line2:#efe7d6;
  --text:#f4eddc;--muted:#b9b09d;--faint:#8f8777;
  --accent:#9aa8ff;--accent-ink:#12122e;--accent-soft:#2a2e63;
  --crit:#ff7b6e;--crit-soft:#4b1c17;--warn:#ffc24a;--warn-soft:#44330a;--info:#6fd9d2;--info-soft:#103a39;--ok:#82dd8c;--ok-soft:#173a1d;
  --shadow:6px 6px 0 #000;--ink:#efe7d6;--hard:#000;--pop:#ffd23f;--sel:#463c12;color-scheme:dark}

/* base: type, focus, canvas */
:root[data-look="brut"] ::selection{background:var(--pop);color:#16130f}
:root[data-look="brut"] :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
:root[data-look="brut"] h1{font:700 calc(26px * var(--workspace-text-scale, 1))/1.1 var(--display);letter-spacing:-.03em}
:root[data-look="brut"] h2{font-family:var(--display);letter-spacing:-.01em}
:root[data-look="brut"] h3{font:700 calc(10.5px * var(--workspace-text-scale, 1))/1.3 var(--mono);letter-spacing:.08em;color:var(--text)}
:root[data-look="brut"] .summary b{font:700 calc(15px * var(--workspace-text-scale, 1))/1 var(--display)}
:root[data-look="brut"] .code,:root[data-look="brut"] .tbl .code{font-family:var(--mono)}
:root[data-look="brut"] kbd{font-family:var(--mono);border:1.5px solid var(--ink);border-radius:3px;background:var(--panel);color:var(--text);box-shadow:1px 1px 0 var(--hard)}
:root[data-look="brut"] .content{background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) 1px,transparent 1.3px);background-size:20px 20px;background-attachment:local}

/* rail + top bar */
:root[data-look="brut"] .rail{background:var(--sunken);border-right:2px solid var(--ink)}
:root[data-look="brut"] .rail .sec{font:700 calc(10px * var(--workspace-text-scale, 1))/1.3 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
:root[data-look="brut"] .rail .foot{border-top:2px solid var(--ink);color:var(--muted)}
:root[data-look="brut"] .brand{font-family:var(--display);font-size:calc(14px * var(--workspace-text-scale, 1))}
:root[data-look="brut"] .brand:hover{border-color:var(--ink);background:var(--panel)}
:root[data-look="brut"] .brand b,:root[data-look="brut"] .menu b{border:2px solid var(--ink);border-radius:4px;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--hard)}
:root[data-look="brut"] .nav{border:2px solid transparent;padding:4px 8px;border-radius:6px;font-family:var(--display);font-weight:500;color:var(--text)}
:root[data-look="brut"] .nav:hover{background:var(--panel);border-color:var(--ink)}
:root[data-look="brut"] .nav[aria-current]{background:var(--pop);color:#16130f;border-color:var(--ink);font-weight:700;box-shadow:3px 3px 0 var(--hard)}
:root[data-look="brut"] .nav .ct{font:700 calc(11px * var(--workspace-text-scale, 1)) var(--mono)}
:root[data-look="brut"] .nav .ct.hot{background:var(--crit);color:var(--panel);padding:1px 5px;border-radius:3px}
:root[data-look="brut"] .nav[aria-current] .ct:not(.hot){color:#16130f}
:root[data-look="brut"] .nav.askai{border:2px dashed var(--accent);color:var(--accent);font-weight:700}
:root[data-look="brut"] .nav.askai:hover{background:var(--accent);color:var(--accent-ink);border-style:solid;border-color:var(--ink)}
:root[data-look="brut"] .top{border-bottom:2px solid var(--ink)}
:root[data-look="brut"] .cmd{border:2px solid var(--ink);background:var(--bg);color:var(--muted)}
:root[data-look="brut"] .cmd:hover{background:var(--hover)}

/* buttons: low-specificity outline for all, hard shadow only on real action buttons */
:where(:root[data-look="brut"]) button{border:2px solid var(--ink);border-radius:6px}
:root[data-look="brut"] button.pri{border-color:var(--ink);font-weight:700}
:root[data-look="brut"] :is(button.pri,:is(.acts,.phead .right,.toolbar,.bulk,.aichips)>button:not(.ghost,.link)){font-family:var(--display);font-weight:600;box-shadow:2px 2px 0 var(--hard);transition:transform .08s,box-shadow .08s}
:root[data-look="brut"] :is(button.pri,:is(.acts,.phead .right,.toolbar,.bulk,.aichips)>button:not(.ghost,.link)):hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--hard)}
:root[data-look="brut"] :is(button.pri,:is(.acts,.phead .right,.toolbar,.bulk,.aichips)>button:not(.ghost,.link)):active{transform:translate(2px,2px);box-shadow:0 0 0 var(--hard)}
:root[data-look="brut"] :is(button.pri,:is(.acts,.phead .right,.toolbar,.bulk,.aichips)>button:not(.ghost,.link)):disabled{transform:none;box-shadow:none}
:root[data-look="brut"] button.link{font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px}
:root[data-look="brut"] .reclink{border:1.5px solid var(--ink);border-radius:4px;font-weight:600}
:root[data-look="brut"] .reclink:hover{background:var(--pop);color:#16130f;border-color:var(--ink)}
:root[data-look="brut"] .dh :is(.muted,.faint,.code,.spark){color:#3d372c}
:root[data-look="brut"] .spark:hover,:root[data-look="brut"] .spark:focus-visible{background:var(--ink);color:var(--panel)}

/* inputs */
:root[data-look="brut"] :is(input[type=search],input[type=text],input[type=number],select,textarea){border:2px solid var(--ink);border-radius:6px;background:var(--panel)}
:root[data-look="brut"] :is(input[type=search],input[type=text],input[type=number],select,textarea):focus{outline:0;box-shadow:3px 3px 0 var(--accent)}
:root[data-look="brut"] .search{border:2px solid var(--ink);border-radius:6px}
:root[data-look="brut"] .search input{border:0;box-shadow:none;background:none;outline:0}
:root[data-look="brut"] .search:focus-within{border-color:var(--ink);box-shadow:3px 3px 0 var(--accent)}

/* panels */
:root[data-look="brut"] :is(.card,.queue,.tablewrap,.detail,.week){border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--hard)}
:root[data-look="brut"] :is(.card,.detail,.ibctx,.drawer) .card{box-shadow:2px 2px 0 var(--hard)}
:root[data-look="brut"] .card>.hd{border-bottom:2px solid var(--ink)}
:root[data-look="brut"] .detail .dh{background:var(--pop);color:#16130f;border-bottom:2px solid var(--ink)}
:root[data-look="brut"] .dh button.ghost:hover{background:#16130f;color:#ffd23f}
:root[data-look="brut"] .taskbar{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--warn)}
:root[data-look="brut"] .taskbar.done{box-shadow:3px 3px 0 var(--ok)}
:root[data-look="brut"] .mini4 div{border:2px solid var(--ink);background:var(--panel)}
:root[data-look="brut"] .mini4 b{font:700 calc(20px * var(--workspace-text-scale, 1))/1.2 var(--display)}
:root[data-look="brut"] .bulk{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--accent)}
:root[data-look="brut"] .pcard{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--hard);transition:transform .08s}
:root[data-look="brut"] .pcard:hover{transform:translate(-1px,-1px)}
:root[data-look="brut"] .pcard.sel{background:var(--sel);box-shadow:3px 3px 0 var(--accent)}
:root[data-look="brut"] .ctx-inline{border:2px solid var(--ink)}

/* home queue + day strip */
:root[data-look="brut"] .qgroup{font:700 calc(10.5px * var(--workspace-text-scale, 1))/1.3 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--text);padding:7px 12px;border-bottom:2px solid var(--ink)}
:root[data-look="brut"] .qgroup .faint{color:var(--text);opacity:.6}
:root[data-look="brut"] .qgroup:has(.dot.now){background:var(--crit-soft)}
:root[data-look="brut"] .qgroup:has(.dot.today){background:var(--warn-soft)}
:root[data-look="brut"] .qgroup:has(.dot.week){background:var(--info-soft)}
:root[data-look="brut"] .qrow+.qgroup{border-top:2px solid var(--ink)}
:root[data-look="brut"] .qrow.sel,:root[data-look="brut"] .qi[aria-selected=true]{background:var(--sel)}
:root[data-look="brut"] .qi[aria-selected=true]{box-shadow:inset 5px 0 0 var(--ink)}
:root[data-look="brut"] .qi .ti{font-weight:600}
:root[data-look="brut"] .qi .due{font-family:var(--mono);font-size:calc(11px * var(--workspace-text-scale, 1));justify-self:end}
:root[data-look="brut"] .qi .due.late{background:var(--crit);color:var(--panel);padding:1px 5px;border-radius:3px}
:root[data-look="brut"] .daybar{gap:10px;padding:2px 6px 6px 2px;margin:-2px 0 8px -2px}
:root[data-look="brut"] .mtg{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--hard);transition:transform .08s}
:root[data-look="brut"] .mtg:hover{transform:translate(-1px,-1px)}
:root[data-look="brut"] .mtg .t{font-family:var(--mono);font-size:calc(11px * var(--workspace-text-scale, 1))}
:root[data-look="brut"] .mtg.next{background:var(--pop);color:#16130f;border-color:var(--ink);box-shadow:3px 3px 0 var(--hard)}
:root[data-look="brut"] .mtg.next .t{color:#3d372c}
:root[data-look="brut"] .mtg.on{background:var(--warn-soft);color:var(--text);box-shadow:3px 3px 0 var(--warn)}
:root[data-look="brut"] .mtg.on .t{color:var(--muted)}

/* tables */
:root[data-look="brut"] .tbl th{background:#16130f;color:#fffdf6;font:600 calc(10.5px * var(--workspace-text-scale, 1))/1.45 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;border-bottom:2px solid var(--ink)}
:root[data-look="brut"] .tbl th.s:hover{color:#ffd23f}
:root[data-look="brut"] .tbl tbody tr.sel td{background:var(--sel)}
:root[data-look="brut"] .tbl tbody tr.sel td:first-child{box-shadow:inset 5px 0 0 var(--ink)}
:root[data-look="brut"] .tbl tbody tr.grp td{background:var(--accent-soft);border-bottom:2px solid var(--ink);font-family:var(--display)}
:root[data-look="brut"] .tbl tr.totrow td{border-top:2px solid var(--ink);border-bottom:0;font-family:var(--display)}

/* tabs, segmented, filters, pills, chips */
:root[data-look="brut"] .tabs{border-bottom:2px solid var(--ink);gap:4px}
:root[data-look="brut"] .tabs button{border:2px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;margin-bottom:0;padding:6px 10px;font-family:var(--display);font-weight:600}
:root[data-look="brut"] .tabs button:hover{background:var(--hover)}
:root[data-look="brut"] .tabs button[aria-selected=true]{background:var(--pop);color:#16130f;border-color:var(--ink)}
:root[data-look="brut"] .tabs button[aria-selected=true] .n{color:#16130f;opacity:.65}
:root[data-look="brut"] .seg{border:2px solid var(--ink);background:var(--panel);padding:0;gap:0}
:root[data-look="brut"] .seg button{border-radius:0;font-family:var(--display);font-weight:600;padding:5px 10px}
:root[data-look="brut"] .seg button:first-child{border-radius:3px 0 0 3px}
:root[data-look="brut"] .seg button:last-child{border-radius:0 3px 3px 0}
:root[data-look="brut"] .seg button+button{border-left:2px solid var(--ink)}
:root[data-look="brut"] .seg button[aria-pressed=true]{background:var(--ink);color:var(--panel);box-shadow:none}
:root[data-look="brut"] .fbtn{border-radius:6px;font-family:var(--display);font-weight:600;color:var(--text);background:var(--panel)}
:root[data-look="brut"] .fbtn[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink);box-shadow:2px 2px 0 var(--accent)}
:root[data-look="brut"] .pill{border:1.5px solid var(--ink);border-radius:4px;font-weight:600}
:root[data-look="brut"] .pill:not(.ok,.warn,.crit,.info,.acc){color:var(--text);background:var(--panel)}
:root[data-look="brut"] .pill:is(.ok,.warn,.crit,.info,.acc){border-color:currentColor}
:root[data-look="brut"] .chip{border:2px solid var(--ink);border-radius:5px;background:var(--accent-soft);color:var(--text);font-weight:600}
:root[data-look="brut"] .chip.scoped{background:var(--pop);color:#16130f;box-shadow:2px 2px 0 var(--hard)}

/* small parts */
:root[data-look="brut"] .dot{border-radius:0;width:8px;height:8px;box-shadow:0 0 0 1.5px var(--ink)}
:root[data-look="brut"] .own{border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--text);font-family:var(--mono)}
:root[data-look="brut"] .own.blank{border:0}
:root[data-look="brut"] .bar{height:10px;border-radius:0;border:1.5px solid var(--ink);box-shadow:none;background:var(--panel)}
:root[data-look="brut"] .bar>i{border-radius:0}
:root[data-look="brut"] .stepper{gap:0}
:root[data-look="brut"] .stepper li{border:2px solid var(--ink);border-radius:0;background:var(--panel);font-family:var(--display);font-weight:600}
:root[data-look="brut"] .stepper li+li{border-left:0}
:root[data-look="brut"] .stepper li.done{background:var(--ok-soft);color:var(--ok)}
:root[data-look="brut"] .stepper li.cur{background:var(--pop);color:#16130f;box-shadow:none}

/* overlays */
:root[data-look="brut"] .menu{border:2px solid var(--ink);border-radius:6px}
:root[data-look="brut"] .menu button:is(:hover,[aria-current=true]){background:var(--pop);color:#16130f}
:root[data-look="brut"] .menu button:is(:hover,[aria-current=true]) .faint{color:#3d372c}
:root[data-look="brut"] #toast{background:var(--pop);color:#16130f;border:2px solid #16130f;border-radius:6px;box-shadow:5px 5px 0 var(--hard);font-family:var(--display);font-weight:600}
:root[data-look="brut"] .scrim{background-color:color-mix(in srgb,var(--bg) 62%,transparent);background-image:radial-gradient(var(--hard) 1px,transparent 1.3px);background-size:6px 6px}
:root[data-look="brut"] .drawer{border-left:3px solid var(--ink);box-shadow:none}
:root[data-look="brut"] .pal{border:3px solid var(--ink);border-radius:8px;box-shadow:8px 8px 0 var(--hard)}
:root[data-look="brut"] .pal input{border-bottom:2px solid var(--ink);font-family:var(--display);outline:0;box-shadow:none}
:root[data-look="brut"] .pal .grp{font:700 calc(10px * var(--workspace-text-scale, 1))/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em}
:root[data-look="brut"] .pal .o[aria-selected=true]{background:var(--pop);color:#16130f}
:root[data-look="brut"] .pal .o[aria-selected=true] .faint{color:#3d372c}

/* inbox + calendar */
:root[data-look="brut"] .inbox>div:not(:last-child){border-right:2px solid var(--ink)}
:root[data-look="brut"] .inbox>div:nth-child(-n+2){background:var(--panel)}
:root[data-look="brut"] .thread[aria-selected=true]{background:var(--sel);border-left-color:var(--ink)}
:root[data-look="brut"] .msg{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--hard)}
:root[data-look="brut"] .msg.out{background:var(--accent-soft)}
:root[data-look="brut"] .week .dh2{font-family:var(--display);border-bottom:2px solid var(--ink)}
:root[data-look="brut"] .week .dh2.today{background:var(--pop);color:#16130f}
:root[data-look="brut"] .ev{border:1.5px solid var(--ink);border-left:5px solid var(--info);border-radius:3px}
:root[data-look="brut"] .ev.linked{border-color:var(--ink);border-left-color:var(--accent)}
:root[data-look="brut"] .ev.sel{box-shadow:3px 3px 0 var(--hard)}

/* AI sidebar */
:root[data-look="brut"] .aihd{background:var(--accent);color:var(--accent-ink);border-bottom:2px solid var(--ink);font-family:var(--display)}
:root[data-look="brut"] .aihd button:hover{background:transparent;text-decoration:underline}
:root[data-look="brut"] .aictx{border-bottom:2px solid var(--ink)}
:root[data-look="brut"] .aichips{border-top:2px solid var(--ink)}
:root[data-look="brut"] .aim.user>div{border:2px solid var(--ink);border-radius:8px 8px 0 8px;box-shadow:3px 3px 0 var(--hard)}
:root[data-look="brut"] .bdcard{border:2px solid var(--ink);border-radius:6px;background:var(--panel);box-shadow:3px 3px 0 var(--hard)}
:root[data-look="brut"] .aim .diff{border:2px solid var(--ink);border-radius:6px;background:var(--accent-soft);box-shadow:4px 4px 0 var(--accent)}
:root[data-look="brut"] .aim .diff.ws{background:var(--info-soft);box-shadow:4px 4px 0 var(--info)}
:root[data-look="brut"] .impact{border:1.5px dashed var(--ink)}
:root[data-look="brut"] .receipt{border:2px solid var(--ink);border-radius:6px}
:root[data-look="brut"] .receipt.faint{border-style:dashed}
:root[data-look="brut"] .rule{border:1.5px solid currentColor;border-radius:3px}

/* responsive + motion */
@media (max-width:980px){
  :root[data-look="brut"] .detail{border-radius:0;border-width:0 0 0 3px;box-shadow:none}
}
@media (max-width:760px){
  :root[data-look="brut"] h1{font-size:calc(22px * var(--workspace-text-scale, 1))}
  :root[data-look="brut"] :is(.card,.queue,.tablewrap,.week){box-shadow:3px 3px 0 var(--hard)}
  :root[data-look="brut"] .inbox>div:not(:last-child){border-right:0}
}
@media (prefers-reduced-motion:reduce){
  :root[data-look="brut"] *{transition:none!important}
}

/* ===== Round 7 fixes from Fable's visual check (mapped to real selectors) ===== */
/* All looks: toast sits under the top bar, never over table rows */
#toast{top:auto;bottom:20px;left:calc(var(--rail,212px) + 20px);transform:none}
@media (max-width:760px){#toast{left:16px;right:16px}}
body:has(.shell.ai) #toast{left:auto!important;right:20px!important;transform:none!important}
@media (max-width:760px){body:has(.shell.ai) #toast{top:12px!important;bottom:auto!important;left:16px!important}}
/* Liquid: denser glass behind text-heavy panels; clearer dark structure; selection = fill + bar, hover = faint */
:root[data-look=liquid]{--lg-dense:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.84) 50%,rgba(255,255,255,.88))}
@media (prefers-color-scheme:dark){:root[data-look=liquid]:not([data-theme=light]){--lg-dense:linear-gradient(135deg,rgba(30,36,58,.9),rgba(18,22,38,.86) 50%,rgba(26,31,52,.88));--line:rgba(255,255,255,.13);--muted:#a9b4cc}}
:root[data-look=liquid][data-theme=dark]{--lg-dense:linear-gradient(135deg,rgba(30,36,58,.9),rgba(18,22,38,.86) 50%,rgba(26,31,52,.88));--line:rgba(255,255,255,.13);--muted:#a9b4cc}
@supports (backdrop-filter:blur(1px)){@media not (prefers-reduced-transparency:reduce){
  :root[data-look=liquid] :is(.detail,.preview,.tablewrap,.queue,.week,.inbox,.facets){background:var(--lg-dense)}}}
:root[data-look=liquid] .qi:hover,:root[data-look=liquid] .tbl tbody tr:hover td{background:rgba(120,150,255,.06)}
:root[data-look=liquid] .qi[aria-selected=true],:root[data-look=liquid] .tbl tbody tr.sel td{background:rgba(90,130,255,.18)}
:root[data-look=liquid] .qi[aria-selected=true]{box-shadow:inset 3px 0 0 #5b8cff}
/* Panels: give the table room while the AI is open; customer vs internal meetings clearly different; one-line event titles */
:root[data-look="panels"] .shell.ai .pk .facets{display:none}
:root[data-look="panels"] .shell.ai .pk{grid-template-columns:minmax(0,1fr)}
:root[data-look="panels"] .shell.ai .pk.open{grid-template-columns:minmax(0,1fr) 340px}
:root[data-look="panels"] .ev{background:var(--sunken);border:1px solid var(--line);border-left:3px solid #9a9aa3}
:root[data-look="panels"] .ev.linked{background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-left:3px solid var(--accent)}
:root[data-look="panels"] .ev{white-space:nowrap;text-overflow:ellipsis}
/* Brut: red only shouts in nav counts; yellow only for nav + selection; solid Ask AI; calmer dark */
:root[data-look="brut"] .qi .due.late,:root[data-look="brut"] .tbl td[style*="--crit"]{background:transparent!important;color:var(--crit)!important;border:1.5px solid var(--crit);box-shadow:none!important}
:root[data-look="brut"] .qgroup{background:transparent!important;border-bottom:2px solid currentColor}

const routeName=r=>({finance:'Commissions & forecast',alerts:'Alerts',inbox:'Inbox',calendar:'Calendar',deals:L('deals'),orders:L('orders'),packages:L('packages'),events:L('events'),people:L('people'),tickets:'Tickets',approvals:'Approvals',territories:'Territories',dq:'Data quality',sync:'Connections',home:'Home'})[r]||r;

function orderMini(o){if(!o)return '';const st=seats(o);return `<div class="card"><div class="hd"><b>#${o.number}</b><span class="ell grow">${esc(P(o.personId)?.company)}</span>${stagePill(o.stage)}</div><div class="bd"><dl class="kv"><dt>Customer</dt><dd>${recLink('people',o.personId,P(o.personId)?.name)}</dd><dt>${L('event')}</dt><dd>${recLink('events',o.eventId,E(o.eventId).name)} <span class="faint">${daysTo(E(o.eventId).date)}d</span></dd><dt>Value</dt><dd class="num">${money(total(o))}</dd><dt>Lines</dt><dd>${o.items.map(l=>`${l.quantity} × ${esc(l.name)}`).join('<br>')}</dd>${st?`<dt>${Lc('seats')}</dt><dd class="num">${o.named} of ${st} named${o.namesRequested?' · <span class="muted">names requested</span>':''}</dd>`:''}</dl></div></div>`}
function personMini(p){return `<div class="card"><div class="bd"><dl class="kv"><dt>${L('person')}</dt><dd>${recLink('people',p.id,p.name)}</dd><dt>Company</dt><dd>${esc(p.company)}</dd><dt>Open ${L('orders').toLowerCase()}</dt><dd>${S.orders.filter(o=>o.personId===p.id&&o.stage!=='Completed').length}</dd></dl></div></div>`}
function eventMini(e){const reg=eventSeats(e);return `<div class="card"><div class="bd"><dl class="kv"><dt>${L('event')}</dt><dd>${recLink('events',e.id,e.name)}</dd><dt>Date</dt><dd>${fDateY(e.date)} · ${daysTo(e.date)}d</dd><dt>Venue</dt><dd>${esc(e.venue)}</dd><dt>Named</dt><dd class="num">${reg.named} of ${reg.sold} ${L('seats')}</dd></dl></div></div>`}
function pkgMini(p){const sd=soldOf(p),pend=pendingOf(p);return `<div class="card"><div class="hd"><span class="code">${p.code}</span><span class="grow"></span>${availPill(p)}</div><div class="bd" style="display:grid;gap:10px"><dl class="kv"><dt>${L('pkg')}</dt><dd>${recLink('packages',p.id,p.name)}</dd><dt>${L('event')}</dt><dd>${esc(E(p.eventId).name)}</dd><dt>Unit price</dt><dd>${money(p.price)}</dd></dl>${allocBar(p)}<div class="muted">${sd} sold of ${p.capacity}${pend?` · <b style="color:var(--warn)">${pend} more in drafts</b>`:''}</div></div></div>`}
function dealMini(d){if(!d)return '';const quiet=Math.floor((NOW-new Date(d.lastActivity))/DAY);return `<div class="card"><div class="hd"><b class="ell grow">${esc(d.name)}</b>${stgDeal(d.stage)}</div><div class="bd"><dl class="kv"><dt>Contact</dt><dd>${recLink('people',d.personId,P(d.personId)?.name)}</dd><dt>Value</dt><dd class="num">${money(northstarNetDealValue(d))} · ${Math.round(d.prob*100)}%</dd><dt>Close date</dt><dd style="${new Date(d.closeDate)<NOW?'color:var(--crit)':''}">${fDateY(d.closeDate)}</dd><dt>Last activity</dt><dd style="${quiet>=S.config.stallDays?'color:var(--warn)':''}">${quiet}d ago</dd><dt>Owner</dt><dd>${esc(d.owner)}${d.territory&&S.territories.length>1?` · ${esc(TR(d.territory)?.name)}`:''}</dd></dl></div></div>`}
function ticketMini(k){if(!k)return '';const left=(new Date(k.slaDue)-NOW)/H;return `<div class="card"><div class="hd"><b>#${k.number}</b><span class="ell grow">${esc(k.subject)}</span><span class="pill ${k.priority==='P1'?'crit':k.priority==='P2'?'warn':''}">${k.priority}</span></div><div class="bd"><dl class="kv"><dt>Customer</dt><dd>${recLink('people',k.personId,P(k.personId)?.name)} <span class="faint">${esc(P(k.personId)?.company)}</span></dd><dt>SLA</dt><dd style="color:${left<0?'var(--crit)':left<4?'var(--warn)':'inherit'}">${left<0?`breached ${Math.round(-left)}h ago`:`due in ${Math.round(left)}h`}</dd><dt>${L('order')}</dt><dd>${recLink('orders',k.orderId,'#'+O(k.orderId)?.number)}</dd><dt>Owner</dt><dd>${esc(k.owner)}</dd></dl></div></div>`}
function approvalMini(a){if(!a)return '';const o=O(a.orderId);const pct=o?Math.round(a.amount/total(o)*100):null;return `<div class="card"><div class="hd"><b class="grow">${esc(a.type)}</b><span class="pill warn">${a.status}</span></div><div class="bd"><dl class="kv"><dt>Request</dt><dd>${esc(a.desc)}</dd><dt>Amount</dt><dd class="num">${a.subject==='discount'?nsMoney(a.amount):a.amount?money(a.amount):'n/a'}${a.subject==='discount'?` · ${a.toBps/100}% of list price`:pct!=null&&/Discount|Refund/.test(a.type)?` · ${pct}% of ${L('order').toLowerCase()}`:''}</dd><dt>Record</dt><dd>${reviewRecord(a)}</dd><dt>Requested by</dt><dd>${esc(a.requestedBy)} · ${ago(a.at)} ago</dd><dt>Approver</dt><dd>${esc(a.approver)}</dd></dl></div></div>`}
function terrMini(t){const st=terrStats(t);return `<div class="card"><div class="bd"><dl class="kv"><dt>Territory</dt><dd>${recLink('territories',t.id,t.name)}</dd><dt>Lead</dt><dd>${esc(t.lead)}</dd><dt>Booked</dt><dd class="num">${money(st.booked)} · ${Math.round(st.pct*100)}% of pro-rata target</dd><dt>Open pipeline</dt><dd class="num">${money(st.pipe)} · ${st.pipeN} deals</dd></dl></div></div>`}
function allocBar(p){const sd=soldOf(p),pc=Math.min(100,sd/p.capacity*100),a=avail(p);return `<div class="bar ${a==='Sold out'?'crit':a==='Low'?'warn':''}" title="${sd} of ${p.capacity}"><i style="width:${pc}%"></i></div>`}
function eventSeats(e){const os=S.orders.filter(o=>o.eventId===e.id&&o.stage!=='Draft');return {sold:os.reduce((s,o)=>s+seats(o),0),named:os.reduce((s,o)=>s+o.named,0),orders:os.length}}

const PK_TABS=[['onsale','On sale',{status:['Active']}],['attention','Needs attention',{attn:true}],['draft','Drafts',{status:['Draft']}],['all','All',{}]];
function pkMatch(p,skip){const f=UI.pk;if(!inScope(p))return false;
  if(f.tab==='attention'&&!(p.status==='Active'&&(avail(p)!=='Available')))return false;
  if(skip!=='q'&&f.q){const q=f.q.toLowerCase().trim();const hay=(p.name+' '+p.code+' '+E(p.eventId).name+' '+p.type+' '+E(p.eventId).venue).toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
  if(skip!=='status'&&f.status.size&&!f.status.has(p.status))return false;
  if(skip!=='type'&&f.type.size&&!f.type.has(p.type))return false;
  if(skip!=='event'&&f.event.size&&!f.event.has(p.eventId))return false;
  if(skip!=='avail'&&f.avail.size&&!f.avail.has(avail(p)))return false;
  return true}
function pkSortVal(p,k){return ({code:p.code,name:p.name,event:E(p.eventId).date+p.code,type:p.type,price:p.price,sold:soldOf(p)/p.capacity,left:p.capacity-soldOf(p),pending:pendingOf(p),status:p.status,updated:p.updated})[k]}
function vPackages(att){
  const f=UI.pk,all=S.packages;
  let rows=all.filter(p=>pkMatch(p));
  const [sk,sd]=f.sort;rows.sort((a,b)=>{const x=pkSortVal(a,sk),y=pkSortVal(b,sk);return (x>y?1:x<y?-1:0)*sd});
  const facet=(title,key,opts,get)=>`<div class="facet"><h3>${title}${f[key].size?`<button class="link" style="font-size:calc(11px * var(--workspace-text-scale, 1));text-transform:none;letter-spacing:0" data-act="pkclear" data-k="${key}">Clear</button>`:''}</h3>${opts.map(([v,l])=>{const n=all.filter(p=>pkMatch(p,key)&&get(p)===v).length;return `<label class="${n?'':'zero'}"><input type="checkbox" data-act="pkfacet" data-k="${key}" data-v="${v}" ${f[key].has(v)?'checked':''}><span class="ell">${esc(l)}</span><span class="n">${n}</span></label>`}).join('')}</div>`;
  const types=[...new Set(all.map(p=>p.type))].map(t=>[t,t]);
  const facets=`<div class="facets" aria-label="Filters">${facet('Availability','avail',[['Available','Available'],['Low','Low'],['Sold out','Sold out']],avail)}${facet('Type','type',types,p=>p.type)}${facet('Event','event',S.events.filter(inScope).slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map(e=>[e.id,`${fDate(e.date)} · ${e.name}`]),p=>p.eventId)}</div>`;
  const chips=[];['avail','type','event'].forEach(k=>f[k].forEach(v=>chips.push(`<span class="chip">${esc(k==='event'?E(v).name:v)}<button data-act="pkfacet" data-k="${k}" data-v="${v}" aria-label="Remove filter">${ic('x','s')}</button></span>`)));
  const tabCount=t=>{const keep=f.tab;f.tab=t[0];const save={status:f.status};f.status=new Set(t[2].status||[]);const n=all.filter(p=>pkMatch(p,'q')).length;f.status=save.status;f.tab=keep;return n};
  const sel=K(UI.sel.packages);

  const allChecked=rows.length&&rows.every(p=>f.check.has(p.id));
  const tr=p=>{const sold=soldOf(p),pend=pendingOf(p),e=E(p.eventId),left=Math.max(0,p.capacity-sold);return `<tr class="${sel&&sel.id===p.id?'sel':''}" data-act="pksel" data-id="${p.id}"><td data-stop><input type="checkbox" data-act="pkcheck" data-id="${p.id}" ${f.check.has(p.id)?'checked':''} aria-label="Select ${esc(p.name)}"></td><td><div class="name ell" style="max-width:260px">${esc(p.name)}</div><div class="code">${p.code}</div></td>${f.view==='group'?'':`<td class="c-opt"><div class="ell" style="max-width:220px">${esc(e.name)}</div><div class="muted" style="font-size:calc(12px * var(--workspace-text-scale, 1))">${fDate(e.date)}</div></td>`}<td class="r num">${p.price?money(p.price):'<span class="muted">Free</span>'}</td><td style="min-width:160px"><div class="row">${allocBar(p)}<span class="num muted" style="min-width:58px;text-align:right">${sold}/${p.capacity}</span></div></td><td class="r num" style="${left<=0?'color:var(--crit);font-weight:600':''}">${left}</td><td class="r num c-opt">${pend?`<span style="color:var(--warn);font-weight:600">${pend}</span>`:''}</td><td>${p.status==='Active'&&avail(p)==='Available'?'':availPill(p)}</td><td class="sk">${spark('package',p.id,p.name,'row')}</td></tr>`};
  let body='';
  if(f.view==='cards'){body=`<div class="cards">${rows.map(p=>`<button class="pcard ${sel&&sel.id===p.id?'sel':''}" data-act="pksel" data-id="${p.id}"><div class="row"><span class="code">${p.code}</span><span class="grow"></span>${availPill(p)}</div><b>${esc(p.name)}</b><span class="muted ell">${esc(E(p.eventId).name)} · ${fDate(E(p.eventId).date)}</span>${allocBar(p)}<div class="row muted" style="font-size:calc(12px * var(--workspace-text-scale, 1))"><span>${soldOf(p)}/${p.capacity} sold</span><span class="grow"></span><span class="num">${money(p.price)}</span></div></button>`).join('')}</div>`}

function ppDetail(p,att){const os=S.orders.filter(o=>o.personId===p.id),ds=S.deals.filter(d=>d.personId===p.id),ts=S.threads.filter(t=>t.personId===p.id),ms=S.meetings.filter(m=>m.personId===p.id);
  return detailShell(esc(p.name),`${esc(p.role||L('person'))} · ${esc(p.company)} ${outPill(p)}`,`${taskBanner(att,'people',p.id)}${reviewPanel('customer',p)}<dl class="kv sum"><dt>Email</dt><dd class="ell">${esc(p.email)}</dd><dt>Phone</dt><dd>${esc(p.phone)||'<span class="muted">None</span>'}</dd><dt>Owner</dt><dd>${esc(p.owner)}</dd><dt>Last contact</dt><dd>${fDateY(p.lastContact)}</dd></dl>
  ${os.length?sec(L('orders'),os.length,`<div class="list">${os.map(o=>`<div class="li click" data-act="goto" data-r="orders" data-id="${o.id}"><span class="num muted">#${o.number}</span><span class="grow ell">${esc(E(o.eventId).name)}</span><span class="num">${money(total(o))}</span>${stagePill(o.stage)}</div>`).join('')}</div>`):''}
  ${ds.length?sec('Deals',ds.length,`<div class="list">${ds.map(d=>`<div class="li click" data-act="goto" data-r="deals" data-id="${d.id}"><span class="grow ell">${esc(d.name.split(' · ')[1]||d.name)}</span><span class="num">${money(northstarNetDealValue(d))}</span>${stgDeal(d.stage)}</div>`).join('')}</div>`):''}
  ${ts.length||ms.length?sec('Email & meetings',ts.length+ms.length,`<div class="list">${ts.map(t=>`<div class="li click" data-act="goto" data-r="inbox" data-id="${t.id}">${ic('mail','s')}<span class="grow ell">${esc(t.subject)}</span><span class="muted">${ago(t.msgs.at(-1).at)}</span></div>`).join('')}${ms.map(m=>`<div class="li click" data-act="goto" data-r="calendar" data-id="${m.id}">${ic('cal','s')}<span class="grow ell">${esc(m.title)}</span><span class="muted">${fDay(m.start)}</span></div>`).join('')}</div>`,false):''}
  ${p.sources.sf||p.sources.hs?sec('Linked systems',null,`<dl class="kv">${p.sources.sf?`<dt>Salesforce</dt><dd><span class="code">${p.sources.sf}</span></dd>`:''}${p.sources.hs?`<dt>HubSpot</dt><dd><span class="code">${p.sources.hs}</span></dd>`:''}</dl><div class="muted" style="font-size:calc(12px * var(--workspace-text-scale, 1))">One record here, matched to each system by ID.</div>`,false):''}`,'closedetail',['person',p.id,p.name])}
const stgDeal=s=>`<span class="stg"><i style="background:${s==='Won'?'var(--ok)':s==='Lost'?'var(--faint)':/Negotiation|Verbal/.test(s)?'var(--warn)':'var(--accent)'}"></i>${esc(s)}</span>`;
