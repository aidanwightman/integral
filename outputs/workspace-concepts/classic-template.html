function vInbox(att){const f=UI.ib;const list=S.threads.filter(t=>!t.personId||inScope(t)).filter(t=>f.f==='all'||(f.f==='reply'?t.needsReply&&!t.handled:f.f==='unlinked'?!t.personId:true)).sort((a,b)=>(f.f==='reply'?1:-1)*a.msgs.at(-1).at.localeCompare(b.msgs.at(-1).at));
  if(!list.find(t=>t.id===UI.sel.inbox)&&!S.threads.find(t=>t.id===UI.sel.inbox))UI.sel.inbox=list[0]?.id;
  const t=S.threads.find(x=>x.id===UI.sel.inbox);
  const cnt=k=>S.threads.filter(inScope).filter(t=>k==='all'||(k==='reply'?t.needsReply&&!t.handled:!t.personId)).length;
  const o=t&&O(t.orderId),p=t&&P(t.personId);
  return `<div class="inbox ${UI.ib.reading?'reading':''}"><div data-sc="iblist"><div style="padding:12px 12px 0"><div class="row" style="margin-bottom:8px"><h1 class="grow">Inbox</h1><span class="faint" style="font-size:calc(12px * var(--workspace-text-scale, 1))">Microsoft 365 + Google · synced 1m ago</span></div><div class="tabs">${[['reply','Needs reply'],['unlinked','Not in CRM'],['all','All']].map(([k,l])=>`<button aria-selected="${f.f===k}" data-act="ibf" data-v="${k}">${l} <span class="n">${cnt(k)}</span></button>`).join('')}</div></div>
  ${list.map(x=>`<button class="thread ${x.unread?'unread':''}" data-act="ibsel" data-id="${x.id}" aria-selected="${t&&t.id===x.id}"><div class="row"><span class="fr ell grow">${esc(x.fromName)}</span>${(()=>{const h=(NOW-new Date(x.msgs.at(-1).at))/H,late=x.needsReply&&!x.handled&&h>24;return `<span class="${late?'':'faint'}" style="font-size:calc(11.5px * var(--workspace-text-scale, 1));${late?'color:var(--warn);font-weight:600':''}">${late?'waiting ':''}${ago(x.msgs.at(-1).at)}</span>`})()}</div><div class="ell">${esc(x.subject)}</div><div class="sn">${esc(x.msgs.at(-1).body)}</div><div class="row" style="margin-top:3px">${x.orderId?`<span class="pill acc">#${O(x.orderId)?.number}</span>`:''}${!x.personId?'<span class="pill warn">not in CRM</span>':''}${x.handled?'<span class="pill ok">handled</span>':x.needsReply&&f.f!=='reply'?'<span class="pill">needs reply</span>':''}</div></button>`).join('')||'<div class="empty">Nothing here.</div>'}</div>
  <div style="padding:14px;display:grid;gap:12px;align-content:start" data-sc="ibread">${t?`<div class="row"><button class="ghost sm menu-btn" data-act="ibback">${ic('back','s')} Back</button><h2 class="grow" style="font-size:calc(16px * var(--workspace-text-scale, 1))">${esc(t.subject)}</h2></div>${taskBanner(att,'inbox',t.id)}${o?`<details class="ctx-inline"><summary>Order #${o.number} · ${esc(P(o.personId)?.company)} · ${o.stage} · ${relatedToOrder(o).filter(a=>a.id!=='th:'+t.id).length} other open items</summary>${orderMini(o)}</details>`:''}<div class="row wrap">${p?recLink('people',p.id,p.name):`<span class="pill warn">${esc(t.fromEmail)} not in CRM</span><button class="sm" data-act="addsender" data-id="${t.id}">${ic('plus','s')} Add as person</button>`}${o?recLink('orders',o.id,'Order #'+o.number):''}${o?recLink('events',o.eventId,E(o.eventId).name):''}</div>
  ${t.msgs.map(m=>m.dir==='note'?`<div class="faint" style="font-size:calc(12px * var(--workspace-text-scale, 1))">${esc(m.body)} · started by AI draft</div>`:`<div class="msg ${m.dir==='out'?'out':''}"><div class="row"><b>${m.dir==='out'?'You':esc(t.fromName)}</b><span class="faint">${m.dir==='out'?'':esc(t.fromEmail)}</span><span class="grow"></span><span class="faint">${fDay(m.at)} ${fTime(m.at)}</span></div><p>${esc(m.body)}</p></div>`).join('')}
  ${UI.ib.reply===t.id?`<div class="card"><div class="bd" style="display:grid;gap:8px"><textarea id="replybox" data-input="reply" data-id="${t.id}" placeholder="Write a reply…" aria-label="Reply">${esc(UI.ib.draft[t.id]??'')}</textarea><div class="acts"><button class="pri" data-act="send" data-id="${t.id}" ${(UI.ib.draft[t.id]||'').trim()?'':'disabled'}>Send (simulated)</button><button class="ghost" data-act="cancelreply" title="Draft is kept">Close draft</button><span class="faint" style="align-self:center;font-size:calc(12px * var(--workspace-text-scale, 1))">Sent replies log against the linked order.</span></div></div></div>`:`<div class="acts">${!t.handled?`<button class="pri" data-act="reply" data-id="${t.id}">Reply</button><button data-act="handled" data-id="${t.id}">${ic('check','s')} Mark handled</button>`:'<span class="pill ok">Handled</span>'}<button data-act="mailtask" data-id="${t.id}">${ic('task','s')} Create follow-up</button></div>`}`:'<div class="empty">Select a thread.</div>'}</div>
  <div class="ibctx" style="padding:14px;display:grid;gap:12px;align-content:start;background:var(--sunken)"><h3>Context</h3>${o?orderMini(o):''}${p?personMini(p):''}${t&&!p?'<div class="muted">This sender isn’t linked to anyone. Adding them runs duplicate screening first.</div>':''}${o?`<div class="sect"><h3>Open items on this order</h3><div class="list">${relatedToOrder(o).filter(a=>a.id!=='th:'+t.id).map(a=>`<div class="li click" data-act="drawer" data-id="${a.id}"><span class="dot ${a.bucket}"></span><span class="grow ell">${esc(a.title)}</span></div>`).join('')||'<div class="muted">None.</div>'}</div></div>`:''}</div></div>`}

/* --------------------------------- CALENDAR -------------------------------- */
function vCalendar(att){const mon=new Date('2026-11-16T00:00:00');const H0=8,H1=18,PX=64;const sel=S.meetings.find(m=>m.id===UI.sel.calendar);
  const days=[0,1,2,3,4].map(d=>new Date(mon.getTime()+d*DAY));
  const flagged=m=>!m.internal&&relatedTo(m).length;
  const col=d=>{const ms=S.meetings.filter(m=>sameDay(m.start,d)&&(m.internal||!m.personId||inScope(m)));return `<div class="col ${sameDay(d,NOW)?'today':''}" style="height:${(H1-H0)*PX}px">${sameDay(d,NOW)?`<div class="nowmark" style="top:${(NOW.getHours()+NOW.getMinutes()/60-H0)*PX}px"></div>`:''}${ms.map(m=>{const s=new Date(m.start),e=new Date(m.end);const top=(s.getHours()+s.getMinutes()/60-H0)*PX,h=Math.max(20,(e-s)/36e5*PX-2);return `<button class="ev ${m.internal?'':'linked'} ${sel&&sel.id===m.id?'sel':''}" style="top:${top}px;height:${h}px" data-act="calsel" data-id="${m.id}">${flagged(m)?`<span class="flag" title="Open items on this account">${relatedTo(m).length} open</span>`:''}<b>${fTime(m.start)}</b> ${esc(m.title)}</button>`}).join('')}</div>`};
  return `<div class="page"><div class="phead"><h1>Calendar</h1><span class="sub">Week of ${fDate(mon)} · ${esc(S.meetings[0]?.source||'Calendar')}, ${S.team.length} people</span><div class="right"><span class="row muted" style="font-size:calc(12px * var(--workspace-text-scale, 1))"><span class="dot" style="background:var(--accent)"></span>Linked to a customer <span class="dot" style="background:var(--info);margin-left:8px"></span>Internal</span></div></div>
  <div class="split ${sel?'open':''}"><div class="weekwrap"><div class="week"><div class="dh2" style="border-left:0"></div>${days.map(d=>`<div class="dh2 ${sameDay(d,NOW)?'today':''}">${fDay(d)}</div>`).join('')}<div class="allday-l">All day</div>${days.map(d=>`<div class="allday">${S.events.filter(e=>sameDay(e.date,d)).map(e=>`<button class="adi ev-e" data-act="goto" data-r="events" data-id="${e.id}">${esc(e.name)}</button>`).join('')}${S.tasks.filter(t=>!t.done&&(sameDay(t.due,d)||(sameDay(d,NOW)&&new Date(t.due)<NOW&&!sameDay(t.due,NOW)))).map(t=>`<button class="adi ev-t ${new Date(t.due)<NOW&&!sameDay(t.due,NOW)?'late':''}" data-act="goto" data-r="${t.orderId?'orders':t.dealId?'deals':t.threadId?'inbox':'events'}" data-id="${t.orderId||t.dealId||t.threadId||t.eventId}" title="${esc(t.title)} · due ${fTime(t.due)} · ${esc(t.owner)}">${ic('task','s')} ${esc(t.title)}</button>`).join('')}</div>`).join('')}<div class="hrs">${Array.from({length:H1-H0},(_,i)=>`<div class="hr">${String(H0+i).padStart(2,'0')}:00</div>`).join('')}</div>${days.map(col).join('')}</div></div>
  ${sel?calDetail(sel,att):''}</div></div>`}
function calDetail(m,att){const rel=m.internal?[]:relatedTo(m);const o=O(m.orderId),p=P(m.personId),e=E(m.eventId);
  return detailShell(esc(m.title),`${fDay(m.start)} · ${fTime(m.start)}–${fTime(m.end)}`,`${taskBanner(att,'calendar',m.id)}<dl class="kv"><dt>Where</dt><dd>${esc(m.where)}</dd><dt>Calendar</dt><dd>${m.source} · synced</dd>${p?`<dt>With</dt><dd>${recLink('people',p.id,p.name)} <span class="faint">${esc(p.company)}</span></dd>`:''}</dl>
  ${o?orderMini(o):e?eventMini(e):''}
  ${rel.length?`<div class="sect"><h3>Open items to raise</h3><div class="list">${rel.map(r=>`<div class="li click" data-act="drawer" data-id="${r.id}"><span class="dot ${r.bucket}"></span><span class="grow ell">${esc(r.title)}</span>${ic('arrow','s')}</div>`).join('')}</div></div>`:''}
  ${p?`<div class="sect"><h3>Recent email</h3><div class="list">${S.threads.filter(t=>t.personId===p.id).slice(0,3).map(t=>`<div class="li click" data-act="goto" data-r="inbox" data-id="${t.id}">${ic('mail','s')}<span class="grow ell">${esc(t.subject)}</span><span class="faint">${ago(t.msgs.at(-1).at)}</span></div>`).join('')||'<div class="muted">None.</div>'}</div></div>`:''}`)}

/* ------------------------------- DATA QUALITY ------------------------------- */
function dupCmp(d,actions=true){const F=[['Name','name'],['Email','email'],['Phone','phone'],['Company','company'],['Role','role']];const side=(p,o)=>`<div class="card"><b>${esc(p.name)}</b><div class="faint" style="font-size:calc(12px * var(--workspace-text-scale, 1))">${S.orders.filter(x=>x.personId===p.id).length} orders · ${p.sources.sf?'Salesforce':''}${p.sources.sf&&p.sources.hs?' + ':''}${p.sources.hs?'HubSpot':''}</div><dl class="kv" style="margin-top:8px;grid-template-columns:64px 1fr">${F.map(([l,k])=>`<dt>${l}</dt><dd class="${p[k]!==o[k]?'diff':''}" style="${p[k]!==o[k]?'background:var(--warn-soft);border-radius:3px;padding:0 3px':''}">${esc(p[k])||'<span class="faint">empty</span>'}</dd>`).join('')}</dl>${actions?`<button class="sm" style="margin-top:8px" data-act="merge" data-keep="${p.id}" data-drop="${o.id}">Keep this, merge other in</button>`:''}</div>`;
  return `<div class="row wrap">${d.why.map(w=>`<span class="pill warn">${w}</span>`).join('')}</div><div class="cmp">${side(d.a,d.b)}${side(d.b,d.a)}</div>`}
function vDQ(att){const ds=dupPairs();const sel=ds.find(d=>d.id===UI.sel.dq)||ds[0];
  return `<div class="page"><div class="phead"><h1>Data quality</h1><span class="sub">${ds.length} possible duplicate${ds.length===1?'':'s'} · matched on exact email or phone</span></div><div class="split open"><div class="tablewrap"><table class="tbl"><thead><tr><th>Record A</th><th>Record B</th><th>Signals</th></tr></thead><tbody>${ds.map(d=>`<tr class="${sel&&sel.id===d.id?'sel':''}" data-act="dqsel" data-id="${d.id}"><td class="name">${esc(d.a.name)}</td><td class="name">${esc(d.b.name)}</td><td>${d.why.map(w=>`<span class="pill">${w}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table>${ds.length?'':`<div class="empty">${ic('check')} No duplicates waiting.</div>`}</div>
  ${sel?detailShell('Compare records','Pick the record to keep. Differing values on the other are kept as alternates; its orders move across.',`${taskBanner(att,'dq',sel.id)}${dupCmp(sel)}<div class="acts"><button data-act="separate" data-id="${sel.id}">Not the same person</button></div>`,null):'<div></div>'}</div></div>`}

/* -------------------------------- CONNECTIONS ------------------------------- */
function conflictCmp(c){const ours=c.ours==='order total'?money(total(O(c.orderId))):c.ours;return `<div class="cmp"><div class="card"><div class="faint" style="font-size:calc(12px * var(--workspace-text-scale, 1))">Integral</div><b>${esc(ours)}</b></div><div class="card"><div class="faint" style="font-size:calc(12px * var(--workspace-text-scale, 1))">${c.system}</div><b>${esc(c.theirs)}</b></div></div><div class="muted" style="font-size:calc(12px * var(--workspace-text-scale, 1))">${c.field} on ${c.orderId?'order #'+O(c.orderId).number:esc(P(c.personId)?.name)} changed in both places since the last sync. Sync is paused for this record only.</div>`}
function vSync(att){const sel=S.conflicts.find(c=>c.id===UI.sel.sync);const cn=S.connectors.find(c=>c.id===UI.sel.sync);
  return `<div class="page"><div class="phead"><h1>Connections</h1><span class="sub">What Integral is syncing, and anything stuck</span></div>
  <div class="conn">${S.connectors.map(c=>`<div class="card ${cn&&cn.id===c.id?'':''}" style="${cn&&cn.id===c.id?'box-shadow:0 0 0 2px var(--accent)':''}"><div class="hd"><span class="dot ${c.status==='Healthy'?'ok':c.status==='Expiring'?'today':'now'}"></span><b class="grow">${c.name}</b><span class="pill ${c.status==='Healthy'?'ok':c.status==='Expiring'?'warn':'crit'}">${c.status}</span></div><div class="bd" style="display:grid;gap:4px;font-size:calc(12.5px * var(--workspace-text-scale, 1))"><div class="muted">${c.scope}</div><div class="row"><span class="grow">${c.dir}</span><span class="faint">${c.records.toLocaleString('en-GB')} records · ${c.last}m ago</span></div>${c.note?`<div style="color:var(--warn)">${c.note}</div><div><button class="sm pri" data-act="reconnect" data-id="${c.id}">Reconnect (simulated)</button></div>`:''}</div></div>`).join('')}</div>
  <div class="split ${sel?'open':''}"><div style="display:grid;gap:12px;min-width:0"><section class="card"><div class="hd"><h2 class="grow">Conflicts</h2><span class="faint">${S.conflicts.length}</span></div>${S.conflicts.length?`<table class="tbl"><thead><tr><th>Record</th><th>Field</th><th>System</th><th>Detected</th></tr></thead><tbody>${S.conflicts.map(c=>`<tr class="${sel&&sel.id===c.id?'sel':''}" data-act="syncsel" data-id="${c.id}"><td class="name">${c.orderId?'Order #'+O(c.orderId).number:esc(P(c.personId)?.name)}</td><td>${c.field}</td><td>${c.system}</td><td class="muted">${ago(c.at)} ago</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${ic('check')} No conflicts.</div>`}</section>
  <section class="card"><div class="hd"><h2 class="grow">Rejected records</h2><span class="faint">${S.failed.length}</span></div><div class="bd list">${S.failed.map(f=>`<div class="li"><span class="dot now"></span><span class="grow">${esc(f.summary)}<div class="faint" style="font-size:calc(12px * var(--workspace-text-scale, 1))">${f.system} · ${esc(f.record)}</div></span><button class="sm" data-act="retry" data-id="${f.id}">Retry</button></div>`).join('')||'<div class="muted">None.</div>'}</div></section>
  <section class="card"><div class="hd"><h2>Recent sync activity</h2></div><div class="bd list">${S.log.slice(0,8).map(l=>`<div class="li"><span class="faint num" style="width:44px">${ago(l.at)}</span><span>${esc(l.text)}</span></div>`).join('')}</div></section></div>
  ${sel?detailShell(`${sel.field} conflict`,`${sel.system} · ${ago(sel.at)} ago`,`${taskBanner(att,'sync',sel.id)}${conflictCmp(sel)}<div class="acts"><button class="pri" data-act="keepOurs" data-id="${sel.id}">Keep Integral value</button><button data-act="keepTheirs" data-id="${sel.id}">Use ${sel.system} value</button></div><div class="faint" style="font-size:calc(12px * var(--workspace-text-scale, 1))">The chosen value is written to both systems and the decision is logged.</div>`):''}</div></div>`}

/* ------------------------------- PIPELINE ---------------------------------- */
const tabsHtml=(items,cur,act)=>`<div class="tabs" role="tablist">${items.map(([k,l,n])=>`<button role="tab" aria-selected="${cur===k}" data-act="${act}" data-v="${k}">${esc(l)} ${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>`;
const moreRow=(route,shown,total,cols)=>total>shown?`<tr class="morerow"><td colspan="${cols}"><button class="link" data-act="more" data-r="${route}">Show ${Math.min(200,total-shown)} more of ${total-shown}</button></td></tr>`:'';
function vDeals(att){const f=UI.dl;const B=BZ();const openSt=B.dealStages.slice(0,-2);const q=f.q.toLowerCase().trim();const stF=f.stageF||'';
  const all=S.deals.filter(inScope);const attn=new Set(att.filter(a=>a.kind==='lead').map(a=>a.dealId));
  const tabOk=(d,t)=>t==='open'?!/Won|Lost/.test(d.stage):t==='attn'?attn.has(d.id):d.stage===t;

function nsCanManageFinance(){return S.biz==='events' && ['Finance','Leadership'].includes(roleOf(UI.me))}
function nsPlanFor(pkg){return S.commissionBook.plans.find(plan=>plan.id===pkg?.commissionPlanId)}
function nsFinanceDefaults(){
  if(S.biz!=='events'||S.commissionBook)return;
  S.commissionBook={revision:1,plans:[{id:'cp1',name:'Sponsorship',bps:600},{id:'cp2',name:'Event sales',bps:350}],history:[]};
  for(const pkg of S.packages)pkg.commissionPlanId=pkg.type==='Partnership'?'cp1':'cp2';
  const kind={'Headline partnership':'HLP','Gold partnership':'GLD','Exhibitor package':'EXS','Hospitality package':'VIP','Multi-event partnership':'HLP'};
  for(const deal of S.deals){
    const code=kind[deal.name.split(' · ').at(-1)];
    const options=S.packages.filter(pkg=>pkg.code.endsWith('-'+code));
    const local=options.find(pkg=>S.events.find(event=>event.id===pkg.eventId)?.territory===deal.territory);
    deal.commissionPackageId=(local||options[0])?.id||'';
    if(deal.stage==='Won')nsCaptureWin(deal,deal.lastActivity);
  }
}
function nsCaptureWin(deal,at){
  if(S.biz!=='events'||deal.commissionWon)return;
  nsFinanceDefaults();
  if(deal.commissionWon)return;
  const pkg=S.packages.find(pkg=>pkg.id===deal.commissionPackageId),plan=nsPlanFor(pkg);
  const net=northstarNetDealValue(deal);
  deal.commissionWon={day:at.slice(0,10),owner:deal.owner,gross:deal.value,net,pkg:pkg?.id||'',plan:plan?.name||'',bps:plan?.bps??null,amount:plan?Math.round(net*plan.bps/10000):0};
}
function nsFinanceFilters(){
  return UI.finance||(UI.finance={period:'all',owner:'',plan:'cp1',pkg:'',missing:false});
}
function nsFinanceRows(filters,override={}){
  nsFinanceDefaults();
  const rows=[];
  for(const deal of S.deals){
    if(deal.stage==='Lost'||(UI.scope&&deal.territory!==UI.scope))continue;
    const won=deal.stage==='Won';
    const fixed=won?deal.commissionWon:null,day=fixed?fixed.day:deal.closeDate.slice(0,10);
    const owner=fixed?fixed.owner:deal.owner,ownerFilter=nsCanManageFinance()?filters.owner:UI.me;
    if((filters.period!=='all' && day.slice(0,7)!==filters.period)||(ownerFilter&&owner!==ownerFilter))continue;
    const pkg=S.packages.find(pkg=>pkg.id===(fixed?fixed.pkg:deal.commissionPackageId));
    const assignedPlan=pkg?.id===override.pkgId?override.newPlanId:pkg?.commissionPlanId;
    const plan=S.commissionBook.plans.find(p=>p.id===assignedPlan);
    const bps=fixed?fixed.bps:plan?.id===override.planId&&override.planId?override.bps:plan?.bps;
    const net=fixed?fixed.net:northstarNetDealValue(deal);
    const weighted=won?net:Math.round(net*deal.prob);
    const commission=fixed?fixed.amount:bps!=null?Math.round(weighted*bps/10000):0;
    if(filters.missing&&bps!=null)continue;
    rows.push({deal,won,day,owner,pkg,bps,net,gross:fixed?fixed.gross:deal.value,weighted,commission,plan:fixed?fixed.plan:plan?.name});
  }
  return rows.sort((a,b)=>a.day.localeCompare(b.day)||a.deal.id.localeCompare(b.deal.id));
}
function nsFinanceTotals(rows){
  return rows.reduce((a,r)=>{
    if(r.won){a.won+=r.net;a.wonCommission+=r.commission}
    else{a.open+=r.net;a.weighted+=r.weighted;a.projection+=r.commission}
    return a;
  },{open:0,weighted:0,projection:0,won:0,wonCommission:0});
}
function nsFinanceOptions(rows,value){return rows.map(([id,name])=>'<option value="'+esc(id)+'"'+(id===value?' selected':'')+'>'+esc(name)+'</option>').join('')}
function nsRate(value){
  if(!/^\d{1,3}(?:\.\d{1,2})?$/.test(String(value))||Number(value)>100)throw Error('Enter a rate between 0 and 100 with up to two decimal places.');
  return Math.round(Number(value)*100);
}
function nsFinanceEdit(form){
  const fields=new FormData(form),mode=form.dataset.nsFinance,book=S.commissionBook;
  if(!nsCanManageFinance())throw Error('Finance or Leadership manages commission terms.');
  if(Number(form.dataset.rev)!==book.revision)throw Error('The plan changed. Reopen Finance to review the current terms.');
  if(mode==='plan'){
    const id=form.dataset.id,existing=book.plans.find(p=>p.id===id),name=String(fields.get('name')||'').trim(),bps=nsRate(fields.get('rate'));
    if(!name||name.length>80)throw Error('Enter a plan name of up to 80 characters.');
    if(id!=='new'&&!existing)throw Error('Commission plan not found.');
    if(book.plans.some(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase()))throw Error('A commission plan already uses this name.');
    return {mode,id,existing,name,bps,override:{planId:id,bps}};
  }
  const pkg=S.packages.find(p=>p.id===form.dataset.id);
  const plan=book.plans.find(p=>p.id===fields.get('plan')),raw=String(fields.get('price')||'');
  if(!pkg||!plan||!/^\d{1,8}(?:\.\d{1,2})?$/.test(raw))throw Error('Choose a plan and enter a valid catalogue price in pounds.');
  return {mode,id:pkg.id,pkg,plan,price:Math.round(Number(raw)*100),override:{pkgId:pkg.id,newPlanId:plan.id}};
}
function nsSaveFinance(edit){
  const book=S.commissionBook,filters=nsFinanceFilters(),before=nsFinanceTotals(nsFinanceRows(filters)),after=nsFinanceTotals(nsFinanceRows(filters,edit.override));
  if(edit.mode==='plan'&&edit.existing?.name===edit.name&&edit.existing.bps===edit.bps)return false;
  if(edit.mode==='package'&&edit.pkg.commissionPlanId===edit.plan.id&&edit.pkg.price===edit.price)return false;
  snap();
  let text;
  if(edit.mode==='plan'){
    const id=edit.id==='new'?'cp'+(book.plans.length+1):edit.id;
    text=edit.existing?edit.existing.name+' '+(edit.existing.bps/100)+'% → '+edit.name+' '+(edit.bps/100)+'%':'Created '+edit.name+' at '+(edit.bps/100)+'%';
    if(edit.existing)Object.assign(edit.existing,{name:edit.name,bps:edit.bps});
    else book.plans.push({id,name:edit.name,bps:edit.bps});
    filters.plan=id;
  }else{
    text=edit.pkg.code+' · '+(nsPlanFor(edit.pkg)?.name||'Unassigned')+' → '+edit.plan.name+' · list '+nsMoney(edit.pkg.price)+' → '+nsMoney(edit.price);
    Object.assign(edit.pkg,{commissionPlanId:edit.plan.id,price:edit.price,version:edit.pkg.version+1,updated:NOW.toISOString()});
  }

  return true;
}

function inviteWarning(d){

function nsRequestDiscount(id,percent,note,previousId){
  const d=nsOpenDeal(id),latest=recordReview('discount',id),text=String(percent).trim();
  if(!/^\d{1,3}(\.\d{1,2})?$/.test(text)||Number(text)>100)throw new Error('Enter a discount from 0 to 100%, using up to two decimal places.');
  const bps=Math.round(Number(text)*100),current=d.approvedDiscountBps||0;
  if(latest?.status==='Pending'||(latest?.id||'')!==previousId)throw new Error('The discount request changed. Review its current status.');
  if(current===bps)throw new Error('Choose a different discount from the current agreed price.');
  if(!String(note||'').trim())throw new Error('Explain why the deal needs this discount.');
  const approver=nsDiscountLead(UI.me);
  if(!approver)throw new Error('No independent reviewer is available.');
  const net=northstarNetDealValue(d,bps);

    desc:note.trim(),amount:d.value-net,grossPence:d.value,fromBps:current,toBps:bps,previousNet:northstarNetDealValue(d),
    proposedNet:net,ownerAtRequest:d.owner,previousRequest:latest?.id||null};

function nsReassignDeal(id,owner,note,previousOwner){

  snap();
  const change={from:d.owner,to:owner,by:UI.me,reason:note.trim(),at:NOW.toISOString(),accepted:false};

function requestReview(kind,id,withSnapshot=true){
  if(S.biz!=='events')return;

  if(!record||kind==='sale'&&record.stage!=='Negotiation'||kind==='order'&&record.stage!=='Draft')return;
  const existing=recordReview(kind,id);
  if(existing&&!['Rejected','Superseded'].includes(existing.status)&&!(kind==='sale'&&existing.status==='Approved'&&!nsTermsApproved(record))){toast('Leader review is '+existing.status.toLowerCase());return}
  const p=kind==='customer'?record:P(record.personId),lead=reviewLead(record);
  if(withSnapshot)snap();
  const a={id:'ar'+(S.approvals.length+1),subject:kind,recordId:id,orderId:kind==='order'?id:null,
    dealId:kind==='sale'?id:null,personId:p.id,territory:terrOf(record),requestedBy:UI.me,approver:lead,role:'Group lead',
    at:NOW.toISOString(),status:'Pending',amount:kind==='order'?total(record):kind==='sale'?northstarNetDealValue(record):0,
    type:kind==='customer'?'New customer':kind==='sale'?'Sale sign-off':seats(record)?'Delegate order':'Order sign-off',
    desc:kind==='customer'?'Approve onboarding for '+p.name:kind==='sale'?'Approve closing '+record.name:'Approve order #'+record.number+' for '+p.company};
  if(kind==='sale')a.pricingRevision=record.pricingRevision||0;

function orderNeedsReview(o){

    ACT.goto({r:'people',id:p.id});toast('Customer onboarding needs approval before confirmation');return true;
  }
  if(recordReview('order',o.id)?.status==='Approved')return false;
  ACT.goto({r:'orders',id:o.id});requestReview('order',o.id);return true;
}
function reviewDecision(id,status,reason=''){
  const a=AP(id);
  if(!a||a.status!=='Pending'||a.approver!==UI.me)return;
  if(!['Approved','Rejected',...(a.subject==='discount'?['Returned']:[])].includes(status))return;
  if(a.subject==='discount'&&status==='Approved'){
    const d=D(a.dealId);
    if(!d||['Won','Lost'].includes(d.stage)||d.value!==a.grossPence||(d.approvedDiscountBps||0)!==a.fromBps){toast('Deal terms changed. Return the request for a fresh review.');return}
  }
  if((a.subject==='discount'||a.subject&&['Rejected','Returned'].includes(status))&&!reason.trim()){toast('Enter the reason for this decision');return}
  snap();Object.assign(a,{status,reason:reason.trim(),decidedBy:UI.me,decidedAt:NOW.toISOString()});
  if(a.subject==='discount'&&status==='Approved'){
    const d=D(a.dealId),sale=recordReview('sale',d.id);
    d.approvedDiscountBps=a.toBps;d.pricingRevision=(d.pricingRevision||0)+1;
    if(sale?.status==='Pending')Object.assign(sale,{status:'Superseded',reason:'Approved discount changed the net sale price.',decidedAt:NOW.toISOString(),decidedBy:UI.me});
  }
  if(a.subject==='customer'&&P(a.personId))P(a.personId).onboarding=status==='Approved'?'Approved':'Pending';
  toast(a.type+' '+status.toLowerCase(),true);
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('pal'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='j'){e.preventDefault();if(UI.ai.open)UI.ai.open=false;else aiOpen();render();return}
  if(e.target.id==='aiq'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend(e.target.value);render();setTimeout(()=>document.getElementById('aiq')?.focus(),0);return}
  if(e.target.id==='aiq'&&e.key==='Escape'&&!e.target.value){UI.ai.open=false;render();return}
  if(e.key==='Escape' && UI.menu==='look'){
    e.preventDefault();UI.menu=null;render();document.querySelector('[data-act="menu"][data-v="look"]')?.focus();return;
  }
  if(e.key==='Escape' && UI.navopen && !UI.menu){e.preventDefault();UI.navopen=false;render();document.querySelector('.menu-btn')?.focus();return}
  const ae=document.activeElement;const typing=/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if(typing&&e.key==='Enter'&&ae.dataset.input==='alloc'){ae.blur();return}
  if(e.key==='Escape'){if(typing){ae.blur();return}if(UI.menu){UI.menu=null}else if(UI.ai.open){UI.ai.open=false}else if(UI.drawer){UI.drawer=null}else if(UI.acct){UI.acct=null}else if(UI.sel[UI.route]){UI.sel[UI.route]=null}else if(inNorthstarPreview()){e.preventDefault();notifyNorthstarHost('data-saver-northstar-close');return}else return;e.preventDefault();render();return}
  if(typing)return;
  // Non-button elements that act like buttons (table rows, list items) respond to Enter/Space.
  if((e.key==='Enter'||e.key===' ')&&ae.matches('[data-act][role=button]')){e.preventDefault();ae.click();return}
  // Never hijack Enter/Space on a focused control: it should do what it says.
  const tgt=e.target instanceof Element?e.target:document.body;
  if(tgt.closest('[role=dialog]'))return;
  const ctl=tgt.closest('button,a,[role=button]');
  if(ctl&&!ctl.matches('.qi')&&(e.key==='Enter'||e.key===' '))return;
  if(e.key==='/'){const s=document.querySelector('.content [data-input]');if(s){e.preventDefault();s.focus()}return}
  if(e.key==='a'&&!e.ctrlKey&&!e.metaKey){const c=aiCtx();const map={item:'item',order:'order',package:'package',event:'event',person:'person',deal:'deal',ticket:'ticket',approval:'approval',territory:'territory',home:'home',list:'list'};if(map[c.type]){ACT.explain({k:map[c.type],id:c.type==='home'?'all':c.id});render();e.preventDefault()}return}
  if(UI.route==='home'){const dash=UI.homeView!=='queue';const sel=dash?'.hm-row[data-act=hopen],.hm-slot':'.qi';const list=[...document.querySelectorAll(sel)].map(b=>b.dataset.id);const i=list.indexOf(UI.hsel);const att=attention();
    const move=j=>{UI.hsel=list[j];if(dash)UI.drawer=list[j];render();const el=[...document.querySelectorAll(sel)].find(b=>b.dataset.id===UI.hsel);el?.scrollIntoView({block:'nearest'});el?.focus()};
    if(e.key==='j'||e.key==='ArrowDown'){move(Math.min(list.length-1,i+1));e.preventDefault()}
    if(e.key==='k'||e.key==='ArrowUp'){move(Math.max(0,i-1));e.preventDefault()}
    const a=findItem(UI.hsel,att);
    if(e.key==='Enter'&&a){e.preventDefault();ACT.goto({r:a.go.route,id:a.go.id,from:a.id});render()}
    // Shift+E: the item's main action. Plain E is too easy to hit for something that writes data.
    if(e.key==='E'&&e.shiftKey&&a){const p=a.act.find(x=>x[3]);if(p){if(p[1]==='go')ACT.goto({r:a.go.route,id:a.go.id,from:a.id});else ACT[p[1]]({id:p[2],n:p[4]});render()}}
  }
  if(UI.route==='packages'&&(e.key==='j'||e.key==='k')){const ids=[...document.querySelectorAll('tr[data-act=pksel],.pcard')].map(r=>r.dataset.id);const i=ids.indexOf(UI.sel.packages);UI.sel.packages=ids[e.key==='j'?Math.min(ids.length-1,i+1):Math.max(0,i-1)];render();document.querySelector('tr.sel')?.scrollIntoView({block:'nearest'})}
});

/* ------------------------------ URL state -------------------------------- */
// #route or #route-id (e.g. #orders-o12), so refresh keeps your place and links can be shared.
function inNorthstarPreview(){
  return window.parent!==window && new URLSearchParams(location.search).get('embed')==='northstar';
}
function notifyNorthstarHost(type){
  window.parent.postMessage({type},location.protocol==='file:'?'*':location.origin);
}
document.addEventListener('click',event=>{
  if(!event.target.closest('.ds-site-home') || !inNorthstarPreview() || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey)return;
  event.preventDefault();
  notifyNorthstarHost('data-saver-northstar-home');
});
window.addEventListener('data-saver-show-northstar',()=>{
  history.replaceState(history.state,'','#events-home');
  readHash();lastHash=null;render();
});
let lastHash=null;
function roleKey(){if(S.biz==='coach')return 'you';return Object.keys(ROLE_AS).find(k=>ROLE_AS[k]===UI.me)||(S.biz==='events'?'member'+S.team.findIndex(t=>t[0]===UI.me):'you')}
function syncHash(){const sel=UI.route==='home'?'':(UI.sel[UI.route]||'');const th=document.documentElement.dataset.theme||'auto';const h=`#v-${LOOK}-${TINT||'auto'}-${th}-${S.biz}-${roleKey()}-${UI.route}${sel&&/^[a-z0-9]+$/i.test(sel)?'-'+sel:''}`;if(location.hash===h){lastHash=h;return}
  const replace=lastHash===null||inNorthstarPreview();
  lastHash=h;try{if(replace)history.replaceState(history.state,'',h);else location.hash=h;}catch{}}
// Review links: #v-<look>-<colour>-<light|dark|auto>-<business>-<you|sales|ops|finance>-<page>[-<record>]
// set the look, palette, theme, business and role in one go, then fall back to the normal #business-page-record form.
const ROLE_AS={you:'You',sales:'Priya S.',ops:'Jas B.',finance:'Mo D.'};
function defaultMine(n){return S.biz!=='group'||!/^Head of|support lead|director/i.test(titleOf(n))}
function readReviewHash(){const m=location.hash.match(/^#v-([a-z]+)-([a-z]+)-(light|dark|auto)-(coach|events|group)-(you|sales|ops|finance|member\d+)-([a-z]+)(?:-([a-z0-9]+))?$/i);if(!m)return false;
  const [,look,tint,theme,b,role,r,id]=m;setLook(look);setTint(tint);if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=theme;
  if(b!==S.biz){BIZKEY=b;try{localStorage.setItem('ds-biz',b)}catch{}S=openSample(b);undoStack=[];const keepAi=UI.ai;Object.assign(UI,freshUI());UI.ai={...keepAi,msgs:[],props:{}}}
  const nm=b==='coach'?'You':ROLE_AS[role]||(b==='events'&&S.team[Number(role.slice(6))]?.[0])||'You';if(nm!==UI.me||b!==S.biz){UI.me=nm;UI.mine=defaultMine(nm)}
  if(VIEWS[r]){UI.route=r;UI.sel[r]=id||null}lastHash=null;return true}
function readHash(){if(readReviewHash())return true;const m=location.hash.match(/^#(coach|events|group)-([a-z]+)(?:-([a-z0-9]+))?$/i);if(!m||!VIEWS[m[2]])return false;const [,b,r,id]=m;if(b!==S.biz){BIZKEY=b;try{localStorage.setItem('ds-biz',b)}catch{}S=openSample(b);undoStack=[];const keepAi=UI.ai;Object.assign(UI,freshUI());UI.ai={...keepAi,msgs:[],props:{}}}UI.route=r;if(id)UI.sel[r]=id;else if(r!=='home')UI.sel[r]=null;UI.drawer=null;return true}
window.addEventListener('hashchange',()=>{if(location.hash===lastHash)return;lastHash=location.hash;if(readHash()){lastHash=null;render();}});

/* ------------------------------ command palette ----------------------------- */
function focusClassicHeading(){const title=document.querySelector('.content h1');if(title){title.tabIndex=-1;title.focus({preventScroll:true})}}
function openPalette(){if(document.getElementById('pal'))return;
  const opener=document.activeElement;app.inert=true;
  const dismiss=(restore=true)=>{app.inert=false;layer.replaceChildren();if(restore){if(UI.drawer)render();(opener?.isConnected && opener!==document.body?opener:app.querySelector('.cmd'))?.focus()}};
  layer.innerHTML=`<div class="scrim" id="palscrim"></div><div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Search workspace"><div class="pal-head"><input id="palq" aria-label="Search workspace records" role="combobox" aria-expanded="true" aria-controls="palres" aria-autocomplete="list" placeholder="Search people, orders (#2104), packages (FWS27-DEL), events…" autocomplete="off"><button type="button" id="palclose" aria-label="Close search">${ic('x')}</button></div><div class="res" id="palres" role="listbox" aria-label="Search results"></div></div>`;const q=document.getElementById('palq');let idx=0,res=[];
  const run=()=>{const v=q.value.toLowerCase().trim();const m=(s)=>v.split(/\s+/).every(w=>s.toLowerCase().includes(w));
    const G=[['Actions',v?attention().filter(a=>m(a.title+' '+a.meta)).slice(0,4).map(a=>({l:a.title,s:KIND[a.kind].l,r:a.go.route,id:a.go.id,from:a.id,i:KIND[a.kind].i})):attention().slice(0,5).map(a=>({l:a.title,s:KIND[a.kind].l,r:a.go.route,id:a.go.id,from:a.id,i:KIND[a.kind].i}))],
      ['People',v?S.people.filter(p=>m(p.name+' '+p.email+' '+p.company)).slice(0,5).map(p=>({l:p.name,s:p.company,r:'people',id:p.id,i:'people'})):[]],
      ['Orders',v?S.orders.filter(o=>m('#'+o.number+' '+P(o.personId)?.company+' '+E(o.eventId).name)).slice(0,5).map(o=>({l:`#${o.number} · ${P(o.personId)?.company}`,s:`${E(o.eventId).name} · ${o.stage}`,r:'orders',id:o.id,i:'orders'})):[]],
      ['Packages',v?S.packages.filter(p=>m(p.code+' '+p.name+' '+E(p.eventId).name)).slice(0,6).map(p=>({l:`${p.name}`,s:`${p.code} · ${E(p.eventId).name}`,r:'packages',id:p.id,i:'pkg'})):[]],
      ['Events',v?S.events.filter(e=>m(e.name+' '+e.venue+' '+e.code)).slice(0,4).map(e=>({l:e.name,s:fDateY(e.date),r:'events',id:e.id,i:'events'})):[]]];
    res=G.flatMap(g=>g[1]);idx=Math.min(idx,Math.max(0,res.length-1));let n=0;
    document.getElementById('palres').innerHTML=G.filter(g=>g[1].length).map(g=>`<div class="grp">${g[0]}</div>${g[1].map(o=>{const k=n++;return `<button class="o" id="classic-result-${k}" role="option" tabindex="-1" data-k="${k}" aria-selected="${k===idx}">${ic(o.i)}<span class="grow ell">${esc(o.l)}</span><span class="faint ell" style="max-width:45%">${esc(o.s)}</span></button>`}).join('')}`).join('')||'<div class="empty">No matches</div>';if(res.length)q.setAttribute('aria-activedescendant','classic-result-'+idx);else q.removeAttribute('aria-activedescendant')};
  const go=k=>{const o=res[k];if(!o)return;dismiss(false);ACT.goto({r:o.r,id:o.id,from:o.from});render();focusClassicHeading()};
  q.addEventListener('input',()=>{idx=0;run()});
  q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){idx=Math.min(res.length-1,idx+1);run();e.preventDefault()}else if(e.key==='ArrowUp'){idx=Math.max(0,idx-1);run();e.preventDefault()}else if(e.key==='Enter'){go(idx)}document.getElementById('classic-result-'+idx)?.scrollIntoView({block:'nearest'})});
  document.getElementById('palres').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)go(+b.dataset.k)});
  const close=document.getElementById('palclose');close.onclick=()=>dismiss();
  document.getElementById('palscrim').onclick=()=>dismiss();
  document.getElementById('pal').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();dismiss()}else if(e.key==='Tab'){e.preventDefault();(document.activeElement===q?close:q).focus()}};
  run();q.focus()}

if (app) restoreClassicTextSize();
readHash();render();
</script>
