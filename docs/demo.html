/* Hierarchy audit: emphasis, section boundaries and recognisable control states. */
.scene{--control-border:#aab3c4;--heading-wash:color-mix(in srgb,var(--soft) 55%,var(--panel));--focus-ring:#a45b00}
.scene button{font-weight:600;transition:background-color .12s ease,border-color .12s ease,box-shadow .12s ease}
.scene button:not(.text-button):not(.quiet){border-color:var(--control-border)}
.scene button:not(.text-button):not(.quiet):hover:not(:disabled){border-color:var(--accent);box-shadow:0 2px 5px #17253a12}
.scene .primary,.scene [data-do="next"]{background:var(--accent);color:var(--action-ink,#fff);border-color:var(--accent);font-weight:700;box-shadow:0 2px 4px #17253a16}
.scene .primary:hover:not(:disabled),.scene [data-do="next"]:hover:not(:disabled){background:var(--accent);filter:brightness(.92)}
.scene [data-do="previous"]{background:var(--panel);color:var(--ink)}
.scene button:disabled{cursor:not-allowed;opacity:.48;box-shadow:none;filter:none}
.scene .text-button{font-weight:650;text-decoration-thickness:1px;text-underline-offset:4px}
.scene .text-button:hover:not(:disabled){text-decoration:underline;background:transparent;box-shadow:none}
.scene button:focus-visible,.scene input:focus-visible,.scene select:focus-visible,.scene textarea:focus-visible,.scene [tabindex]:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}
.scene .page-heading h1{font-weight:750;line-height:1.18}
.scene .page-heading{margin-bottom:28px}
.scene .panel-head{border-bottom:1px solid var(--border);background:var(--heading-wash);margin-bottom:17px;padding-bottom:17px}
.scene .panel-head h2{font-size:calc(16px * var(--workspace-text-scale, 1));font-weight:750;line-height:1.35;color:var(--ink)}
.scene .panel-head p{margin-top:7px;line-height:1.6}
.scene .stat-label{color:var(--ink);font-weight:650;font-size:calc(11px * var(--workspace-text-scale, 1));line-height:1.45}
.scene .stat-value{font-weight:750;letter-spacing:-1px}
.scene .stat-note{font-size:calc(11px * var(--workspace-text-scale, 1));line-height:1.6}
.scene .eyebrow{font-weight:700}
.scene .pill{font-weight:600;background:var(--soft);border-color:var(--border);box-shadow:none}
.scene th{font-weight:750;color:var(--ink);background:var(--heading-wash);font-size:calc(10px * var(--workspace-text-scale, 1))}
.scene td{border-bottom-color:var(--border)}
.scene .view-nav button{border-color:transparent;font-weight:550;box-shadow:none}
.scene .view-nav button.active{font-weight:750;box-shadow:inset 0 -3px var(--accent)}
.scene .view-nav button:hover:not(:disabled){box-shadow:none}
.scene .check-label{padding:12px 14px;border:1px solid var(--control-border);border-radius:9px;background:var(--panel);color:var(--ink);font-size:calc(12px * var(--workspace-text-scale, 1));line-height:1.6;cursor:pointer}
.scene .check-label:has(input:checked){border-color:var(--accent);background:var(--soft);font-weight:650}
.scene input[type="checkbox"]{width:17px;height:17px;min-width:17px;margin:0;accent-color:var(--accent);cursor:pointer}
.scene .workbench-field,.scene .role-filter{font-weight:650;color:var(--ink);font-size:calc(11px * var(--workspace-text-scale, 1))}
.scene .workbench-field input,.scene .workbench-field select,.scene .workbench-field textarea,.scene .role-filter select{border-color:var(--control-border);background:var(--panel);font-weight:450}
.scene .role-toolbar{border-color:var(--control-border)}
.scene .scenario-controls label{font-weight:600;color:var(--ink)}
.scene .role-callout{border-left-width:4px;border-block:1px solid var(--border);border-right:1px solid var(--border)}
.scene .role-callout strong{font-size:calc(12px * var(--workspace-text-scale, 1));font-weight:750;color:var(--ink)}
.scene .automation-list button.selected,.scene .call-queue button.selected{border-color:var(--accent);box-shadow:inset 4px 0 var(--accent);background:var(--soft)}
.scene .workbench-tabs button.active{background:var(--accent);color:var(--action-ink,#fff);border-color:var(--accent);box-shadow:none}
.scene .role-request{padding:22px 0}
.scene .role-request>.row>strong,.scene .insight>strong{font-weight:700}
.scene .scene-label .sample{color:var(--ink)}
.preset-info button{background:#354b8e;color:white;border-color:#354b8e;font-weight:700}
.preset-info button:hover{background:#293d79}

.editorial .role-toolbar{background:#e5e1d5;border:1px solid #b4ad9c;border-left:4px solid var(--ink);padding:18px 20px}

.editorial .scenario-summary{background:#e1e6d7;border:1px solid #a4b199;border-top:4px solid var(--accent)}

/* Role workbench: evidence and exceptions remain distinct from completed outputs. */
.depth-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start;margin-bottom:24px}
.depth-list{display:flex;flex-direction:column;gap:10px}.scene .depth-list button{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:18px;text-align:left;white-space:normal;line-height:1.5;background:var(--panel);border:1px solid var(--border)}
.scene .depth-list button.selected{border:2px solid var(--accent);box-shadow:inset 4px 0 var(--accent)}
.depth-list strong{font-size:calc(15px * var(--workspace-text-scale, 1))}.depth-list span,.depth-list small{font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted)}

.depth-progress{list-style:none;padding:0;display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 0}.depth-progress li{display:flex;align-items:flex-start;gap:9px;flex:1;min-width:140px;font-size:calc(12px * var(--workspace-text-scale, 1));color:var(--muted)}

  color: var(--text);

/* A destination's border signals its selection. Keyboard focus has its own ring. */
#studio-root .scene :is(nav, .al-nav-group, .workbench-tabs) button[data-view]:not([aria-current="page"]) {
  border-color: transparent;
  box-shadow: none;
}
#studio-root .scene :is(nav, .al-nav-group, .workbench-tabs) button[data-view][aria-current="page"] {
  border: 1px solid var(--accent, currentColor);
}
#studio-root .scene.glass .glass-identity :is(.glass-nav-link, .workbench-tabs button):not([aria-current="page"]) {
  background: transparent;
  color: var(--text);
  border-color: transparent;
  box-shadow: none;
}
#studio-root .scene.glass .glass-identity :is(.glass-nav-link, .workbench-tabs button):not([aria-current="page"]):hover {
  background: var(--soft);
}

  color: var(--action-ink);
  background: var(--glass-fill);
  border-color: var(--focus-ring);
  font-weight: 650;
  box-shadow: none;
}

/* The painted rail shares both end stops with the native thumb. */
.workspace-range {
  --thumb-width: 28px;
  --thumb-height: 22px;
  --size-rail: #c0cbd7;
  --size-fill-start: #457dba;
  --size-fill-end: #62a6c1;
  --size-edge: rgba(49, 85, 113, .64);
  --size-rim: rgba(255, 255, 255, .96);
  --size-reflection: rgba(255, 255, 255, .44);
  --size-tint: rgba(150, 195, 217, .22);
  --size-focus: #315d9c;
  --size-shadow: rgba(21, 57, 78, .24);
  position: relative;
  display: grid;
  align-items: center;
  min-width: 54px;
}
.workspace-size-readout {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-weight: 600;
}
.workspace-size-readout label, .workspace-size-readout output { white-space: nowrap; }
.workspace-size-readout output { font-variant-numeric: tabular-nums; }
.workspace-range-rail {
  position: absolute;
  inset-inline: calc(var(--thumb-width) / 2);
  height: 6px;
  overflow: hidden;
  pointer-events: none;
  border-radius: 6px;
  background: var(--size-rail);
  box-shadow: inset 0 1px 2px #18314f45, 0 1px 0 #ffffff75;
}
.workspace-range-rail::before {
  content: "";
  display: block;
  width: var(--range-fill, var(--workspace-size-fill));
  height: 100%;
  background: linear-gradient(90deg, var(--size-fill-start), var(--size-fill-end));
  box-shadow: inset 0 1px 1px #ffffff61, inset 0 -1px 1px #0f527955;
}
.workspace-range > input.workspace-range-input {
  position: relative;
  display: block;
  box-sizing: border-box;
  width: 100%;
  height: 32px;
  padding: 0;
  margin: 0;
  appearance: none;
  /* Theme input surfaces must leave the rail visible below the native range. */
  background: transparent !important;
  border: none;
  box-shadow: none;
  cursor: pointer;
  --lens: radial-gradient(ellipse at 35% 12%, var(--size-rim), transparent 48%),
          linear-gradient(165deg, var(--size-reflection), var(--size-tint) 55%, var(--size-reflection));
  --rim: inset 0 0 0 1px var(--size-rim), inset 0 -3px 3px -1px var(--size-reflection), 0 2px 4px var(--size-shadow);
}
.workspace-range-input::-webkit-slider-runnable-track {
  height: 6px;
  background: transparent;
  border: 0;
  box-shadow: none;
}
.workspace-range-input::-moz-range-track { height: 6px; background: transparent; border: 0; }
.workspace-range-input::-moz-range-progress { background: transparent; }
.workspace-range-input::-webkit-slider-thumb {
  box-sizing: border-box;
  appearance: none;
  width: var(--thumb-width);
  height: var(--thumb-height);
  margin-top: calc((6px - var(--thumb-height)) / 2);
  border-radius: 99px;
  border: 1px solid var(--size-edge);
  background: var(--lens);
  box-shadow: var(--rim);
  -webkit-backdrop-filter: blur(1px) saturate(1.25);
  backdrop-filter: blur(1px) saturate(1.25);
}
.workspace-range-input::-moz-range-thumb {
  box-sizing: border-box;
  width: var(--thumb-width);
  height: var(--thumb-height);
  border-radius: 99px;
  border: 1px solid var(--size-edge);
  background: var(--lens);
  box-shadow: var(--rim);
  backdrop-filter: blur(1px) saturate(1.25);
}
.workspace-range > input.workspace-range-input:focus-visible { outline: none; }
.workspace-range-input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--size-focus); outline-offset: 2px; }
.workspace-range-input:focus-visible::-moz-range-thumb { outline: 2px solid var(--size-focus); outline-offset: 2px; }
@media (pointer: coarse) { .workspace-range > input.workspace-range-input { height: 44px; } }
@media (forced-colors: active) {
  .workspace-range-rail { display: none; }
  .workspace-range > input.workspace-range-input { appearance: auto; }
  .workspace-range > input.workspace-range-input:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
  .workspace-range-input::-webkit-slider-thumb, .workspace-range-input::-webkit-slider-runnable-track { all: revert; }
  .workspace-range-input::-moz-range-track, .workspace-range-input::-moz-range-progress, .workspace-range-input::-moz-range-thumb { all: revert; }
}

  --size-rail: #526278;
  --size-fill-start: #75acdf;

}

/* Shared by the site and the workspace. Identity sheets own the colours and borders.
   Their ID-based selectors differ, so only interaction timing takes precedence here. */
:root {
  --control-settle: 300ms;
  --control-ease: cubic-bezier(.25, .65, .35, 1);
}

@media (prefers-reduced-motion: no-preference) {
  :where(button, select, summary, .button, .text-link, .preview-record-link, .preset-card, nav a) {
    transition-property: background-color, border-color, box-shadow, color, opacity, filter !important;
    transition-duration: var(--control-settle) !important;
    transition-timing-function: var(--control-ease) !important;
  }

  /* A press needs immediate acknowledgement; releasing it settles more slowly. */
  :where(button, summary, .button, .text-link):active {
    transition-duration: 100ms !important;
  }

  .control-chevron {
    transition: transform 240ms var(--control-ease) !important;
  }
}

/* Keep pointer targets fixed as their pressed or hovered surfaces change. */
:where(button, .button, .text-link, .preset-card):is(:hover, :active) {

function validContactAddress(value) {
  return /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(String(value || '').trim());
}

function emailCanBeUsed(contact) {
  return validContactAddress(contact?.email) &&
    !/inferred|guess|suggest|unverified|invalid|bounc|undeliverable|failed|unknown|catch[- ]all|accept[- ]all/i.test(contact.emailStatus || '');
}

function normalizedContactAddress(address) {
  return String(address || '').trim().toLowerCase();
}

function contactHasAddress(contact, address) {
  const value = normalizedContactAddress(address);
  const aliases = Array.isArray(contact.emailAliases) ? contact.emailAliases : [];
  return Boolean(value) && [contact.email, contact.suggestedEmail, ...aliases].some(item => normalizedContactAddress(item) === value);
}

function matchesAddressSuggestion(contact, address, selectedSuggestion) {
  const value = normalizedContactAddress(address);
  if (!value) return false;
  if ([selectedSuggestion, contact?.suggestedEmail].some(item => normalizedContactAddress(item) === value)) return true;
  return normalizedContactAddress(contact?.email) === value && /inferred|guess|suggest|unverified/i.test(contact?.emailStatus || '');
}

function setContactAddress(contact, address) {
  if ((contact.email || '').trim().toLowerCase() !== address.toLowerCase()) {
    delete contact.emailEvidence;
    delete contact.emailStatus;
  }
  contact.email = address;
  if (address) delete contact.suggestedEmail;
}

const APPROVAL_ROLES = {sales:'Sales', operations:'Operations', saleslead:'Sales leadership', leadership:'Company leadership'};

function approvalStatus(d,r) {

    if (deal && (deal.accountId!==r.accountId || deal.valuePence!==r.valuePence || (deal.pricing?.revision || 0)!==(r.priceRevision || 0))) return 'changed';

function discountProposal(deal,percent) {
  const rate=String(percent ?? '').trim();
  if (!/^\d{1,3}(?:\.\d{1,2})?$/.test(rate)) throw new Error('Enter a discount percentage with up to two decimal places.');
  const rateBps=Math.round(Number(rate)*100);
  if(rateBps<=0 || rateBps>10000) throw new Error('Enter a discount between 0.01% and 100%.');
  const priorPence=deal.valuePence, last=deal.pricing;
  const grossPence=last && last.netPence===priorPence ? last.grossPence : priorPence;
  const netPence=Math.round(grossPence*(10000-rateBps)/10000);
  if(!Number.isSafeInteger(grossPence) || grossPence<=0 || netPence===priorPence) throw new Error('Choose a discount that changes the deal price.');
  return {grossPence,priorPence,netPence,rateBps,baseRevision:last?.revision || 0};
}

    if(existingId && (!target || (!previous && target.onboardingStatus!=='Prospect'))) throw new Error('Choose a prospect awaiting onboarding.');

    valuePence=v.amountPence ?? target.amountPence;
    if(!Number.isSafeInteger(valuePence) || valuePence<=0 || valuePence>1000000000) throw new Error('Enter a valid quote amount up to £10m.');

    targetId=target.id; accountId=target.accountId; valuePence=target.valuePence; title=target.name;
    if(type==='discount') discount=discountProposal(target,v.discountPercent);
  }
  const linkedAccount=d.accounts.find(a=>a.id===accountId);
  if (['order','sale','discount'].includes(type) && linkedAccount?.onboardingStatus && linkedAccount.onboardingStatus!=='Active customer') throw new Error('Complete customer onboarding before requesting commercial sign-off.');
  if (previous && (previous.targetId!==targetId || previous.subjectId!==subjectId)) throw new Error('Revise the original record.');
  if (d.approvalRequests.some(r=>r!==previous && r.type===type && r.targetId===targetId && r.subjectId===subjectId)) throw new Error('This record already has a request. Open its history.');

}

function approvalSource(d,r) {
  if (r.type==='customer') return d.accounts.find(a=>a.id===r.targetId);
  if (r.type==='delegate') return d.domain.find(a=>a.id===r.targetId);
  if (r.type==='quote') return d.quotes.find(q=>q.id===r.targetId);
  return d.opportunities.find(o=>o.id===r.targetId);
}

function applyApprovalStatus(d,r,source,status) {
  if (r.type==='discount' && status==='approved') {
    const {grossPence,netPence,rateBps,baseRevision}=r.discount;
    source.valuePence=netPence;
    source.pricing={grossPence,netPence,rateBps,revision:baseRevision+1};
    if(source.termsStatus==='Terms approved') source.termsStatus='New terms need sign-off';
  }
  if (r.type==='quote') source.status={pending:'Awaiting approval',approved:'Approved (demo)',denied:'Changes requested'}[status];
  if (r.type==='customer') source.onboardingStatus={pending:'Pending sign-off',approved:'Active customer',denied:'Changes requested'}[status];
  if (r.type==='order') source.orderStatus={pending:'Held for sign-off',approved:'Released to fulfilment',denied:'Order on hold'}[status];
  if (r.type==='sale') source.termsStatus={pending:'Awaiting sign-off',approved:'Terms approved',denied:'Terms returned'}[status];
  if (r.type==='delegate' && status==='approved') source.fields.Registered++;

function recordApprovalEvent(d,r,status,role,note) {

  r.status=status;

  d.activity.unshift({action:APPROVAL_TYPES[r.type].label+' '+(status==='pending'?'submitted':status),accountId:r.accountId,
    opportunityId:['sale','order','discount'].includes(r.type)?r.targetId:undefined,recordId:r.targetId,actor:APPROVAL_ROLES[role],detail:r.discount ? [discountDescription(r.discount),note].filter(Boolean).join(' · ') : note,at});

function discountDescription(discount) {
  const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n/100);
  return money(discount.grossPence)+' list · '+(discount.rateBps/100)+'% discount · '+money(discount.priorPence)+' → '+money(discount.netPence);
}

function latestApproval(d,id,version) {
  const r=d.approvalRequests.find(item=>item.id===id);
  if (!r || !Number.isInteger(Number(version)) || String(version).trim()==='' || Number(version)!==r.history.length) throw new Error('This request has changed. Review its latest version.');
  return r;
}

function requestApproval(d,role,type,values={}) {
  const previous=values.requestId ? latestApproval(d,values.requestId,values.version) : null;
  if (previous && (!['denied','changed',...(type==='discount'?['approved']:[])].includes(approvalStatus(d,previous)) || previous.requester!==role || previous.type!==type)) throw new Error('Only the requesting team can revise its returned request.');
  const p=approvalPlan(d,role,type,values,previous);
  const r=previous || {id:d.id+'-approval-'+(d.approvalRequests.length+1),type,requester:role,reviewer:APPROVAL_TYPES[type].reviewer,reviewerTitle:approvalLeader(d,type),history:[]};
  const {target,customer,...fields}=p;
  Object.assign(r,fields);
  let source=target;
  if (type==='customer') {
    source=target || {id:r.targetId,owner:d.team.find(t=>t.department===(role==='operations'?'Delivery':'Growth sales')).name};
    Object.assign(source,customer);r.customerSnapshot={...customer};
    if (!target) d.accounts.push(source);
  }
  if (type==='quote') source.amountPence=p.valuePence;
  if (!previous) d.approvalRequests.unshift(r);
  applyApprovalStatus(d,r,source,'pending');
  recordApprovalEvent(d,r,'pending',role,p.reason);
  return r;
}

function decideApproval(d,role,id,version,decision,note='') {
  const r=latestApproval(d,id,version);
  if (r.reviewer!==role || r.requester===role) throw new Error('Only the assigned leadership team can decide this request.');
  if (r.status!=='pending' || !['approved','denied'].includes(decision)) throw new Error('Only a pending request can be approved or denied.');
  note=String(note).trim();
  if (decision==='denied' && !note) throw new Error('Explain the change the requesting team needs to make.');
  const source=approvalSource(d,r);
  if (!source) throw new Error('The linked record is unavailable.');
  if (decision==='approved') {
    if (r.type==='delegate' && (source.status==='Delivered' || Number(source.fields.Registered)>=Number(source.fields.Capacity))) throw new Error('This event no longer has an available place. Return the request to the team.');
    if (r.type==='customer' && Object.entries(r.customerSnapshot).some(([key,value])=>source[key]!==value)) throw new Error('The customer details changed. Return this request for revision.');
    if (['sale','order','discount'].includes(r.type)) {
      const eligible=r.type!=='order'?source.probability<1:source.probability===1;
      const account=d.accounts.find(a=>a.id===source.accountId);
      if(!account || (account.onboardingStatus && account.onboardingStatus!=='Active customer')) throw new Error('Complete customer onboarding before approving commercial terms.');
      const expectedRevision=r.type==='discount'?r.discount?.baseRevision:r.priceRevision;
      if(!eligible || (source.pricing?.revision || 0)!==(expectedRevision || 0) || source.valuePence!==r.valuePence || source.accountId!==r.accountId) throw new Error('The linked terms changed. Return this request for revision.');
    }
    if(r.type==='discount') {
      const proposed=discountProposal(source,r.discount.rateBps/100);
      if(Object.keys(proposed).some(k=>proposed[k]!==r.discount[k])) throw new Error('The discount basis changed. Return this request for revision.');
    }
    if (r.type==='quote' && (source.status!=='Awaiting approval' || source.amountPence!==r.valuePence || d.contacts.find(c=>c.id===source.contactId)?.accountId!==r.accountId)) throw new Error('The linked terms changed. Return this request for revision.');
  }
  applyApprovalStatus(d,r,source,decision);
  recordApprovalEvent(d,r,decision,role,note);
  return r;
}

function initializeApprovals(d) {
  if (Array.isArray(d.approvalRequests)) return d;
  d.approvalRequests=[];
  const confirmed=d.opportunities.find(o=>o.probability===1);
  if (confirmed) requestApproval(d,'operations','order',{targetId:confirmed.id,reason:'The customer has confirmed the order. Please release the agreed scope to fulfilment.'});
  const proposal=d.opportunities.filter(o=>o.probability<1).at(-1);
  if (proposal) requestApproval(d,'sales','sale',{targetId:proposal.id,reason:'Review the proposed contract value before we confirm terms with the customer.'});
  if (d.id==='events') {
    const event=d.domain.find(x=>x.status==='On sale');
    const contact=approvalContacts(d)[0];
    if (event && contact) requestApproval(d,'operations','delegate',{targetId:event.id,subjectId:contact.id,reason:'The group organiser requested a delegate place. Please confirm the allocation.'});
  }
  return d;
}

const COLLECTION_DAY='2026-11-20';
const COLLECTION_ACTIONS={
  reminder:'Prepare reminder draft',chase:'Log completed chase',promise:'Record promise to pay',
  dispute:'Open dispute',resolve:'Resolve dispute',followup:'Schedule follow-up',query:'Log supplier or internal query'
};
const collectionTrim=v=>String(v??'').trim();
function collectionDate(value){
  const n=Date.parse(value+'T00:00:00Z');
  return /^\d{4}-\d{2}-\d{2}$/.test(value) && Number.isFinite(n) && new Date(n).toISOString().slice(0,10)===value;
}
function collectionOffsetDay(days){return new Date(Date.parse(COLLECTION_DAY+'T00:00:00Z')+days*86400000).toISOString().slice(0,10);}
function collectionOpenAmount(record){
  return Math.max(0,(record.totalPence??record.amountPence)-(record.paidPence||0));
}
function collectionDueDate(r){
  if(r.dueDate || r.due)return r.dueDate||r.due;
  if(r.overdueDays)return collectionOffsetDay(-r.overdueDays);
  if(Number.isInteger(r.dueMonth))return new Date(Date.UTC(2026,10+r.dueMonth,20)).toISOString().slice(0,10);
  return '';
}
function initializeCollections(d){
  d.invoices.forEach((r,i)=>{
    r.dueDate||=collectionDueDate(r);
    r.financeOwner||=d.team[(i%2)+6].name;
    if(d.id==='events')r.eventId||=d.domain.find(x=>x.accountId===r.accountId)?.id;
  });
  d.bills.forEach((r,i)=>{
    r.number||='SUP-'+(701+i);
    r.financeOwner||=d.team[4+i%2].name;
    if(d.id==='events')r.eventId||=d.domain[i%d.domain.length].id;
  });
  if(d.id==='events'){
    const examples=[
      [d.invoices[6], 'promise','The event sponsor confirmed a part payment for the venue deposit.','Check the promised remittance.'],
      [d.invoices[12],'dispute','The sponsor queried the second delegate package on the invoice.','Check the signed delegate allocation.'],
      [d.bills[1],'query','The venue coordinator requested a copy of the agreed catering schedule.','Chase the venue coordinator for the schedule.']
    ];
    for(const [r,action,note,nextAction] of examples){
      if(!r||r.collection||!collectionOpenAmount(r))continue;
      const lastDay='2026-11-16';
      recordCollectionAction(d,'finance',r.id,{action,note,nextAction,owner:r.financeOwner,channel:'Email',
        nextDue:action==='promise'?'2026-11-19':'2026-11-20',promiseDate:'2026-11-19',promiseAmount:'100'},0,lastDay);
      r.collection.history[0].at=lastDay+'T10:00:00Z';d.activity[0].at=r.collection.history[0].at;
    }
  }
  return d;
}
function collectionSource(d,id){
  return d.invoices.find(r=>r.id===id) || d.bills.find(r=>r.id===id);
}
function collectionState(r,today=COLLECTION_DAY){
  const c=r.collection||{};
  if(!collectionOpenAmount(r))return 'Settled';
  if(c.dispute)return 'Disputed';
  if(outstandingPromise(r))return c.promise.date<today?'Promise overdue':'Promised to pay';
  if(c.nextDue && c.nextDue<=today)return 'Follow-up due';
  if(collectionDueDate(r) && collectionDueDate(r)<today)return 'Overdue';
  return 'Open';
}
function collectionAvailableActions(r,today=COLLECTION_DAY){
  if(!collectionOpenAmount(r))return [];
  const supplier=r.amountPence!=null;
  const actions=supplier?['query','followup']:['chase','followup','promise'];
  if(!supplier && !(outstandingPromise(r) && r.collection.promise.date>=today))actions.unshift('reminder');
  if(!r.collection?.dispute)return [...actions,'dispute'];
  return [...(supplier?['query']:['chase']),'followup','resolve'];
}
function recordCollectionAction(d,role,id,input,revision,today=COLLECTION_DAY){
  if(role!=='finance')throw new Error('Use the Finance desk to update collection follow-ups.');
  const r=collectionSource(d,id);
  if(!r)throw new Error('Invoice not found.');
  if(!collectionOpenAmount(r))throw new Error('This invoice is settled.');
  const c=r.collection||{history:[]};
  const action=collectionTrim(input.action),note=collectionTrim(input.note),owner=collectionTrim(input.owner),nextDue=collectionTrim(input.nextDue);
  const nextAction=collectionTrim(input.nextAction);
  const channel=['chase','query'].includes(action)?collectionTrim(input.channel):'';
  const promiseDate=action==='promise'?collectionTrim(input.promiseDate):'';
  const amountText=action==='promise'?collectionTrim(input.promiseAmount):'';
  const signature=JSON.stringify([action,note,owner,nextAction,nextDue,channel,promiseDate,amountText,today]);
  const rev=c.history.length;
  if(!Number.isInteger(Number(revision)) || String(revision??'').trim()==='')throw new Error('Reopen the record to load its current revision.');
  if((rev!==Number(revision) && c.history[Number(revision)]?.signature===signature) || c.history.at(-1)?.signature===signature)return {record:r,duplicate:true};
  if(rev!==Number(revision))throw new Error('This invoice changed. Reopen it before saving.');
  if(!collectionAvailableActions(r,today).includes(action))throw new Error('This action is unavailable for the current invoice state.');
  if(!d.team.some(t=>t.name===owner))throw new Error('Choose the person responsible for the next action.');
  if(!collectionDate(nextDue)||nextDue<today)throw new Error('Choose a follow-up date today or later.');
  if(!nextAction)throw new Error('Describe the next action for the assigned owner.');
  if(!note)throw new Error('Add the message, outcome or reason for this action.');
  if(['chase','query'].includes(action) && !['Email','Phone','Meeting','Internal review'].includes(channel))throw new Error('Choose how you contacted the customer, supplier or colleague.');
  const amountPence=Math.round(Number(amountText)*100);
  if(action==='promise'){
    if(!collectionDate(promiseDate)||promiseDate<today||nextDue<promiseDate)throw new Error('Choose a promise date today or later and a follow-up on or after it.');
    if(!/^\d+(\.\d{1,2})?$/.test(amountText)||!Number.isSafeInteger(amountPence)||amountPence<=0||amountPence>collectionOpenAmount(r))throw new Error('Enter a promise amount up to the outstanding balance.');
  }
  const event={action,label:COLLECTION_ACTIONS[action],owner,nextAction,nextDue,note,channel,at:new Date().toISOString(),signature};
  if(action==='dispute'){
    c.dispute=note;delete c.promise;
    if(r.paymentAuthorisation)r.paymentAuthorisation.status='On hold for supplier dispute';
  }
  if(action==='resolve')delete c.dispute;
  if(action==='promise'){c.promise={date:promiseDate,amountPence,paidAtPromise:r.paidPence||0};event.promise={...c.promise};}
  if(action==='reminder')event.draft={subject:'Reminder for invoice '+r.number,body:note};
  c.owner=owner;c.nextDue=nextDue;c.history.push(event);r.collection=c;
  d.activity.unshift({action:event.label,recordId:id,accountId:r.accountId||null,detail:[r.number,channel,note,'Follow up '+nextDue+' · '+owner].filter(Boolean).join(' · '),at:event.at,actor:'Finance'});
  return {record:r,duplicate:false};
}
function outstandingPromise(r){
  const p=r.collection?.promise;
  return p?Math.max(0,Math.min(collectionOpenAmount(r),p.amountPence-Math.max(0,(r.paidPence||0)-p.paidAtPromise))):0;
}
function collectionAttentionDue(r,today=COLLECTION_DAY){
  const c=r.collection||{};
  return outstandingPromise(r) && c.promise.date<today?c.promise.date:c.nextDue||collectionDueDate(r);
}
function collectionsAlerts(d,today=COLLECTION_DAY){
  return [...d.invoices,...d.bills].flatMap(r=>{
    if(!collectionOpenAmount(r))return [];
    const c=r.collection||{},supplier=r.amountPence!=null, due=collectionAttentionDue(r,today);
    const overduePromise=outstandingPromise(r)>0 && c.promise.date<today;
    if(!due || due>today)return [];
    const title=overduePromise?'Review overdue payment promise':c.dispute?'Follow up disputed '+(supplier?'supplier bill':'invoice'):
      c.nextDue?'Invoice follow-up due':supplier?'Supplier invoice due':'Customer invoice due';
    const source=supplier?r.supplier:d.accounts.find(a=>a.id===r.accountId)?.name;
    return [{id:'collections-'+r.id,recordId:r.id,title,detail:[r.number,source,c.history?.at(-1)?.nextAction].filter(Boolean).join(' · '),owner:c.owner||r.financeOwner,due,
      severity:overduePromise || due<today?'urgent':'warning',revision:c.history?.length||0}];
  });
}
function approveCollectionBill(d,id){

  if(!bill)throw new Error('Supplier invoice not found.');

const finRoles={finance:'Finance',leadership:'Finance director'};
const finFinal=new Set(['Reconciled','Closed after review']);
const finClean=v=>String(v??'').trim();
const finKey=v=>finClean(v).toLowerCase();
function finDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const t=new Date(v+'T12:00:00Z');return !Number.isNaN(t.valueOf()) && t.toISOString().slice(0,10)===v;}
function finStamp(c,role,action,evidence) {
  c.history.push({status:c.status,at:new Date().toISOString(),role,action,evidence});
}
function openFinancePeriodCases(d,period) {
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(period))return [];
  return (d.financeExceptions || []).filter(c=>c.source.date.slice(0,7)===period && !finFinal.has(c.status));
}

function financeExceptionAlerts(d,role) {
  return (d.financeExceptions||[]).filter(c=>!finFinal.has(c.status) && (c.status==='Risk hold'?'leadership':'finance')===role).map(c=>({
    id:c.id,financeExceptionId:c.id,revision:c.history.length,severity:c.status==='Risk hold'?'urgent':'warning',
    title:c.status==='Risk hold'?'Review suspicious receipt':c.status==='Unapplied'?'Allocate customer credit':c.status==='Awaiting evidence'?'Follow up missing remittance':'Investigate unmatched receipt',
    owner:finRoles[role],detail:c.source.payer+' · '+c.source.reference+' · '+c.status,due:c.followUp || undefined
  }));
}
function addFinanceLine(d,role,input) {
  if(role!=='finance')throw new Error('Finance records statement lines.');
  const reference=finClean(input.reference),payer=finClean(input.payer),date=finClean(input.date),origin=finClean(input.origin);
  if(!payer || !reference || !finDate(date) || !['Bank statement','Processor settlement'].includes(origin))throw new Error('Enter a valid statement date, source transaction ID, payer and source.');
  const amountPence=input.amountPence;
  if(!Number.isSafeInteger(amountPence) || amountPence<=0) throw new Error('Enter a positive GBP amount with up to two decimal places.');
  if(d.financeExceptions.some(c=>c.source.origin===origin && finKey(c.source.reference)===finKey(reference)))throw new Error('This source transaction ID is already in the queue.');
  const risk=finClean(input.risk);
  const c={id:d.id+'-finance-exception-'+(d.financeExceptions.length+1),
    source:{origin,reference,payer,date,amountPence,memo:finClean(input.memo),risk},status:risk?'Risk hold':'Needs match',history:[]};
  finStamp(c,role,risk?'Flagged for review':'Statement line recorded',risk || 'No accounting entry posted.');
  d.financeExceptions.unshift(c);return c;
}
function initializeFinanceExceptions(d) {

    amountPence:92500,memo:'Group transfer. No purchasing entity, order number or invoice supplied.'});
  addFinanceLine(d,'finance',{origin:'Processor settlement',reference:'PSP-7831',date:'2026-11-20',payer:'Meridian Purchasing',
    amountPence:241000,memo:'Card settlement batch 1120A.',risk:'The payer differs from the named customer. The request to return funds supplies new bank details.'});
  return d;
}
function financePriorReceipt(d,c) {
  return d.depth.receipts.find(r=>r.sourceLineId===c.id || (!r.sourceLineId && finKey(r.reference)===finKey(c.source.reference)));
}
function financeAvailableReceipts(d,c) {
  return d.depth.receipts.filter(r=>{
    const accountId=r.accountId || d.invoices.find(i=>i.id===r.invoiceId)?.accountId;
    return !r.sourceLineId && r.amountPence===c.source.amountPence && (!c.accountId || c.accountId===accountId);
  });
}
function financeMatchOptions(d,c) {
  const prior=financePriorReceipt(d,c),amount=c.source.amountPence;
  return d.invoices.filter(i=>(!c.accountId || i.accountId===c.accountId) && (prior?.invoiceId===i.id || i.totalPence-i.paidPence>=amount));
}
function confirmedAccount(d,id) {
  const a=d.accounts.find(a=>a.id===id);
  if(!a)throw new Error('Identify the paying customer using the remittance evidence.');
  return a;
}
function financeReleasedOrders(d,c) {
  return d.opportunities.filter(o=>{
    const account=d.accounts.find(a=>a.id===o.accountId);
    const signoff=d.approvalRequests.find(r=>r.type==='order' && r.targetId===o.id);
    return account && (!account.onboardingStatus || account.onboardingStatus==='Active customer') &&
      signoff?.status==='approved' && signoff.valuePence===o.valuePence && signoff.accountId===o.accountId &&
      o.orderStatus==='Released to fulfilment' && o.probability===1 && (!c.accountId || c.accountId===o.accountId) &&
      o.valuePence>=c.source.amountPence && !d.invoices.some(i=>i.orderId===o.id);

function financePost(d,c,invoice,account,evidence,values={}) {
  const amount=c.source.amountPence, exact=financePriorReceipt(d,c), prior=values.receipt || exact;
  if(exact && prior!==exact)throw new Error('The source reference already identifies a different receipt. Review the discrepancy.');
  const possible=financeAvailableReceipts(d,c).some(r=>r.accountId===account.id || d.invoices.find(i=>i.id===r.invoiceId)?.accountId===account.id);
  if(!prior && possible && !values.distinct) throw new Error('A posted receipt for this customer has the same amount. Link it, or confirm a separate statement payment.');
  if(prior && (prior.amountPence!==amount || (prior.invoiceId && prior.invoiceId!==invoice?.id) || (prior.accountId && prior.accountId!==account.id)))
    throw new Error('An existing receipt uses this reference with different details. Escalate the discrepancy.');
  if(invoice && (invoice.accountId!==account.id || (prior?.invoiceId!==invoice.id && invoice.totalPence-invoice.paidPence<amount)))
    throw new Error('The invoice must belong to this customer and cover the unallocated amount.');
  if(!invoice && prior?.invoiceId)throw new Error('This payment is already allocated. Match the existing receipt.');
  if(prior && prior.sourceLineId && prior.sourceLineId!==c.id)throw new Error('This receipt is linked to another statement line.');
  const receipt=prior || {id:c.id+'-receipt',reference:c.source.reference,amountPence:amount};
  if(!prior){d.openingCashPence+=amount;d.depth.receipts.push(receipt);}
  if(invoice && !receipt.invoiceId){
    invoice.paidPence+=amount;
    if(invoice.totalPence===invoice.paidPence){invoice.status='Paid';invoice.overdueDays=0;}
    receipt.invoiceId=invoice.id;
  }
  Object.assign(receipt,{accountId:account.id,sourceLineId:c.id,status:invoice?(prior?.status==='Reconciled'?'Reconciled':'Allocated'):'Unapplied'});
  Object.assign(c,{accountId:account.id,invoiceId:invoice?.id,receiptId:receipt.id,status:invoice?'Reconciled':'Unapplied'});
  if(invoice)delete c.followUp;
  finStamp(c,'finance',invoice?'Matched to '+invoice.number:'Recorded unapplied customer credit',evidence);
  d.activity.unshift({recordId:invoice?.id || account.id,accountId:account.id,action:invoice?'Receipt reconciled':'Unapplied receipt recorded',detail:c.source.reference+' · '+evidence,at:c.history.at(-1).at});
}
function financeExceptionAction(d,role,id,revision,action,values={}) {
  const c=d.financeExceptions.find(x=>x.id===id);
  if(!c || String(revision)!==String(c.history.length))throw new Error('This exception has changed. Review the latest history.');
  if(finFinal.has(c.status))throw new Error('This exception is already closed.');
  const evidence=finClean(values.evidence);
  if(!evidence)throw new Error('Record the supporting evidence or reason for this action.');
  if(c.status==='Risk hold'){
    if(role!=='leadership' || !['clear-risk','retain-hold','close-risk'].includes(action))throw new Error('A finance director must decide the risk hold before Finance can allocate this receipt.');
    if(action==='clear-risk')c.status=c.heldFrom || 'Needs match';
    if(action==='close-risk'){
      if(c.receiptId)throw new Error('An accounting receipt already exists. Keep the hold open for Finance to review the entry.');
      if(!finClean(values.externalRef))throw new Error('Record the bank or processor case reference for disposition.');
      c.dispositionRef=finClean(values.externalRef);c.status='Closed after review';
    }
    finStamp(c,role,{'clear-risk':'Risk cleared for Finance','retain-hold':'Hold retained','close-risk':'Closed with bank or processor disposition'}[action],evidence);
    return c.status;
  }
  if(role!=='finance')throw new Error('Finance owns matching and allocation.');
  if(action==='escalate'){
    c.heldFrom=c.status;c.status='Risk hold';finStamp(c,role,'Escalated to finance director',evidence);return c.status;
  }
  if(action==='chase'){
    if(c.status==='Unapplied')throw new Error('This receipt is already recorded as customer credit.');
    if(!finDate(values.followUp) || values.followUp<c.source.date)throw new Error('Set a follow-up date on or after the transaction date.');
    c.followUp=values.followUp;c.status='Awaiting evidence';finStamp(c,role,'Requested remittance or order evidence',evidence);return c.status;
  }
  if(!['match','link-receipt','unapplied','order-invoice'].includes(action))throw new Error('Choose a valid resolution.');
  const account=confirmedAccount(d,values.accountId);
  if(c.accountId && c.accountId!==account.id)throw new Error('Use the customer already identified for this receipt.');
  if(action==='link-receipt'){
    const prior=financeAvailableReceipts(d,c).find(r=>r.id===values.receiptId);
    if(!prior)throw new Error('Choose an unlinked receipt of the same amount.');
    const invoice=d.invoices.find(i=>i.id===prior.invoiceId);
    if((prior.invoiceId && !invoice) || (prior.accountId || invoice?.accountId)!==account.id)throw new Error('The posted receipt must belong to the verified customer.');
    if(!invoice && (!finDate(values.followUp) || values.followUp<c.source.date))throw new Error('Set the next allocation review date for the unallocated credit.');
    financePost(d,c,invoice,account,evidence,{receipt:prior});
    if(!invoice)c.followUp=values.followUp;
  } else if(action==='unapplied'){
    if(c.receiptId)throw new Error('This receipt is already recorded.');
    if(!finDate(values.followUp) || values.followUp<c.source.date)throw new Error('Set the next allocation review date.');
    financePost(d,c,null,account,evidence,values);
    c.followUp=values.followUp;
  } else if(action==='match'){
    const invoice=d.invoices.find(i=>i.id===values.invoiceId);
    if(!invoice)throw new Error('Choose an existing invoice to match.');
    financePost(d,c,invoice,account,evidence,values);
  } else {
    const order=financeReleasedOrders(d,c).find(o=>o.id===values.orderId && o.accountId===account.id);
    if(!order || !values.checked)throw new Error('Choose a released customer order and confirm that you checked for an existing invoice.');
    const dueDate=finClean(values.dueDate);
    if(!finDate(dueDate) || dueDate<'2026-12-01' || dueDate>'2027-05-31')throw new Error('Choose the agreed due date inside the December to May forecast.');
    const dueMonth=(Number(dueDate.slice(5,7))%12)+1;
    const financeOwner=d.team[6].name;
    const eventId=d.id==='events'?d.domain.find(x=>x.accountId===account.id)?.id:undefined;
    const invoice={id:c.id+'-invoice',orderId:order.id,accountId:account.id,number:'INV-ORD-'+c.id.split('-').at(-1),totalPence:order.valuePence,paidPence:0,dueMonth,dueDate,financeOwner,...(eventId?{eventId}:{}),overdueDays:0,status:'Open'};
    financePost(d,c,invoice,account,evidence,values);
    d.invoices.push(invoice);c.orderId=order.id;
  }
  return c.status;
}

const PIPELINE_DAY='2026-11-20';
const INVITE_RESPONSES=['Not recorded','Awaiting reply','Accepted','Declined','Chasing'];
const PIPELINE_EVIDENCE={
  agency:['','Proposal feedback or negotiation note','Signed engagement reference'],
  events:['','','Signed sponsorship or event contract reference'],
  saas:['','Procurement contact or review reference','Signed subscription reference'],
  field:['Site survey appointment or report','Issued quote reference','Signed service agreement reference'],
  property:['Appraisal appointment or report','Management proposal reference','Appointment or mandate reference'],
  recruitment:['Terms sent reference','Shortlist sent reference','Placement acceptance reference'],
  membership:['Membership application reference','Reviewer or review note','Membership confirmation reference'],
  wholesale:['Sample shipment or collection reference','Issued quote reference','Confirmed purchase order reference']
};

function usesPipelineMeetings(d){return ['agency','events','saas'].includes(d.id);}
function pipelineInviteStage(d){return d.id==='events'?2:3;}
function pipelineEvidenceLabel(d,index){return PIPELINE_EVIDENCE[d.id]?.[index-1]||'';}
function validMeetingLink(value){
  try{
    const link=new URL(value);
    return link.protocol==='https:' && !link.username && !link.password && link.hostname.includes('.') && (link.pathname.length>1 || !!link.search);
  }catch{return false;}
}
function pipelineDayValid(value){
  const date=new Date(value+'T00:00:00Z');
  return /^\d{4}-\d{2}-\d{2}$/.test(value) && Number.isFinite(date.getTime()) && date.toISOString().slice(0,10)===value;
}
function pipelineAudit(d,o,action,detail,actor){
  d.activity.unshift({action,detail,actor:actor||'Workspace user',recordId:o.id,opportunityId:o.id,accountId:o.accountId,stage:o.stage,at:new Date().toISOString()});
}
function pipelineGateReason(d,o,index,today=PIPELINE_DAY){
  const f=o.pipelineEvidence||{},final=index===d.config.stages.length-1;
  if(final){
    const signoff=saleSignoff(d,o.id);
    if(!signoff)return 'Request deal-terms sign-off from Sales leadership in Approvals.';
    if(signoff==='changed')return 'Deal terms changed. Submit the revised terms for sign-off in Approvals.';
    if(signoff!=='approved')return 'Deal terms '+(signoff==='pending'?'await approval.':'were denied.')+' Review the linked request in Approvals.';
  }
  if(usesPipelineMeetings(d)){
    if(!validMeetingLink(f.meetingLink))return 'Add a complete HTTPS Zoom or video meeting link.';
    if(index>=pipelineInviteStage(d)){
      if(!f.inviteRef)return 'Record the calendar invitation reference.';
      if(final && f.response!=='Accepted')return 'Record an accepted invitation before confirming the sale.';
      if(f.response!=='Accepted'){
        if(f.response!=='Chasing')return 'Record acceptance or assign a chase with an owner and follow-up date.';
        if(!d.team.some(t=>t.name===f.chaseOwner)||!f.chaseDue)return 'Assign a chase owner and follow-up date.';
        if(f.chaseDue<today)return 'The invitation follow-up is overdue. Record a new chase date or the latest response.';
      }
    }
  }
  const label=pipelineEvidenceLabel(d,index);
  return label && !f['evidence'+index]?'Add the '+label.toLowerCase()+'.':'';
}

function saveInvitationDetails(d,id,values,revision,actor){
  const o=d.opportunities.find(o=>o.id===id);
  if(!o)throw new Error('Opportunity not found.');
  const original=o.pipelineEvidence||{}, next={...original};
  const allowed=['evidence1','evidence2','evidence3'];
  if(usesPipelineMeetings(d))allowed.push('meetingLink','inviteRef','response','chaseOwner','chaseDue');
  for(const key of allowed){
    if(Object.hasOwn(values,key))next[key]=String(values[key]||'').trim();
  }
  if(next.response==='Not recorded')next.response='';
  const invitationReplaced=!!original.inviteRef && (original.inviteRef!==next.inviteRef || original.meetingLink!==next.meetingLink);
  if(invitationReplaced && original.response){
    if(!next.inviteRef || !next.meetingLink)throw new Error('Keep a meeting link and calendar reference on this tracked invitation.');
    next.response='Awaiting reply';next.chaseOwner='';next.chaseDue='';
  }
  if(next.response==='Accepted'){next.chaseOwner='';next.chaseDue='';}
  if(next.meetingLink && !validMeetingLink(next.meetingLink))throw new Error('Use the full HTTPS meeting link, including the meeting path.');
  if(next.response && !INVITE_RESPONSES.includes(next.response))throw new Error('Choose a calendar response.');
  if(original.response && !next.response)throw new Error('Record the latest response to this tracked invitation.');
  if(next.response && !next.inviteRef)throw new Error('Add the calendar invitation reference for this response.');
  if(next.chaseOwner && !d.team.some(t=>t.name===next.chaseOwner))throw new Error('Choose a chase owner from the team.');
  if(next.chaseDue && !pipelineDayValid(next.chaseDue))throw new Error('Enter a valid follow-up date.');
  if(next.response==='Chasing' && !(next.chaseOwner && next.chaseDue))throw new Error('Choose a named chase owner and follow-up date.');
  const changed=allowed.filter(key=>(next[key]||'')!==(original[key]||''));
  if(!changed.length)return o;
  if(revision!=null && Number(revision)!==(original.revision||0))throw new Error('This record has changed. Reopen it before saving.');
  const labels={meetingLink:'Meeting link',inviteRef:'Calendar reference',response:'Invitation response',chaseOwner:'Chase owner',chaseDue:'Follow-up date'};
  const detail=changed.map(k=>(labels[k]||pipelineEvidenceLabel(d,Number(k.slice(-1))))+' · '+(next[k]||'Cleared')).join(' / ');
  o.pipelineEvidence={...next,revision:(original.revision||0)+1};
  pipelineAudit(d,o,'Stage evidence updated',detail,actor);
  return o;
}

function invitationAlerts(d,today=PIPELINE_DAY){
  return d.opportunities.flatMap(o=>{
    const f=o.pipelineEvidence||{}, due=f.chaseDue||'';
    let title='',detail='',severity='warning';
    const held=o.heldStage && d.config.stages.indexOf(o.heldStage.to);
    const reason=held?pipelineGateReason(d,o,held,today):'';
    if(f.response==='Declined'){
      title='Invitation declined';detail='Record a replacement invitation or assign a follow-up.';severity='urgent';
    }else if(['Chasing','Awaiting reply'].includes(f.response)){
      const overdue=due && due<today;
      title=overdue?'Invitation follow-up overdue':f.response==='Chasing'?'Chase invitation response':'Invitation awaiting reply';
      detail=overdue?'Update the response or set a new chase date.':f.response==='Chasing'?'Follow up and record the customer’s response.':'Record the response or assign someone to follow up.';
      if(overdue)severity='urgent';
    }else if(reason && !reason.includes('Approvals')){
      title='Evidence needed for '+o.heldStage.to;detail=reason;
    }
    if(!title)return [];
    return [{id:'pipeline-'+o.id,opportunityId:o.id,title,detail:o.name+' · '+detail,owner:f.chaseOwner||o.owner,due,severity}];
  });
}

  const select=(key,label,list,empty)=>`<label>${esc(label)}<select name="${key}">${empty?`<option value="">${esc(empty)}</option>`:''}${list.map(value=>`<option value="${esc(value)}" ${f[key]===value?'selected':''}>${esc(value)}</option>`).join('')}</select></label>`;
  let main='';
  if(meeting)main+=input('meetingLink','Video meeting link','url','https://…');

  }
  const held=o.heldStage && !final ? pipelineGateReason(d,o,next,PIPELINE_DAY):'';
  return `<form class="pipeline-record" data-pipeline-form="${esc(o.id)}" data-stage="${esc(o.stage)}" data-revision="${f.revision||0}">

function moveStage(data,id,expectedStage,actor,today=PIPELINE_DAY){
  const record=data.opportunities.find(o=>o.id===id);

  if(expectedStage && record.stage!==expectedStage){
    if(record.lastTransition?.from===expectedStage && record.lastTransition.to===record.stage)return record;
    throw new Error('The stage has changed. Reopen the record before moving it.');
  }
  const stages=data.config.stages, index=stages.indexOf(record.stage), next=index+1;
  if(index<0 || !stages[next])throw new Error('No next stage is available.');

  if(reason){
    if(record.heldStage?.to!==stages[next] || record.heldStage.reason!==reason){
      record.heldStage={to:stages[next],reason};
      pipelineAudit(data,record,'Stage held',stages[next]+' · '+reason,actor);

  pipelineAudit(data,record,'Stage changed',record.lastTransition.from+' → '+record.stage,actor);
  return record;
}
const dealHandoffRoles={sales:'Sales',saleslead:'Sales leadership',leadership:'Company leadership'};

function handoffOpportunity(data,id,role,values,version,fromOwner) {
  if(!Object.hasOwn(dealHandoffRoles,role)) throw new Error('Only the sales team or company leadership can change the deal owner.');
  const deal=data.opportunities.find(o=>o.id===id);
  if(!deal) throw new Error('Opportunity not found.');
  const history=deal.ownerHistory || [];
  if(String(version)!==String(history.length) || deal.owner!==fromOwner) throw new Error('The deal owner changed. Reopen the record before handing it over.');
  const from=data.team.find(t=>t.name===deal.owner);
  const to=data.team.find(t=>t.id===values.ownerId && t.department.includes('sales'));
  if(!from || !to || from.id===to.id) throw new Error('Choose a different sales colleague.');
  const note=String(values.reason || '').trim();
  if(!note || note.length>1600) throw new Error('Enter a handoff note of up to 1,600 characters.');
  const at=new Date().toISOString();
  const change={revision:history.length+1,fromId:from.id,toId:to.id,from:from.name,to:to.name,role,note,at};
  deal.owner=to.name;
  deal.ownerHistory=[...history,change];
  data.activity.unshift({action:'Deal owner changed',accountId:deal.accountId,opportunityId:id,recordId:id,actor:dealHandoffRoles[role],
    detail:from.name+' → '+to.name+' · '+dealHandoffRoles[role]+' · '+note,at});
  return deal;
}

    if (!owner) throw new Error('Choose a delivery owner.');
    const due = values.due || '';
    const parsed = new Date(due + 'T12:00:00Z');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(due) || Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== due) throw new Error('Choose a valid delivery date.');
    const scope = values.scope?.trim(), criteria = values.criteria?.trim();
    if (!scope || !criteria) throw new Error('Enter the agreed scope and measurable acceptance criteria.');
    next = {ownerId: owner.id, due, scope, criteria};
    status = 'Awaiting operations';
    note = previous ? 'Revised handoff sent to operations.' : 'Handoff sent to operations.';
  } else {
    if (!['quote-handoff-accept','quote-handoff-return'].includes(action) || role !== 'operations' || previous?.status !== 'Awaiting operations') throw new Error('Choose a handoff awaiting operations review.');
    status = action === 'quote-handoff-accept' ? 'Accepted by operations' : 'Returned';
    note = values.note?.trim() || '';
    if (status === 'Returned' && !note) throw new Error('Explain what Sales needs to change.');
    next = previous;
  }
  const at = new Date().toISOString();
  const event = {at, role, status, note, ...(action === 'quote-handoff-send' ? next : {})};
  quote.handoff = {...next, status, history: [...(previous?.history || []), event]};
  d.activity.unshift({at, recordId: quote.id, action: 'Delivery handoff: '+status, actor: role, detail: note});
  return action === 'quote-handoff-send' ? note : status === 'Returned' ? 'Returned to Sales with your reason.' : 'Operations accepted the handoff.';
}

  return `<details class="role-request" data-quote-packet="${handoffText(quote.id)}"><summary><strong>${handoffText(account?.name)} · ${gbp(quote.amountPence)}</strong> · ${handoffText(h?.status || 'Ready to hand off')}</summary>

}

function depthFields(d,c,input={}){const step=depthSpec(c).steps[c.stage];if(!step)return;for(const f of step.fields)if(Object.hasOwn(input,f.key))c.values[f.key]=f.type==='checkbox'?input[f.key]===true:String(input[f.key]).slice(0,2000);}

function callHistory(d, contact) {
  const events = d.calls.filter(c => c.contactId === contact.id).sort((a,b)=>
    (b.endedAt||b.startedAt||'').localeCompare(a.endedAt||a.startedAt||''));
  if (!events.length) return '<p>No calls logged for this contact yet.</p>';
  return events.map(call => {
    const owner = d.team.find(t=>t.id===call.ownerId);
    const deal = d.opportunities.find(o=>o.id===call.opportunityId);
    const when = call.startedAt ? new Date(call.startedAt).toLocaleString('en-GB') : 'Earlier session';
    const elapsed = call.durationSeconds || 0;
    const additions = call.addenda || [];
    const noteForm = call.status === 'Logged' ? `<div class="crm-call-notes"><h3>Call notes</h3>
      ${call.notes ? `<p><strong>Original note</strong><br>${cx(call.notes)}</p>` : ''}
      ${additions.map(note => `<article><strong>${cx(note.kind)}</strong> · ${cx(note.author)} · <time datetime="${cx(note.at)}">${cx(new Date(note.at).toLocaleString('en-GB'))}</time><p>${cx(note.body)}</p></article>`).join('')}
      <details><summary>Add a call note</summary>
        <form data-call-note="${cx(call.id)}" data-contact="${cx(call.contactId)}" data-revision="${additions.length}"><div class="crm-fields">

          <label class="crm-wide">Internal note<textarea name="body" rows="3" required></textarea></label>
        </div><div class="crm-actions"><button type="submit" class="primary">Save call note</button></div></form>
      </details></div>` : '';
    return `<details class="email-preview" data-call-history="${cx(call.id)}"><summary><strong>${cx(call.outcome || call.status)}</strong> · ${cx(when)}</summary>
      <p>${cx(call.source)}${call.entryMethod==='Manual'?' · Manually logged':''} · ${cx(owner?.name)} · ${call.connected?'Connected':'Not connected'} · Talk time ${Math.floor(elapsed/60)}m ${elapsed%60}s</p>
      ${deal ? `<p>Opportunity: ${cx(deal.name)}</p>` : ''}
      ${call.nextStep ? `<p>Next step: ${cx(call.nextStep)}</p>` : ''}

      <p class="tiny muted">Call reference ${cx(call.id)}</p></details>`;
  }).join('');
}

function functionBlueprint(d,s){const x=escapeHTML,b=studioButton,items=(FUNCTION_JOURNEYS[s.role]||[]).map((row,i)=>DEPTH_JOURNEY_LINKS[s.role]?.[i]?[...row.slice(0,5),'workbench','Interactive demo slice']:row);return `<div class="role-callout"><strong>Design the whole working day</strong><span>These journeys map the decisions, exceptions and evidence this function needs. “Working demo”, “Demo slice” and “Interactive demo slice” link to implemented examples. The role workbench states exactly which actions are simulated. “Customer build scope” is specified work, not a claim that it already runs.</span></div><div class="role-links">${b('view','Open interactive role workbench','primary','data-view="workbench"')}</div><div class="blueprint-grid">${items.map(([name,start,steps,exceptions,evidence,view,status],i)=>`<article class="panel blueprint-card"><div class="row between"><span class="eyebrow">Journey ${i+1}</span><span class="pill ${status==='Working demo'?'good':''}">${x(status)}</span></div><h2>${x(name)}</h2><dl><dt>Starts when</dt><dd>${x(start)}</dd><dt>What happens next</dt><dd>${x(steps)}</dd><dt>Exceptions to handle</dt><dd>${x(exceptions)}</dd><dt>Evidence to keep</dt><dd>${x(evidence)}</dd></dl>${status==='Customer build scope'?'<p class="tiny muted">Mapped for discovery and a customer-specific build.</p>':b('view','Open demo journey','primary small',`data-view="${view}" data-workflow="${DEPTH_JOURNEY_LINKS[s.role]?.[i]||''}"`)}</article>`).join('')}</div>`;}


const approvalLabel={pending:'Awaiting sign-off',approved:'Approved',changed:'Terms changed',denied:'Changes requested'};
const apEsc=escapeHTML;

function approvalButton(label,{type='',targetId='',requestId=''}={},primary=false) {
  return studioButton('approval-open',apEsc(label),primary?'primary small':'small',
    'data-kind="'+apEsc(type)+'" data-target="'+apEsc(targetId)+'" data-id="'+apEsc(requestId)+'"');
}

function approvalQuoteControl(d,role,q) {
  if(q.status==='Accepted (demo)') return studioButton('quote-handoff-open',apEsc(q.handoff?.status || 'Prepare handoff'),'small','data-id="'+apEsc(q.id)+'"');
  if(q.status==='Approved (demo)' && role==='sales') return studioButton('sales-quote-review','Record customer acceptance','small','data-id="'+apEsc(q.id)+'"');
  const r=approvalsFor(d,role).find(x=>x.type==='quote' && x.targetId===q.id);
  if(r) return approvalButton(r.status==='denied' && r.requester===role?'Revise quote':'Open sign-off',{requestId:r.id});
  return role==='sales' && q.status==='Draft' ? approvalButton('Request sign-off',{type:'quote',targetId:q.id}) : '—';
}

function approvalFitsRecord(r,type,id) {
  if(type==='accounts') return r.accountId===id;
  if(type==='opportunities') return ['sale','order','discount'].includes(r.type) && r.targetId===id;
  return type==='domain' && r.type==='delegate' && r.targetId===id;
}

function approvalRecordPanel(d,role,type,id) {
  if(!APPROVAL_ROLES[role] || !['accounts','opportunities','domain'].includes(type)) return '';
  const records=approvalsFor(d,role).filter(r=>approvalFitsRecord(r,type,id));
  const opp=type==='opportunities' && d.opportunities.find(o=>o.id===id);
  const account=type==='accounts' && d.accounts.find(a=>a.id===id);
  const event=type==='domain' && d.id==='events' && d.domain.find(x=>x.id===id);
  let action='',sourceStatus='';
  if(opp){
    const kind=opp.probability===1?'order':'sale';
    const terms=records.find(r=>r.type===kind);
    sourceStatus=terms && approvalStatus(d,terms)==='changed'?'New terms need sign-off':opp.orderStatus || opp.termsStatus || '';
    if(kind==='sale' && role!=='sales' && !sourceStatus) sourceStatus='Sales must submit deal terms for the commercial director before confirming this deal.';
    if(APPROVAL_TYPES[kind].submitters.includes(role) && !d.approvalRequests.some(r=>r.type===kind && r.targetId===id)) action=approvalButton(kind==='order'?'Request order release':'Request terms sign-off',{type:kind,targetId:id});
    if(kind==='sale' && role==='sales' && !records.some(r=>r.type==='discount')) action+=approvalButton('Request discount',{type:'discount',targetId:id});
  }
  if(account) {
    sourceStatus=account.onboardingStatus || '';
    if(sourceStatus==='Prospect' && APPROVAL_TYPES.customer.submitters.includes(role)) action=approvalButton('Request customer onboarding',{type:'customer',targetId:id});
  }
  if(event && event.status!=='Delivered' && event.fields.Registered<event.fields.Capacity && APPROVAL_TYPES.delegate.submitters.includes(role)) action=approvalButton('Request delegate place',{type:'delegate',targetId:id});
  if(!records.length && !action && !sourceStatus) return '';
  return '<section class="record-signoffs"><h3>Sign-off</h3>'+(sourceStatus?'<p>'+apEsc(sourceStatus)+'</p>':'')+records.map(r=>'<div class="modal-list"><span>'+apEsc(APPROVAL_TYPES[r.type].label)+' · '+apEsc(approvalLabel[approvalStatus(d,r)])+'</span>'+approvalButton('View request',{requestId:r.id})+'</div>').join('')+action+'</section>';
}

function approvalOptions(items,value,placeholder) {
  return '<option value="">'+apEsc(placeholder)+'</option>'+items.map(([id,label])=>'<option value="'+apEsc(id)+'"'+(id===value?' selected':'')+'>'+apEsc(label)+'</option>').join('');
}

function approvalTargetList(d,type) {
  if(type==='customer') return [];
  if(type==='delegate') return d.domain.filter(o=>o.status!=='Delivered' && o.fields.Registered<o.fields.Capacity).map(o=>[o.id,o.name+' · '+(o.fields.Capacity-o.fields.Registered)+' places left']);
  if(type==='quote') return d.quotes.filter(q=>q.status==='Draft').map(q=>[q.id,(d.contacts.find(c=>c.id===q.contactId)?.name || 'Contact')+' · '+gbp(q.amountPence)]);
  return d.opportunities.filter(o=>(type==='order'?o.probability===1:o.probability<1) && !d.approvalRequests.some(r=>r.type===type && r.targetId===o.id)).map(o=>[o.id,o.name+' · '+gbp(o.valuePence)]);
}

function updateDiscountPreview(d,form) {
  const output=form.querySelector('[data-discount-preview]');
  if(!output) return;
  const deal=d.opportunities.find(o=>o.id===form.elements.targetId?.value);
  const rate=form.elements.discountPercent?.value;
  if(!deal || !rate){output.textContent='Select a deal and enter a percentage to preview its price.';return;}
  try{output.textContent=discountDescription(discountProposal(deal,rate));}
  catch(error){output.textContent=error.message;}
}

function approvalFields(d,type,targetId,r) {
  const field=(label,input)=>'<label class="workbench-field">'+apEsc(label)+input+'</label>';
  const customer=type==='customer' && d.accounts.find(a=>a.id===(r?.accountId || targetId));
  let body='';
  if(type==='customer') {
    const prospects=d.accounts.filter(a=>a.onboardingStatus==='Prospect');
    if(!customer && prospects.length) body='<details><summary>Use an existing prospect</summary><div class="row-actions">'+prospects.map(a=>approvalButton(a.name,{type:'customer',targetId:a.id})).join('')+'</div></details>';
    if(customer) body+='<input type="hidden" name="targetId" value="'+apEsc(customer.id)+'">';
    body+=field('Company name','<input name="name" required maxlength="150" value="'+apEsc(customer?.name)+'">')+
      field('Region','<input name="region" required maxlength="80" value="'+apEsc(customer?.region)+'">')+
      field('Segment','<select required name="segment">'+approvalOptions(['Enterprise','Growth','Independent'].map(x=>[x,x]),customer?.segment,'Choose segment')+'</select>');
  } else if(r) {
    body='<input type="hidden" name="targetId" value="'+apEsc(r.targetId)+'"><input type="hidden" name="subjectId" value="'+apEsc(r.subjectId)+'">';
    if(type==='quote') body+=field('Revised quote amount (£)','<input type="number" name="amount" min="0.01" max="10000000" step=".01" required value="'+(r.valuePence/100).toFixed(2)+'">');
  } else {
    const name={delegate:'Event',sale:'Open deal',discount:'Open deal',order:'Confirmed deal',quote:'Draft quote'}[type];
    const items=approvalTargetList(d,type);
    if(!items.length) return '<p class="muted">'+(type==='quote'?'Create a draft quote in the Sales desk first.':'There are no eligible records for this request.')+'</p>';
    body=field(name,'<select name="targetId" required>'+approvalOptions(items,targetId,'Choose '+name.toLowerCase())+'</select>');
    if(type==='delegate') body+=field('Delegate','<select name="subjectId" required>'+approvalOptions(approvalContacts(d).map(c=>[c.id,c.name+' · '+(d.accounts.find(a=>a.id===c.accountId)?.name || '')]),'','Choose contact')+'</select>');
  }
  if(type==='discount') {
    const proposal=r?.discount;
    body+=field('Discount off list price (%)','<input type="number" name="discountPercent" min="0.01" max="100" step="0.01" required value="'+(proposal?proposal.rateBps/100:'')+'">')+
      '<output class="tiny" aria-live="polite" data-discount-preview>Enter a percentage to preview the deal price.</output>';
  }
  return body+field(r?'What changed?':'Reason for sign-off','<textarea required rows="2" name="reason" maxlength="1600"></textarea>')+
    '<p class="tiny muted">Assigned to '+apEsc(approvalLeader(d,type))+' · '+apEsc(APPROVAL_ROLES[APPROVAL_TYPES[type].reviewer])+'.</p><button type="submit" class="primary">'+(r?'Resubmit for sign-off':'Submit request')+'</button>';
}

function approvalForm(d,type,targetId,r) {
  return '<form class="workbench-form approval-form" data-approval-form="request" data-kind="'+apEsc(type)+'" data-id="'+apEsc(r?.id)+'" data-version="'+(r?.history.length || 0)+'">'+approvalFields(d,type,targetId,r)+'</form>';
}

function approvalRequestCard(d,role,r,focused) {
  const status=approvalStatus(d,r), previous=r.history.at(-1), account=d.accounts.find(a=>a.id===r.accountId);
  const reviewer=r.reviewer===role && status==='pending', revise=r.requester===role && (['denied','changed'].includes(status) || (r.type==='discount' && status==='approved' && d.opportunities.some(o=>o.id===r.targetId && o.probability<1)));
  const effect=({discount:'Discount applied to the deal and its weighted pipeline value',quote:'Quote approved for customer acceptance',sale:'Terms cleared for deal progression',customer:'Customer account activated',order:'Order released to fulfilment',delegate:'Delegate registered and one place allocated'})[r.type];
  const sourceId=r.type==='quote'?r.accountId:r.targetId;
  const controls=reviewer?'<form class="workbench-form approval-form" data-approval-form="decide" data-id="'+apEsc(r.id)+'" data-version="'+r.history.length+'"><label class="workbench-field">Decision note <small>Required when denying a request</small><textarea rows="2" name="note" maxlength="1600"></textarea></label><div class="row-actions"><button type="submit" class="primary" name="decision" value="approved">Approve</button><button type="submit" name="decision" value="denied">Deny and return</button></div></form>':revise?(status==='approved'?'<details><summary>Request a different discount</summary>'+approvalForm(d,r.type,r.targetId,r)+'</details>':approvalForm(d,r.type,r.targetId,r)):'';
  const history=r.history.map(entry=>'<li><strong>'+apEsc(entry.status==='pending'?'Submitted':approvalLabel[entry.status])+'</strong> · '+apEsc(APPROVAL_ROLES[entry.role])+' · <time datetime="'+apEsc(entry.at)+'">'+apEsc(new Date(entry.at).toLocaleString('en-GB',{timeZone:'UTC'}))+' UTC</time>'+(entry.discount?'<p>'+apEsc(discountDescription(entry.discount))+'</p>':'')+(entry.note?'<p>'+apEsc(entry.note)+'</p>':'')+'</li>').join('');
  return '<details class="approval-card" data-approval-id="'+apEsc(r.id)+'"'+(focused?' open':'')+'><summary'+(focused?' data-approval-focus':'')+'><span><small>'+apEsc(APPROVAL_TYPES[r.type].label)+'</small><strong>'+apEsc(r.title)+'</strong></span><span class="pill '+({pending:'warn',approved:'good',denied:'bad',changed:'warn'}[status])+'">'+apEsc(approvalLabel[status])+'</span></summary>'+
    '<div class="approval-detail"><p>'+apEsc(r.reason)+'</p>'+(r.discount?'<p><strong>Discount terms</strong><br>'+apEsc(discountDescription(r.discount))+'</p>':'')+'<p class="tiny muted">'+apEsc(APPROVAL_ROLES[r.requester])+' → '+apEsc(r.reviewerTitle)+' · '+apEsc(APPROVAL_ROLES[r.reviewer])+(r.valuePence?' · '+gbp(r.valuePence):'')+'</p>'+
    (status==='changed'?'<p>The commercial terms have changed since the last decision. Submit the revised terms for approval.</p>':status==='denied'?'<p><strong>Reason for return</strong><br>'+apEsc(previous.note)+'</p>':r.status==='approved'?'<p>'+apEsc(effect)+'.</p>':'')+
    studioButton('record',apEsc(r.type==='quote'?(account?.name || 'Open account'):'Open linked record'),'small','data-id="'+apEsc(sourceId)+'"')+
    controls+'<details class="approval-history"><summary>Request history ('+r.history.length+')</summary><ol>'+history+'</ol></details></div></details>';
}

function approvalView(d,s) {
  const allowed=Object.keys(APPROVAL_TYPES).filter(type=>APPROVAL_TYPES[type].submitters.includes(s.role) && (type!=='delegate' || d.id==='events'));
  const type=allowed.includes(s.approvalType)?s.approvalType:'';
  const queue=approvalsFor(d,s.role);
  const focus=queue.find(r=>r.id===s.approvalFocus);
  const actionable=r=>(r.status==='pending' && r.reviewer===s.role) || (['denied','changed'].includes(approvalStatus(d,r)) && r.requester===s.role);
  const open=queue.filter(actionable), other=queue.filter(r=>!actionable(r));
  const panel=(title,items,empty)=>'<section class="panel approval-panel"><h2>'+title+' <span class="tiny muted">'+items.length+'</span></h2>'+(items.length?items.map(r=>approvalRequestCard(d,s.role,r,r===focus)).join(''):'<p class="muted">'+empty+'</p>')+'</section>';
  const form=allowed.length?'<section class="panel approval-panel"><h2>Request sign-off</h2><div class="row-actions approval-types">'+allowed.map(k=>studioButton('approval-kind',apEsc(APPROVAL_TYPES[k].label),k===type?'small active':'small','data-kind="'+k+'" aria-pressed="'+(k===type)+'"')).join('')+'</div>'+
    (type?'<h3 tabindex="-1" data-approval-focus>'+apEsc(APPROVAL_TYPES[type].label)+'</h3>'+approvalForm(d,type,s.approvalTarget):'')+'</section>':'';
  return '<div class="page-heading"><div><p class="eyebrow">'+apEsc(APPROVAL_ROLES[s.role] || 'Workspace')+'</p><h1>Approvals</h1><p>Review sign-offs and track the decision on each record.</p></div></div><div class="approval-workspace">'+
    (s.approvalType?form:'')+panel('Needs action',open,'Your team has no requests awaiting action.')+(!s.approvalType?form:'')+panel('Request history',other,'No other requests for this team.')+'</div>';
}

function approvalAction(d,s,action,el) {
  if (!['approval-open','approval-kind'].includes(action) || !APPROVAL_ROLES[s.role]) throw new Error('This workspace cannot open that request.');
  const {id,kind,target}=el.dataset;
  if(id && !approvalsFor(d,s.role).some(r=>r.id===id)) throw new Error('This request belongs to another team.');
  if(kind && !APPROVAL_TYPES[kind]?.submitters.includes(s.role)) throw new Error('This workspace cannot submit that request.');
  s.view='approvals';s.approvalFocus=id || null;s.approvalType=kind || null;s.approvalTarget=target || null;s.graphSelected=null;
}

function approvalSubmit(d,s,form,submitter) {
  const values=Object.fromEntries(new FormData(form));
  const {id,version,kind}=form.dataset;
  let r;
  if(form.dataset.approvalForm==='decide') r=decideApproval(d,s.role,id,version,submitter?.value,values.note);
  else {
    if(values.amount!==undefined) values.amountPence=Math.round(Number(values.amount)*100);
    r=requestApproval(d,s.role,kind,{...values,requestId:id,version});
  }
  s.approvalFocus=r.id;s.approvalType=null;s.approvalTarget=null;
  return r.status==='pending'?'Request sent to '+APPROVAL_ROLES[r.reviewer]+'.':r.status==='denied'?'Request returned to '+APPROVAL_ROLES[r.requester]+'.':'Approved. The linked record has been updated.';
}

const rx=escapeHTML,rb=studioButton;
const pct=n=>n===null?'—':(n*100).toFixed(1)+'%';
const rsum=(a,f)=>a.reduce((n,x)=>n+f(x),0);
const rtag=(s,c='')=>`<span class="pill ${c}">${rx(s)}</span>`;

const glassClarityKey = 'data-saver-glass-clarity';
const glassMaterialKey = 'data-saver-glass-material-v1';

function readGlassPreferences() {
  let shared, material;
  try { shared = localStorage.getItem(glassClarityKey); } catch {}
  try { material = JSON.parse(localStorage.getItem(glassMaterialKey)); } catch {}

  let clarity = true;
  if (shared === 'true' || shared === 'false') clarity = shared === 'true';
  else if (typeof material?.clarity === 'boolean') clarity = material.clarity;
  return { mode: material?.mode === 'dark' ? 'dark' : 'light', clarity };
}

function observeGlassClarity(update) {
  window.addEventListener('storage', event => {
    if (event.key === glassClarityKey || event.key === glassMaterialKey || event.key === null)
      update(readGlassPreferences().clarity);
  });
}

const emailPatterns = {
  'first.last': (first, last) => first + '.' + last,
  'first initial + last': (first, last) => first[0] + last,
  'first + last': (first, last) => first + last,
  'first': first => first,
  'first_last': (first, last) => first + '_' + last,
  'first + last initial': (first, last) => first + last[0],
  'last.first': (first, last) => last + '.' + first,
  'last + first initial': (first, last) => last + first[0]
};

const emailCohorts = {leadership: 'VP & executive', junior: 'Junior staff'};
const emailMinimumPeers = 7;
const emailMinimumShare = 0.75;
const emailFold = value => String(value ?? '').trim().toLowerCase();

function emailNameParts(contact) {
  const words = (contact.name || '').trim().split(/\s+/);
  const parts = contact.firstName && contact.lastName ? [contact.firstName, contact.lastName] : words;
  if (parts.length !== 2) return null;
  const pair = parts.map(emailFold);
  // An organisation may preserve, transliterate or drop punctuation and accents differently.
  return pair.every(part => /^[a-z]+$/.test(part)) ? pair : null;
}

function emailCohort(title) {
  const role = emailFold(title);
  if (/\b(assistant to|assistant vice president|associate (director|vice president))\b/.test(role)) return null;
  if (/\b(junior|jr\.?|graduate|trainee|apprentice|intern)\b/.test(role)) return 'junior';
  if (/\b(ceo|cfo|coo|cto|cio|cmo|cro|cpo|chro|ciso|svp|evp|vp|vice[ -]president|managing director|executive director|president)\b|\bchief .+ officer\b/.test(role)) return 'leadership';
  return null;
}
