function emailEvidence(contacts, domain) {
  const rows = [];
  const namesByAddress = new Map();
  const addressesByName = new Map();
  const add = (groups, key, value) => {
    if (!groups.has(key)) groups.set(key, new Set());
    groups.get(key).add(value);
  };
  for (const person of contacts) {
    const address = emailFold(person.email);
    const [, local, host] = /^([^\s@]+)@([^\s@]+)$/.exec(address) || [];
    if (host !== domain || /[+]/.test(local)) continue;
    if (/^(info|support|sales|office|team|contact|hello|admin|billing|accounts|reception|press|careers|marketing|enquiries|noreply|no-reply)([._-].*)?$/.test(local)) continue;
    if (!emailCanBeUsed(person)) continue;
    const name = emailFold(person.name).replace(/\s+/g, ' ');
    if (!name) continue;
    add(namesByAddress, address, name);
    add(addressesByName, name, address);
    const parts = emailNameParts(person);
    const group = emailCohort(person.title);
    if (parts && group) rows.push({name, address, local, person, parts, group});
  }
  const groups = {leadership: [], junior: []};
  const seen = new Set();
  for (const row of rows) {
    if (seen.has(row.address) || namesByAddress.get(row.address).size > 1 || addressesByName.get(row.name).size > 1) continue;
    seen.add(row.address);
    groups[row.group].push(row);
  }
  return groups;
}

function evaluateEmailCohort(group, rows, contact, domain, allContacts) {
  const formats = Object.entries(emailPatterns).map(([label,format]) => ({
    label, format, count: rows.filter(row => format(...row.parts) === row.local).length
  })).sort((a,b) => b.count - a.count);
  const best = formats[0];
  const peers = rows.map(row => row.person);
  const base = {group, peers, count: rows.length, matched: best.count, format: best.count ? best.label : '', matches: []};
  if (best.count) base.matches = rows.filter(row => best.format(...row.parts) === row.local).map(row => row.person.id);
  if (rows.length < emailMinimumPeers) return {...base, message: 'At least seven distinct colleagues in this group are needed. Found ' + rows.length + '.'};
  if (best.count < rows.length * emailMinimumShare || best.count === formats[1].count) {
    return {...base, message: 'The examples do not establish one format used by at least three quarters of this group.'};
  }
  const parts = emailNameParts(contact);
  if (!parts) return {...base, message: 'Confirm how the company spells this person’s given name and surname in email addresses.'};
  const candidate = best.format(...parts) + '@' + domain;
  if (candidate === emailFold(contact.email) && /bounc|undeliverable|invalid|failed/i.test(contact.emailStatus || '')) {
    return {...base, message: 'This format reproduces the address recorded as failed. Obtain a corrected address.'};
  }
  const owner = allContacts.find(c => c.id !== contact.id && contactHasAddress(c, candidate));
  if (owner) return {...base, message: 'This candidate is already saved to ' + owner.name + '. Review their record before using it.'};
  return {...base, candidate, message: best.count + ' of ' + rows.length + ' addresses use ' + best.label + '.'};
}

function researchContactEmail(d, contact, requestedGroup = 'auto') {
  if (emailCanBeUsed(contact)) return {address: contact.email, message: 'Saved on this contact'};
  const company = d.accounts.find(a => a.id === contact.accountId);
  const domain = emailFold(company?.domain);
  const colleagues = d.contacts.filter(c => c.id !== contact.id && c.accountId === contact.accountId);
  const sameName = colleagues.filter(c => emailFold(c.name) === emailFold(contact.name) && emailFold(c.email));
  if (sameName.length) return {message: 'A same-name record at this company already has an address. Review the possible duplicate first.', peers: sameName};
  if (!domain) return {message: 'Add a company domain before comparing address patterns.'};
  const evidence = emailEvidence(colleagues, domain);
  const groups = Object.fromEntries(Object.keys(emailCohorts).map(key => [key, evaluateEmailCohort(key, evidence[key], contact, domain, d.contacts)]));
  const roleGroup = emailCohort(contact.title);
  const selected = Object.hasOwn(emailCohorts, requestedGroup) ? requestedGroup : roleGroup;
  const common = {company: company.name, domain, groups, roleGroup};
  if (selected) return {...common, ...groups[selected]};
  const [leaders, juniors] = Object.values(groups);
  if (leaders.candidate && leaders.candidate === juniors.candidate) {
    return {...common, candidate: leaders.candidate, message: 'Both groups suggest the same address.'};
  }
  return {...common, message: 'This job title does not identify a group. Review the groups separately before choosing a possible address.'};
}

function emailGroupPanel(contact, result, group) {
  const e = escapeHTML;
  const cohort = result.groups[group];
  const preferred = result.roleGroup === group;
  const alternate = result.roleGroup && !preferred;
  const count = cohort.count;
  const coverage = cohort.format ? cohort.matched + ' of ' + count + ' use ' + cohort.format : count + ' usable addresses';
  const exceptions = count - cohort.matched;
  let leadershipEvidence = '';
  if (group === 'leadership' && count) {
    const rank = title => /\b(svp|evp|vp|vice[ -]president)\b/i.test(title) ? 'VP' : 'C-level or executive';
    const split = ['VP', 'C-level or executive'].map(label => {
      const peers = cohort.peers.filter(peer => rank(peer.title) === label);
      const matched = peers.filter(peer => cohort.matches.includes(peer.id)).length;
      return peers.length ? label + ' · ' + matched + ' of ' + peers.length : '';
    }).filter(Boolean);
    leadershipEvidence = cohort.format ? '<p class="tiny muted">Records using ' + e(cohort.format) + '<br>' + split.map(e).join('<br>') + '</p>' : '';
  }
  const orderedPeers = [...cohort.peers].sort((a,b) => Number(cohort.matches.includes(a.id)) - Number(cohort.matches.includes(b.id)));
  const examples = orderedPeers.map(peer => {
    const isMatch = cohort.matches.includes(peer.id);
    return '<li><div><strong>' + e(peer.name) + '</strong> · ' + e(peer.title) + '<br>' + e(peer.email) + (peer.source ? ' · ' + e(peer.source) : '') + '</div><span>' + (isMatch ? 'Matches' : 'Other format') + '</span></li>';
  }).join('');
  return '<details class="email-research-group" name="email-group-' + e(contact.id) + '"' + (preferred ? ' open' : '') + '>' +
    '<summary><strong>' + e(emailCohorts[group]) + '</strong> <span>' + e(coverage) + '</span></summary><div class="email-research-body">' +
    (cohort.candidate ? '<p>' + (alternate ? 'Unverified alternative for this contact' : 'Unverified suggestion') + '<br><strong>' + e(cohort.candidate) + '</strong></p><button type="button" class="small" data-use-suggestion="' + e(cohort.candidate) + '">Use suggestion</button>' : '<p>' + e(cohort.message) + '</p>') +
    leadershipEvidence + (count ? '<details class="email-research-examples"><summary>Inspect ' + count + ' source records' + (cohort.format && exceptions ? ' · ' + exceptions + (exceptions === 1 ? ' exception' : ' exceptions') : '') + '</summary><ul tabindex="0" aria-label="Source records">' + examples + '</ul></details>' : '') +
    '</div></details>';
}

function contactEmailResearch(d, contact, result = researchContactEmail(d, contact)) {
  const e = escapeHTML;
  const review = contact.email && !emailCanBeUsed(contact) ? '<p>Current entry requires review · ' + e(contact.email) + ' · ' + e(contact.emailStatus || 'Invalid format') + '</p>' : '';
  if (!result.groups) {
    const duplicateList = result.peers?.length ? '<ul>' + result.peers.map(c => '<li>' + e(c.name + ' · ' + c.email) + '</li>').join('') + '</ul>' : '';
    return review + '<p>' + e(result.message) + '</p>' + duplicateList;
  }
  const {leadership, junior} = result.groups;
  const differ = leadership.candidate && junior.candidate && leadership.candidate !== junior.candidate;
  let explanation = result.roleGroup ? 'Using the ' + emailCohorts[result.roleGroup] + ' group for this job title.' : result.message;
  if (!leadership.candidate && !junior.candidate) {
    explanation = result.roleGroup ? 'No suggestion yet. ' + result.groups[result.roleGroup].message :
      'Neither group has enough consistent evidence for a suggestion. Review their counts below.';
  }
  return review + '<p>' + e(explanation) + (differ ? ' The two groups use different formats.' : '') + '</p>' +
    Object.keys(emailCohorts).map(group => emailGroupPanel(contact, result, group)).join('') +
    '<p class="tiny muted">Suggestions need seven distinct colleagues and a format shared by at least 75% of that group. A match describes the company’s pattern. Mailbox delivery is unverified.</p>';
}


const addressSources = new Map([
  ['direct', 'Supplied by the contact'],
  ['directory', 'Confirmed in the company directory']
]);

function confirmedAddressSources(d, contactId) {
  const choices = new Map(addressSources);
  for (const call of d.calls) {
    if (call.contactId !== contactId || call.status !== 'Logged' || !call.connected) continue;
    const time = new Date(call.endedAt).toLocaleString('en-GB');
    choices.set(call.id, 'Confirmed on the ' + time + ' call');
  }
  return choices;
}

function recordConfirmedAddress(d, contactId, fields) {
  const contact = d.contacts.find(person => person.id === contactId);
  if (!contact) throw new Error('Select the contact who supplied the address.');
  const address = String(fields.address || '').trim().toLowerCase();
  const detail = String(fields.detail || '').trim();
  const source = confirmedAddressSources(d, contactId).get(fields.sourceId);
  if (!source || !detail) throw new Error('Choose a source and describe where you found the confirmed address.');
  if (!validContactAddress(address)) throw new Error('Enter the address confirmed by your source.');
  if (contact.email?.toLowerCase() === address && /bounc|undeliverable|invalid|failed/i.test(contact.emailStatus || ''))
    throw new Error('This address has a recorded delivery failure. Enter a corrected address.');
  if (emailCanBeUsed(contact)) {
    const previous = contact.emailEvidence;
    if (contact.email.toLowerCase() === address && previous?.address === address &&
        previous.sourceId === fields.sourceId && previous.detail === detail) return previous;
    throw new Error('This contact already has a saved address. Review the current contact before editing it.');
  }

  // Use the ordinary saved-address path, including duplicate checks and waiting follow-ups.
  const evidence = {address, sourceId: fields.sourceId, source, detail, at: new Date().toISOString(), actor: 'Demo operator'};
  saveContactEmail(d, contactId, address, evidence);
  const description = address + ' · ' + source + ' · ' + detail;
  d.activity.unshift({action: 'Email address confirmed', recordId: contactId, accountId: contact.accountId,
    at: evidence.at, actor: evidence.actor, detail: description});
  salesEvent(d, 'Email address confirmed', contactId, description);
  return evidence;
}

function saveContactAddressEntry(d, contactId, fields) {
  if (fields.sourceId || String(fields.detail || '').trim()) {
    recordConfirmedAddress(d, contactId, fields);
    return 'confirmed';
  }
  const contact = d.contacts.find(person => person.id === contactId);
  if (!contact) throw new Error('Select the contact before saving the email address.');
  const address = String(fields.address || '').trim().toLowerCase();
  if (!validContactAddress(address)) throw new Error('Enter a complete email address.');
  if (emailCanBeUsed(contact)) {
    if (contact.email.trim().toLowerCase() === address) return contact.emailEvidence ? 'confirmed' : 'entered';
    throw new Error('This contact already has a saved address. Review the contact before editing it.');
  }
  if (d.contacts.some(person => person.id !== contactId && contactHasAddress(person, address)))
    throw new Error('This address is already associated with another contact. Review that record.');
  const existing = (contact.email || '').trim().toLowerCase();
  if (existing === address && /bounc|undeliverable|invalid|failed/i.test(contact.emailStatus || ''))
    throw new Error('This address has a recorded delivery failure. Enter a corrected address.');
  if (matchesAddressSuggestion(contact, address, fields.suggestedEmail)) {
    if (matchesAddressSuggestion(contact, existing)) setContactAddress(contact, '');
    if (contact.suggestedEmail !== address) {
      contact.suggestedEmail = address;
      salesEvent(d, 'Email suggestion saved', contactId, address);
    }
    return 'suggested';
  }
  if (existing === address && !emailCanBeUsed(contact))
    throw new Error('Review the source and status of this address before using it.');
  saveContactEmail(d, contactId, address);
  return 'entered';
}

function contactAddressEvidence(d, contact) {
  const e = escapeHTML;
  if (emailCanBeUsed(contact)) {
    const evidence = contact.emailEvidence;
    if (!evidence || evidence.address !== contact.email.trim().toLowerCase()) return '';
    return '<p class="tiny">Address source · ' + e(evidence.source) + ' · ' + e(evidence.detail) +
      ' · recorded ' + e(new Date(evidence.at).toLocaleString('en-GB')) + '</p>';
  }
  return '';
}

function addressSourceOptions(d, contactId) {
  return Array.from(confirmedAddressSources(d, contactId), ([value, label]) =>
    '<option value="' + escapeHTML(value) + '">' + escapeHTML(label) + '</option>').join('');
}


const wandIcon = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 12-12 3 3L6 24z" transform="translate(0 -2)"/><path d="m12 10 3 3M5 3v4M3 5h4M18 2v5m-2.5-2.5h5M20 16v4m-2-2h4"/></svg>';

// Keep the property editor mounted behind the modal, including text that has not been saved.
function contactEmailField(d, contact, entry = null) {
  const e = escapeHTML;
  const pending = entry?.suggestedEmail ?? contact?.suggestedEmail ?? '';
  const original = contact?.email || '';
  const saved = emailCanBeUsed(contact);
  if (!entry && saved) return '<div><dt>Email</dt><dd tabindex="-1" data-saved-email>' + e(original) + contactAddressEvidence(d, contact) + '</dd></div>';
  const value = entry ? (entry.email || pending) : (pending || '');
  const inputId = entry ? 'entry-contact-email' : 'record-contact-email';
  const trigger = '<button type="button" class="crm-find-email" data-open-email-lookup data-do="find-email" aria-haspopup="dialog">' + wandIcon + '<span>Find email</span></button>';
  const fieldLabel = '<label for="' + inputId + '">Email</label>';
  const controls = '<div class="crm-email-controls"><input data-email-entry id="' + inputId + '" type="email" autocomplete="off" name="' + (entry ? 'email' : 'address') + '" value="' + e(value) + '" placeholder="Enter email address">' +
    (entry && saved ? '' : trigger) + '</div>';
  const hidden = '<input type="hidden" name="suggestedEmail" value="' + e(pending) + '">';
  const isPending = Boolean(value && pending && value.toLowerCase() === pending.toLowerCase());
  const note = '<p class="crm-email-note tiny" data-email-suggestion-note' + (isPending ? '' : ' hidden') + '>Unverified suggestion. Confirmation is needed before sending.</p>';
  if (entry) return '<div data-email-field>' + fieldLabel + controls + hidden + note + '</div>';
  const review = original ? '<p class="crm-email-note tiny">Previous entry · ' + e(original) + ' · ' + e(contact.emailStatus || 'Needs review') + '</p>' : '';
  const waiting = d.callJobs.some(job => job.contactId === contact.id && job.status === 'Waiting for email');
  const source = '<details class="crm-email-options"><summary>Add confirmation source</summary><div class="crm-fields">' +
    '<label>Confirmation source<select name="sourceId"><option value="">Choose a source</option>' + addressSourceOptions(d, contact.id) + '</select></label>' +
    '<label>Source detail<input name="detail" maxlength="500" placeholder="Where was the address confirmed?"></label></div></details>';
  return '<div data-email-field><dt>' + fieldLabel + '</dt><dd><form data-crm-form="address-entry" data-contact="' + e(contact.id) + '">' +
    controls + hidden + review + note + '<div class="crm-email-tools"' + (value ? '' : ' hidden') + '>' + source +
    (waiting ? '<p class="tiny muted">A waiting follow-up will recheck a saved address.</p>' : '') +
    '<button type="submit" class="small" data-email-save>' + (isPending ? 'Save suggestion' : 'Save email') + '</button></div></form></dd></div>';
}

function updateContactEmailField(field) {
  const input = field.querySelector('[data-email-entry]');
  const marker = field.querySelector('[name="suggestedEmail"]');
  const value = input.value.trim().toLowerCase();
  const pending = Boolean(value && value === marker.value.trim().toLowerCase());
  field.querySelector('[data-email-suggestion-note]').hidden = !pending;
  const tools = field.querySelector('.crm-email-tools');
  if (!tools) return;
  tools.hidden = !value;
  const source = field.querySelector('[name="sourceId"]').value;
  field.querySelector('[data-email-save]').textContent = source ? 'Save confirmed address' : pending ? 'Save suggestion' : 'Save email';
}

let currentLookup = null;
function closeContactEmailLookup() {
  if (currentLookup) currentLookup.dismiss(false);
}

function openContactEmailLookup(d, trigger) {
  closeContactEmailLookup();
  const field = trigger.closest('[data-email-field]');
  const input = field.querySelector('[data-email-entry]');
  const form = input.form;
  const saved = d.contacts.find(c => c.id === form.dataset.contact);
  const editing = form.dataset.crmForm === 'save';
  const values = editing ? Object.fromEntries(new FormData(form)) : null;
  const contact = editing ? {...saved, id:saved?.id || '', name:[values.firstName, values.lastName].filter(Boolean).join(' ').trim(),
    firstName:values.firstName.trim(), lastName:values.lastName.trim(), title:values.title, accountId:values.accountId} : saved;
  if (!contact) return;
  const company = d.accounts.find(a => a.id === contact.accountId);
  const dialog = document.createElement('dialog');
  dialog.className = 'crm-lookup-dialog';
  dialog.setAttribute('data-email-lookup-dialog', '');
  dialog.setAttribute('aria-labelledby', 'find-contact-email-title');
  dialog.innerHTML = '<header class="crm-lookup-head"><span class="crm-wand-mark" aria-hidden="true">' + wandIcon + '</span><div><h2 id="find-contact-email-title" tabindex="-1" autofocus>Find email</h2><p>' +
    escapeHTML([contact.name, company?.name].filter(Boolean).join(' · ')) + '</p></div><button type="button" data-close-lookup aria-label="Close">×</button></header>' +
    '<p class="crm-lookup-status" role="status" aria-live="polite"></p><div class="crm-lookup-body"></div>' +
    '<footer class="crm-lookup-footer"><button type="button" data-manual-entry>Enter email manually</button></footer>';
  trigger.closest('.crm-content').append(dialog);
  const body = dialog.querySelector('.crm-lookup-body');
  const status = dialog.querySelector('[role="status"]');
  let timer;
  let revision = 0;
  function dismiss(restore = true, target = trigger) {
    if (currentLookup?.dialog !== dialog) return;
    currentLookup = null;
    revision++;
    clearTimeout(timer);
    if (dialog.open) dialog.close();
    dialog.remove();
    if (restore && target.isConnected) target.focus();
  }
  function run() {
    const runId = ++revision;
    const started = performance.now();
    body.setAttribute('aria-busy','true');
    body.innerHTML = '<div class="crm-lookup-loading" aria-hidden="true"><span class="crm-lookup-spinner"></span><p>Checking saved company records…</p></div>';
    status.textContent = 'Checking saved company records…';
    // Let the browser paint first. The demo keeps its checking state briefly legible.
    timer = setTimeout(() => {
      if (runId !== revision || !dialog.open) return;
      let html, announcement;
      try {
        if (!contact.name || (editing && (!contact.firstName || !contact.lastName || !company))) {
          html = '<p>Enter the contact’s name and choose an existing company to compare address patterns.</p>';
          announcement = 'Name and company information needed.';
        } else {
          const result = researchContactEmail(d, contact);
          html = contactEmailResearch(d, contact, result);
          const available = Object.values(result.groups || {}).some(group => group.candidate);
          announcement = available ? 'Lookup complete. Review the suggested addresses.' : 'Lookup complete. No usable suggestion.';
        }
      } catch {
        html = '<p>The lookup could not finish.</p><button type="button" data-retry-lookup>Retry lookup</button>';
        announcement = 'Lookup could not finish. You can retry or enter the address manually.';
      }
      timer = setTimeout(() => {
        if (runId !== revision || !dialog.open) return;
        body.innerHTML = html;
        body.setAttribute('aria-busy','false');
        status.textContent = announcement;
      }, Math.max(0, 650 - (performance.now() - started)));
    }, 0);
  }
  currentLookup = {dialog, dismiss};
  dialog.addEventListener('cancel', event => { event.preventDefault(); dismiss(); });
  dialog.addEventListener('close', () => dismiss());
  dialog.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.hasAttribute('data-close-lookup')) dismiss();
    if (button.hasAttribute('data-manual-entry')) dismiss(true, input);
    if (button.hasAttribute('data-retry-lookup')) { dialog.querySelector('h2').focus(); run(); }
    if (button.hasAttribute('data-use-suggestion')) {
      input.value = button.dataset.useSuggestion;
      field.querySelector('[name="suggestedEmail"]').value = input.value;
      updateContactEmailField(field);
      dismiss(true, input);
    }
  });
  dialog.showModal();
  run();
}


const crmText = value => String(value ?? '').trim();
const crmFold = value => crmText(value).toLowerCase().replace(/\s+/g, ' ');
const crmEmail = value => crmText(value).toLowerCase();
const crmPhone = value => crmText(value).replace(/[^0-9]/g, '');
const crmNextId = (d, kind) => d.id + '-' + kind + '-' + d.nextSalesId++;

function crmLog(d, contact, action, detail, at) {
  d.activity.unshift({action, detail, at, actor: 'Demo operator', recordId: contact.id, accountId: contact.accountId});
  salesEvent(d, action, contact.id, detail);
}

function crmCompany(d, fields) {
  if (fields.accountId !== 'new') {
    const account = d.accounts.find(a => a.id === fields.accountId);
    if (!account) throw new Error('Select a company.');
    return {account};
  }
  const name = crmText(fields.company);
  const domain = crmEmail(fields.domain).replace(/^www\./, '');
  if (!name || !/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$/.test(domain)) {
    throw new Error('Enter the new company name and its website domain, such as northline.example.');
  }
  const existing = d.accounts.find(a => crmFold(a.name) === crmFold(name) || crmEmail(a.domain) === domain);
  if (existing) throw new Error('This company matches ' + existing.name + '. Select the existing company from the list.');
  return {newCompany: {name, domain, onboardingStatus:'Prospect', segment: 'Unclassified', region: crmText(fields.region) || 'Unspecified'}};
}

function crmReviewContact(d, fields, editingId = null) {
  const firstName = crmText(fields.firstName), lastName = crmText(fields.lastName);
  if (!firstName || !lastName) throw new Error('Enter the first name and last name.');
  if (!d.team.some(t => t.id === fields.ownerId)) throw new Error('Choose a record owner.');
  const existing = editingId ? d.contacts.find(c => c.id === editingId) : null;
  const typed = crmEmail(fields.email ?? existing?.email);
  const marker = crmEmail(fields.suggestedEmail);
  const address = typed || (Object.hasOwn(fields, 'suggestedEmail') ? marker : crmEmail(existing?.suggestedEmail));
  if (address && !validContactAddress(address)) throw new Error('Enter a complete email address or leave it blank.');
  const savedUnchanged = emailCanBeUsed(existing) && address === crmEmail(existing.email);
  const suggestedEmail = !savedUnchanged && matchesAddressSuggestion(existing, address, marker) ? address : '';
  if (suggestedEmail && emailCanBeUsed(existing)) throw new Error('This contact already has a saved address. Review it before saving a suggestion.');
  const email = suggestedEmail ? '' : address;
  const phone = crmText(fields.phone);
  if (phone && (crmPhone(phone).length < 7 || crmPhone(phone).length > 16)) throw new Error('Enter a complete phone number or leave it blank.');
  if (fields.callAllowed && !phone) throw new Error('Add a phone number before enabling calls.');
  const company = crmCompany(d, fields);
  const name = firstName + ' ' + lastName;
  const matches = d.contacts.flatMap(contact => {
    if (contact.id === editingId) return [];
    const reasons = [];
    const addressMatch = contactHasAddress(contact, address);
    const savedMatch = addressMatch && crmEmail(contact.email) === address && !matchesAddressSuggestion(contact, address);
    if (addressMatch) reasons.push(savedMatch ? 'same email' : 'same address on another record (unverified)');
    if (company.account && contact.accountId === company.account.id && crmFold(contact.name) === crmFold(name)) reasons.push('same name and company');
    if (phone && crmPhone(contact.phone) === crmPhone(phone)) reasons.push('same phone');
    return reasons.length ? [{id: contact.id, name: contact.name, reasons, exact: addressMatch, savedEmailMatch: savedMatch}] : [];
  });
  return {company, name, firstName, lastName, email, suggestedEmail, phone, matches};
}

function crmSaveContact(d, fields, {reviewed = false, editingId = null} = {}) {
  const existing = editingId ? d.contacts.find(c => c.id === editingId) : null;
  if (editingId && !existing) throw new Error('This contact is no longer available.');
  if (existing && Object.hasOwn(fields, 'originalEmail') && crmEmail(fields.originalEmail) !== crmEmail(existing.email))
    throw new Error('The saved address changed since you opened this contact. Reopen it to review the current address.');
  const check = crmReviewContact(d, fields, editingId);
  if (check.matches.some(m => m.exact) || (check.matches.length && !reviewed)) throw new Error('Review the matching records before creating a contact.');
  const owner = d.team.find(t => t.id === fields.ownerId);
  const account = check.company.account || {...check.company.newCompany, id: crmNextId(d, 'company'), owner: owner.name};
  const contact = {
    id: existing?.id || crmNextId(d, 'contact'), accountId: account.id, ownerId: owner.id, name: check.name, firstName: check.firstName,
    lastName: check.lastName, email: check.email, phone: check.phone, title: crmText(fields.title),
    timezone: crmText(fields.timezone) || 'Unspecified', need: crmText(fields.need), source: crmText(fields.source) || 'Manual entry',
    emailAllowed: !!fields.emailAllowed, callAllowed: !!fields.callAllowed, queueStatus: fields.callAllowed ? 'Ready' : 'Excluded',
    lastTouch: existing?.lastTouch || 'Record created'
  };
  if (check.suggestedEmail) contact.suggestedEmail = check.suggestedEmail;
  if (check.company.newCompany) d.accounts.push(account);
  if (existing) {
    if (existing.callAllowed === contact.callAllowed) contact.queueStatus=existing.queueStatus;
    const preferencesChanged = existing.emailAllowed !== contact.emailAllowed;
    const addressChanged = existing.email !== contact.email;
    setContactAddress(existing,contact.email);
    if (!check.suggestedEmail && Object.hasOwn(fields,'suggestedEmail')) delete existing.suggestedEmail;
    Object.assign(existing, contact);
    crmLog(d, existing, 'Contact updated', existing.source + ' · ' + account.name, new Date().toISOString());
    if (preferencesChanged || (addressChanged && emailCanBeUsed(existing))) processCallJobs(d);
    return existing;
  }
  d.contacts.push(contact);
  crmLog(d, contact, 'Contact created', contact.source + ' · ' + account.name, new Date().toISOString());
  return contact;
}

function crmReadInbound(d, fields) {
  const address = crmEmail(fields.sender), subject = crmText(fields.subject), body = crmText(fields.body);
  if (!validContactAddress(address) || !subject || !body) throw new Error('Enter a sender address, subject and message.');
  const when = new Date(fields.received);
  if (!Number.isFinite(when.getTime())) throw new Error('Choose when the message was received.');
  const at = when.toISOString(), messageId = crmText(fields.messageId);
  const fingerprint = JSON.stringify([address, at, subject, body]);
  const existing = (d.crmEmails || []).find(m => m.direction === 'Incoming' && ((messageId && m.messageId === messageId) || m.fingerprint === fingerprint));
  if (existing && existing.fingerprint !== fingerprint) throw new Error('This message ID is already attached to a different email. Check the original message.');
  const contact = d.contacts.find(c => crmEmail(c.email) === address && !matchesAddressSuggestion(c, address));
  return {contact, existing, email: {direction:'Incoming', address, at, subject, body, messageId, fingerprint}};
}

function crmLogInbound(d, fields) {
  const {contact, existing, email} = crmReadInbound(d, fields);
  if (existing) return {contactId: existing.contactId, duplicate: true};
  if (!contact) throw new Error('Create or link the sender’s contact record first.');
  const record = {...email, id: crmNextId(d, 'inbound'), contactId: contact.id, accountId: contact.accountId};
  (d.crmEmails ||= []).unshift(record);
  contact.lastTouch = 'Incoming email logged';
  crmLog(d, contact, contact.lastTouch, record.subject, record.at);
  return {contactId: contact.id, duplicate: false};
}

function crmSendEmail(d, contactId, fields) {
  const contact = d.contacts.find(c => c.id === contactId);
  if (!emailCanBeUsed(contact)) throw new Error('A saved contact email is required.');
  if (!contact.emailAllowed) throw new Error('Email follow-up is disabled for this contact.');
  const subject = crmText(fields.subject), body = crmText(fields.body);
  if (!subject || !body) throw new Error('Enter a subject and a message.');
  const message = {id: crmNextId(d, 'outgoing'), contactId, accountId: contact.accountId, direction:'Outgoing', status:'Sent (demo)', address:contact.email, subject, body, at:new Date().toISOString()};
  (d.crmEmails ||= []).unshift(message);
  contact.lastTouch = 'Email sent (demo)';
  crmLog(d, contact, contact.lastTouch, subject, message.at);
  return message;
}

function crmBeginDraft(d, contactId, {replyToId = '', callId = ''} = {}) {
  const contact = d.contacts.find(person => person.id === contactId);
  if (!contact) throw new Error('Open the contact before composing an email.');
  const original = replyToId && (d.crmEmails || []).find(m => m.id === replyToId && m.contactId === contactId && m.direction === 'Incoming');
  if (replyToId && !original) throw new Error('Open an incoming message from this contact to reply.');
  const call = callId && d.calls.find(item => item.id === callId && item.contactId === contactId && item.status === 'Logged');
  if (callId && !call) throw new Error('Choose a completed call for this contact.');
  const draft = {
    id:crmNextId(d,'draft'), contactId, accountId:contact.accountId, version:0, replyToId, callId,
    address:emailCanBeUsed(contact) ? (original?.address || contact.email) : '', subject:'', body:''
  };
  if (original) draft.subject = /^re:/i.test(original.subject) ? original.subject : 'Re: ' + original.subject;
  if (call) {
    draft.subject = 'Following up on our call';
    draft.body = 'Hi ' + (contact.firstName || contact.name.split(' ')[0]) + ',\n\n' +
      (call.nextStep ? 'We agreed on the following next step.\n' + call.nextStep : 'Thank you for your time.') + '\n\n';
  }
  return draft;
}

function crmCheckDraft(d, draft) {
  if (!draft.id || !d.contacts.some(c => c.id === draft.contactId)) throw new Error('Open a contact and start an email draft.');
  const saved = (d.crmDrafts || []).find(item => item.id === draft.id);
  if ((saved?.version || 0) !== draft.version || (saved && (saved.contactId !== draft.contactId || saved.replyToId !== draft.replyToId || saved.callId !== draft.callId))) {
    throw new Error('The saved draft has changed. Reopen it from the contact to continue.');
  }
  if (draft.replyToId && !(d.crmEmails || []).some(m => m.id === draft.replyToId && m.direction === 'Incoming' && m.contactId === draft.contactId)) {
    throw new Error('The original incoming message is unavailable.');
  }
  if (draft.callId && !d.calls.some(c => c.id === draft.callId && c.contactId === draft.contactId && c.status === 'Logged')) {
    throw new Error('The linked call is unavailable.');
  }
  return saved;
}

function crmSaveDraft(d, draft) {
  if ((d.crmEmails || []).some(message => message.draftId === draft.id)) throw new Error('This draft has already been sent.');
  const previous = (d.crmDrafts || []).find(row => row.id === draft.id);
  if (previous && [previous.version, previous.version-1].includes(draft.version) &&
      ['contactId','callId','replyToId','subject','body','address'].every(key => previous[key] === draft[key])) return {...previous};
  const saved = crmCheckDraft(d,draft);
  if (!crmText(draft.subject) && !crmText(draft.body)) throw new Error('Add a subject or some message text before saving the draft.');
  const contact = d.contacts.find(person => person.id === draft.contactId);
  const next = {...draft, accountId:contact.accountId, version:draft.version + 1, updatedAt:new Date().toISOString()};
  if (saved) Object.assign(saved,next);
  else (d.crmDrafts ||= []).unshift(next);
  crmLog(d, contact, 'Email draft saved', crmText(draft.subject) || 'Untitled email', next.updatedAt);
  return {...next};
}

function crmSendDraft(d, draft) {
  const sent = (d.crmEmails || []).find(message => message.draftId === draft.id);
  if (sent) {
    if (sent.contactId === draft.contactId && sent.replyToId === draft.replyToId && sent.callId === draft.callId &&
        crmEmail(sent.address) === crmEmail(draft.address) && sent.subject === crmText(draft.subject) && sent.body === crmText(draft.body)) return sent;
    throw new Error('This draft has already been sent.');
  }
  const saved = crmCheckDraft(d,draft);
  const contact = d.contacts.find(person => person.id === draft.contactId);
  if (!draft.address || crmEmail(draft.address) !== crmEmail(contact.email)) {
    throw new Error('Review the current saved recipient before sending.');
  }
  const original = draft.replyToId && d.crmEmails.find(message => message.id === draft.replyToId);
  if (original && crmEmail(original.address) !== crmEmail(draft.address)) throw new Error('The original sender differs from this address. Compose a new email to the current recipient.');
  const message = crmSendEmail(d,contact.id,draft);
  Object.assign(message,{draftId:draft.id, replyToId:draft.replyToId, threadId:original?.threadId || original?.id || message.id, callId:draft.callId});
  if (saved) d.crmDrafts = d.crmDrafts.filter(item => item.id !== draft.id);
  return message;
}

function crmInteraction(d,s,action,el) {
  const screen=crmScreen(d);
  if(action==='address-entry'){
    if(crmCurrent(d,s).id!==el.dataset.contact) throw new Error('Reopen this contact before recording an address.');
    const result=saveContactAddressEntry(d,el.dataset.contact,Object.fromEntries(new FormData(el)));
    return {entered:'Email saved.',suggested:'Unverified suggestion saved.',confirmed:'Confirmed address and source saved.'}[result];
  }
  if(action==='select'){crmSelect(d,s,el.value);crmResetScreen(screen);return '';}
  if(action==='edit'){
    crmSelectCheck(d);
    const contact=crmCurrent(d,s), parts=contact.name.split(/\s+/);
    crmResetScreen(screen,'entry');screen.editingId=contact.id;
    screen.draft={...contact,originalEmail:contact.email || '',firstName:contact.firstName || parts[0],lastName:contact.lastName || parts.slice(1).join(' '),source:contact.source || 'Manual entry'};
    return '';
  }
  if(['compose','reply','follow-up','resume-draft'].includes(action)){
    const c=crmCurrent(d,s);
    const existing=action==='resume-draft' && (d.crmDrafts || []).find(row=>row.id===el.dataset.id && row.contactId===c.id);
    if(action==='resume-draft' && !existing) throw new Error('This draft is no longer available.');
    const draft=existing ? {...existing} : crmBeginDraft(d,c.id,{
      replyToId:action==='reply'?el.dataset.id:'', callId:action==='follow-up'?el.dataset.id:''
    });
    crmResetScreen(screen,'compose');
    screen.composeId=c.id;screen.mailDraft=draft;s.view='contacts';
    return '';
  }
  if(['close','add','inbox'].includes(action)){
    if(action==='add'||action==='inbox')crmSelectCheck(d);
    crmResetScreen(screen, {close:'record',add:'entry',inbox:'inbox'}[action]);
    return '';
  }
  if(action==='sample-message'){
    screen.mailDraft={sender:'avery@northline.example',received:'2026-11-18T10:30',messageId:'sample-brief-01@northline.example',subject:'Delivery reporting brief',body:'Could you show our team how reporting moves from sales to delivery?'};
    return '';
  }
  if(action==='use-match'){
    crmSelect(d,s,el.dataset.id);
    if(screen.incoming)crmLogInbound(d,screen.incoming);
    crmResetScreen(screen);return 'Existing contact opened.';
  }
  const v=crmValues(el);
  if(['save-draft','send-draft','update-recipient'].includes(action)){
    const contact=crmCurrent(d,s), draft=screen.mailDraft;
    if(!draft || draft.id!==el.dataset.draft || draft.contactId!==contact.id) throw new Error('Reopen the draft on its contact record.');
    Object.assign(draft,{subject:v.subject,body:v.body});
    if(action==='update-recipient'){
      const original=draft.replyToId && d.crmEmails?.find(m=>m.id===draft.replyToId);
      if(!emailCanBeUsed(contact) || (original && original.address.toLowerCase()!==contact.email.toLowerCase()))throw new Error('Review the contact’s saved address.');
      draft.address=contact.email;
      return 'Draft recipient updated.';
    }
    if(action==='save-draft')crmSaveDraft(d,draft);
    else crmSendDraft(d,draft);
    crmResetScreen(screen);
    return action==='save-draft'?'Draft saved on the contact.':'Simulated email added to the contact history.';
  }
  if(action==='receive'){
    const result=crmReadInbound(d,v);
    if(result.existing || result.contact){
      const id=result.existing?.contactId || result.contact.id;crmSelect(d,s,id);
      const saved=crmLogInbound(d,v);crmResetScreen(screen);
      return saved.duplicate?'Message already logged. Existing record opened.':'Incoming email linked to the contact and company.';
    }
    crmSelectCheck(d);crmResetScreen(screen,'entry');
    screen.incoming=v;
    const domain=result.email.address.split('@')[1];
    const company=d.accounts.find(a=>a.domain?.toLowerCase()===domain);
    screen.draft={email:v.sender,source:'Incoming email',accountId:company?.id || '',domain};
    return 'New sender. Add their contact details to finish logging this message.';
  }
  if(action==='save'){
    crmSelectCheck(d);
    if(screen.incoming)v.email=screen.incoming.sender;
    const check=crmReviewContact(d,v,screen.editingId);
    const reviewed=v.override==='on' && check.matches.length>0 && screen.matches?.length===check.matches.length && check.matches.every(m=>screen.matches.some(previous=>previous.id===m.id));
    if(check.matches.some(m=>m.exact) || (check.matches.length && !reviewed)){
      screen.draft=v;screen.matches=check.matches;return 'Review the matching contact records.';
    }
    const contact=crmSaveContact(d,v,{reviewed,editingId:screen.editingId});
    if(screen.incoming)crmLogInbound(d,screen.incoming);
    crmSelect(d,s,contact.id);crmResetScreen(screen);return 'Contact saved.';
  }
  throw new Error('Unknown contact action.');
}

function recordDependency(d,id,role,values,version){
  const work=d.work.find(item=>item.id===id);
  if(role!=='operations'||!work?.issue||work.status==='Complete')throw Error('This delivery dependency is no longer awaiting an Operations decision.');
  if(Number(version)!==(work.dependencyRevision||0))throw Error('The dependency has changed. Reopen the work item.');
  const note=String(values.note||'').trim();
  if(!note)throw Error('Enter the follow-up detail or the evidence that clears the dependency.');
  if(!['follow','clear'].includes(values.decision))throw Error('Choose a follow-up or a resolution.');
  if(values.decision==='follow'){
    const due=String(values.due||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(due)||!Number.isFinite(Date.parse(due))||new Date(due).toISOString().slice(0,10)!==due||due<'2026-11-20')throw Error('Choose a follow-up date on or after 20 November 2026.');
    work.dependencyDue=due;
  }
  const issue=work.issue;
  if(values.decision==='clear'){
    work.issue='';work.resolutionEvidence=note;delete work.dependencyDue;
  }
  work.dependencyRevision=(work.dependencyRevision||0)+1;
  d.activity.unshift({action:work.issue?'Dependency follow-up recorded':'Dependency cleared',recordId:id,accountId:work.accountId,
    actor:'Operations',at:new Date().toISOString(),detail:[issue,note,work.owner,work.dependencyDue].filter(Boolean).join(' · ')});
}

// Compare each role with its own last visit so an incoming decision can surface
// when the user switches desks, even when the request was made on another desk.
function workspaceAlertTracker(baseline) {
  const signature = item => JSON.stringify([item.key, item.title, item.detail, item.due, item.severity, item.revision]);
  let previous = new Set(baseline.map(signature));
  let active = new Set();
  return {
    update(items, readingQueue) {
      const next = new Set(items.map(signature));
      active = new Set([...active].filter(key => next.has(key)));
      for (const key of next) if (!previous.has(key)) active.add(key);
      previous = next;
      if (readingQueue) active.clear();
      return items.filter(item => active.has(signature(item)));
    },
    dismiss() { active.clear(); }
  };
}

const defaultWorkspaceTextSize = 100;

// Retire the preference saved by earlier demos. New visits keep their size in memory.
try { localStorage.removeItem('data-saver-workspace-size'); } catch {}
const minimumTextSize = 85;
const maximumTextSize = 175;
const textSizeStep = 5;

function normalizeTextSize(value) {
  const number = Number(value);
  if (value == null || String(value).trim() === '' || !Number.isFinite(number)) return defaultWorkspaceTextSize;
  const nearestStep = Math.round(number / textSizeStep) * textSizeStep;
  return Math.min(maximumTextSize, Math.max(minimumTextSize, nearestStep));
}


function setWorkspaceTextSize(value) {
  const size = normalizeTextSize(value);
  const style = document.documentElement.style;
  style.setProperty('--workspace-text-scale', size / 100);
  style.setProperty('--workspace-size-fill', workspaceRangeFill(size, minimumTextSize, maximumTextSize));
  return size;
}

function workspaceRangeFill(value, min, max) {
  const percent = 100 * (value - min) / (max - min);
  return Number(percent.toFixed(4)) + '%';
}

function workspaceRangeInput({id, min, max, step, value, valueText, control}) {
  const attributes = control ? ` data-control="${control}"` : '';
  const fill = control ? ` style="--range-fill:${workspaceRangeFill(value,min,max)}"` : '';
  return `<div class="workspace-range${control ? '' : ' workspace-size-slider'}"${fill}>
    <span class="workspace-range-rail" aria-hidden="true"></span>
    <input class="workspace-range-input" id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" aria-valuetext="${valueText}"${attributes}>
  </div>`;
}

function workspaceTextSizeControl(value) {
  const size = normalizeTextSize(value);
  return `<div class="workspace-size">
    <div class="workspace-size-readout"><label for="workspace-size">Text size</label><output id="workspace-size-value" for="workspace-size" aria-hidden="true">${size}%</output></div>
    ${workspaceRangeInput({id:'workspace-size',min:minimumTextSize,max:maximumTextSize,step:textSizeStep,value:size,valueText:size+' percent'})}
  </div>`;
}

function syncWorkspaceTextSize(controlRoot, size) {
  const slider = controlRoot.querySelector('#workspace-size');
  if (!slider) return;
  if (slider.value !== String(size)) slider.value = String(size);
  slider.setAttribute('aria-valuetext', size + ' percent');
  const output = controlRoot.querySelector('#workspace-size-value');
  if (output) output.textContent = size + '%';
}

// Keep the original workspace mounted while the independent Events CRM is open.
function installNorthstarPreview({dialog,url,fallbackHash,onReturn,onHome}){
  const frame=dialog.querySelector('iframe');
  const back=dialog.querySelector('[data-northstar-back]');
  const hash='#northstar-events';
  let trigger=null;
  let goingBack=false;
  let frameStarted=false;
  let homeAfterClose=false;
  function show(){
    if(dialog.open)return;
    if(!frameStarted){
      const target=new URL(url,document.baseURI);
      target.searchParams.set('embed','northstar');
      // A new iframe history entry would consume Back before the preview hash in Safari.
      frame.contentWindow.location.replace(target.href);
      frameStarted=true;
    }else{
      frame.contentWindow.postMessage({type:'data-saver-reset-text-size'},location.protocol==='file:'?'*':location.origin);
    }
    dialog.showModal();
    back.focus({preventScroll:true});
  }
  function finish(){
    if(!dialog.open)return;
    dialog.close();
    goingBack=false;
    if(homeAfterClose){homeAfterClose=false;onHome?.();}
    else {
      // Fragment navigation restores its own focus after popstate dispatch.
      requestAnimationFrame(()=>{
        if(dialog.open)return;
        if(onReturn)onReturn(trigger);
        else trigger?.focus({preventScroll:true});
      });
    }
  }
  function open(from){
    if(dialog.open)return;
    if(from)trigger=from;
    if(location.hash!==hash)history.pushState({...history.state,northstarPreview:true},'',hash);
    show();
  }
  function close(home=false){
    if(!dialog.open || goingBack)return;
    homeAfterClose=home;
    if(location.hash===hash && history.state?.northstarPreview){
      goingBack=true;
      history.back();
    }else finish();
  }
  function restore(explicit=false){
    if(!explicit && location.hash!==hash)return;
    if(history.state?.northstarPreview && location.hash===hash){show();return;}
    // A shared preview URL has no in-page return entry yet.
    if(location.hash===hash){
      history.replaceState(history.state,'',fallbackHash() || location.pathname+location.search);
    }
    open();
  }
  window.addEventListener('popstate',()=>{
    if(location.hash!==hash){finish();return;}
    if(!history.state?.northstarPreview)history.replaceState({...history.state,northstarPreview:true},'',hash);
    show();
  });
  back.addEventListener('click',()=>close());
  dialog.addEventListener('cancel',event=>{event.preventDefault();close();});
  window.addEventListener('message',event=>{
    const sameOrigin=event.origin===location.origin || (location.protocol==='file:' && event.origin==='null');
    if(!dialog.open || event.source!==frame.contentWindow || !sameOrigin)return;
    if(event.data?.type==='data-saver-northstar-close')close();
    if(event.data?.type==='data-saver-northstar-home')close(true);
  });
  return {open,close,restore,isOpen:()=>dialog.open};
}

function heading(){const title=ROLE_TITLES[state.view]|| (state.view==='graph'?'Relationships':state.view==='records'?`${state.role==='leadership'?D().config.domain:R().name+' records'}.`:roleTitles[state.role]);return `<div class="page-heading"><div><p class="eyebrow">${e(D().config.tagline)}</p><h1>${e(title)}</h1><p>${e(R().focus)}.</p></div><div class="heading-aside">Connected sample data<br>${D().accounts.length} accounts · ${D().config.domain.toLowerCase()}</div></div>`;}
function statGrid(){const d=D(),m=metrics(d);let list=[];
  if((state.role==='sales'||state.role==='saleslead'))list=[['Open pipeline',compact(m.pipeline),'Unwon opportunities'],['Weighted bookings',compact(m.weighted),'Value × stage probability'],['Won bookings',compact(m.won),'Contract value, not cash received'],['Open opportunities',d.opportunities.filter(x=>x.probability<1).length,'Across the commercial journey']];
  if(state.role==='finance')list=[['Opening cash',compact(m.cash),'Illustrative starting balance'],['Open receivables',compact(m.receivables),'Invoices less amounts paid'],['Overdue balance',compact(m.overdue),'Outstanding past-due invoices'],['Monthly costs',compact(d.monthlyCostPence),'Fixed planning assumption']];

  if(state.role==='people')list=[['Team members',d.team.length,'Sample delivery team'],['Available this week',sum(d.team,t=>availability(d,t.id,'2026-11-16').available)+'h','Week of 16 Nov · after approved leave'],['Allocation',Math.round(m.allocated/Math.max(1,sum(d.team,t=>availability(d,t.id,'2026-11-16').available))*100)+'%','Planned hours / available hours'],['Over capacity',d.team.filter(t=>t.allocated>availability(d,t.id,'2026-11-16').available).length,'People needing a workload review']];
  if(state.role==='leadership')list=[['Won bookings',compact(m.won),'Contract value, not revenue'],['Open receivables',compact(m.receivables),'Uncollected invoice balance'],['Work in flight',m.active,'Queued, active and in review'],[D().config.domain,d.domain.length,'Connected industry records']];
  return `<div class="stat-grid">${list.map(([label,value,note])=>`<section class="stat"><div class="stat-label">${e(label)}</div><div class="stat-value">${e(value)}</div><div class="stat-note">${e(note)}</div></section>`).join('')}</div>`;
}
function panel(title,subtitle,body,extra='',className=''){return `<section class="panel ${className}"><div class="panel-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${extra}</div><div class="panel-body">${body}</div></section>`;}
function historicalChart(){const h=D().history;return lineChart([{name:'Cash received',values:h.map(x=>x.receiptsPence),color:'var(--accent)'},{name:'Cash costs',values:h.map(x=>x.costsPence),color:'var(--muted)',dashed:true}],{labels:h.map(x=>x.month),title:'Illustrative historical cash received and costs, June to November 2026'});}
function concentration(){const rows=D().accounts.map(a=>({...a,total:sum(D().invoices.filter(i=>i.accountId===a.id),balance)})).sort((a,b)=>b.total-a.total).slice(0,5);const max=Math.max(...rows.map(a=>a.total),1);return rows.map(a=>`<div class="bar-row"><span class="bar-label">${link(a,a.name)}</span><div class="bar-track"><span style="width:${a.total/max*100}%"></span></div><strong>${compact(a.total)}</strong></div>`).join('');}
function pipelineBars(){const rows=D().config.stages.map(stage=>({stage,value:sum(D().opportunities.filter(d=>d.stage===stage),'valuePence')}));const max=Math.max(...rows.map(s=>s.value),1);return rows.map((s,i)=>`<div class="bar-row"><span>${e(s.stage)}</span><div class="bar-track"><span style="width:${s.value/max*100}%;opacity:${1-i*.15}"></span></div><strong>${compact(s.value)}</strong></div>`).join('');}
function insights(){const d=D(),m=metrics(d);const high=d.team.filter(t=>t.allocated>t.capacity);const entries=state.role==='finance'?[['Review overdue invoices',`${compact(m.overdue)} remains outstanding on invoices marked overdue.`,'records'],['Test a slower collection cycle','Compare the baseline with a one-month delay before making a planning decision.','forecast'],['Account balances','Trace a balance to its account without losing the financial view.','graph']]:(state.role==='sales'||state.role==='saleslead')?[['Late-stage opportunities',`${d.opportunities.filter(o=>o.probability===.7).length} opportunities are at the final open stage.`,'board'],['Bookings are not cash','The weighted pipeline is a scenario using explicit stage probabilities.','overview'],['Account relationships','Explore opportunities and their owners around one account.','graph']]:state.role==='people'?[['Review the overloaded people',`${high.length} team members exceed the 40-hour capacity assumption.`,'capacity'],['Inspect the work behind the hours','Reassign a work item and see both people’s allocation update.','timeline'],['Work assignments','See the account and owner linked to each commitment.','graph']]:[['Review the delivery handoffs',`${d.work.filter(w=>w.issue&&w.status!=='Complete').length} open work items have a dependency flag.`,'timeline'],['Watch customer concentration','Outstanding balances are unevenly distributed across the accounts.','graph'],['Review records','Switch function to see what the same business means to a different team.','records']];return entries.map(([title,text,view],i)=>`<div class="insight"><strong><span class="num">0${i+1}</span>${e(title)}</strong><p>${e(text)}</p>${view===state.view?'':b('view',(R().views.includes(view)?'Explore ':'Open operations view ')+glyph('arrow'),'text-button',`data-view="${view}" ${R().views.includes(view)?'':'data-role="operations"'}`)}</div>`).join('');}
function overviewView(){
  if(state.role==='people')return statGrid()+capacityView(false);
  const chart=(state.role==='sales'||state.role==='saleslead')?panel('A pipeline with context','Total contract value by stage',pipelineBars(),b('view','Open pipeline '+glyph('arrow'),'text-button tiny','data-view="board"')):panel('The last six months','Illustrative cash activity · June–November 2026',historicalChart());

  return statGrid()+`<div class="two-col"><div class="stack">${chart}${panel(state.role==='operations'?'Work to watch':(state.role==='sales'||state.role==='saleslead')?'Next conversations':'Receivables by account',state.role==='operations'?'Open items with a dependency':(state.role==='sales'||state.role==='saleslead')?'Highest-value open opportunities':'Outstanding invoice balances · highest five accounts',state.role==='operations'?compactWork():(state.role==='sales'||state.role==='saleslead')?compactDeals():concentration())}</div>${panel('On the agenda','A role-specific reading of the sample data',insights())}</div>`;

function compactWork(){return D().work.filter(w=>w.issue&&w.status!=='Complete').map(w=>`<div class="insight">${link(w)}<p>${e(accountName(w.accountId))} · ${e(w.issue)}</p></div>`).join('');}
function compactDeals(){return D().opportunities.filter(o=>o.probability<1).sort((a,b)=>b.valuePence-a.valuePence).slice(0,4).map(o=>`<div class="insight row between"><div>${link(o)}<p>${e(o.next)}</p></div><strong>${compact(o.valuePence)}</strong></div>`).join('');}
function boardView(){const d=D();return statGrid()+`<div class="board">${d.config.stages.map(stage=>{const rows=d.opportunities.filter(o=>o.stage===stage);return `<section class="board-column"><div class="column-title">${e(stage)}<span>${rows.length} · ${compact(sum(rows,'valuePence'))}</span></div>${rows.map(o=>`<article class="deal-card"><span class="eyebrow">${e(accountName(o.accountId))}</span><h3>${e(o.name.split(' · ')[1])}</h3><p>Expected close · ${MONTHS[o.closeMonth-1]}</p><div class="deal-value">${compact(o.valuePence)}</div><p>${e(o.next)}</p><footer><span class="row tiny">${personAvatar(o.owner)}${e(o.owner.split(' ')[0])}</span>${b('record','Open '+glyph('arrow'),'text-button tiny',`data-id="${o.id}"`)}</footer></article>`).join('')}</section>`;}).join('')}</div><p class="footnote">Stage probabilities are illustrative: 20%, 45%, 70%, 100%. Moving a record updates bookings metrics; it does not create a payment or recognise revenue.</p>`;}
const forecastRanges = [
  {id:'collection-delay',control:'delay',label:'Collection delay',min:0,max:3,step:1,
   format:value=>value+' month'+(value===1?'':'s')},
  {id:'cost-change',control:'costChange',label:'Monthly cost change',min:-20,max:30,step:5,
   format:value=>(value>0?'+':'')+value+'%'}
];
function forecastRangeControl(range) {
  const value=state[range.control], formatted=range.format(value);
  return `<div><div class="scenario-readout"><label for="${range.id}">${range.label}</label>
    <output id="${range.id}-value" for="${range.id}" aria-hidden="true">${formatted}</output></div>
    ${workspaceRangeInput({...range,value,valueText:formatted})}</div>`;
}
function forecastFigures() {
  const d=D(), base=cashForecast(d), scenario=cashForecast(d,state);
  const last=scenario.at(-1), delta=last.cash-base.at(-1).cash;
  return {
    chart:lineChart([{name:'Baseline',values:base.map(x=>x.cash),color:'var(--muted)',dashed:true},{name:'Your scenario',values:scenario.map(x=>x.cash),color:'var(--accent)'}],{labels:MONTHS,title:'Baseline and scenario closing cash balances'}),
    months:scenario.map((r,i)=>`<tr><td>${MONTHS[i]}</td><td>${gbp(r.receipts)}</td><td>${gbp(r.potential)}</td><td>${gbp(r.costs)}</td><td>${gbp(r.cash)}</td></tr>`).join(''),
    summary:`<p class="eyebrow">May closing cash</p><div class="big">${compact(last.cash)}</div>${tag(`${delta>=0?'+':''}${compact(delta)} vs baseline`,delta<0?'warn':'good')}<p>${last.cash<0?'The scenario ends below zero. Inspect the timing and cost assumptions before planning action.':'This is the cash remaining under the selected assumptions, not a prediction or financial recommendation.'}</p><div class="formula">Opening cash + invoice collections ${state.pipeline?'+ weighted pipeline ':''}− monthly costs.<br>Receipts delayed beyond May are outside this chart, not written off.</div>`
  };
}
function refreshForecast() {
  const figures=forecastFigures();
  for(const [part,html] of Object.entries(figures)) root.querySelector('[data-forecast="'+part+'"]').innerHTML=html;
  for(const range of forecastRanges){
    const input=root.querySelector('#'+range.id), value=state[range.control], formatted=range.format(value);
    if(input.value!==String(value)) input.value=String(value);
    input.setAttribute('aria-valuetext',formatted);
    input.parentElement.style.setProperty('--range-fill',workspaceRangeFill(value,range.min,range.max));
    root.querySelector('#'+range.id+'-value').textContent=formatted;
  }
  root.querySelector('[data-control="pipeline"]').checked=state.pipeline;
}
function changeForecastControl(input) {
  const key=input.dataset.control, value=key==='pipeline'?input.checked:Number(input.value);
  if(state[key]===value) return;
  state[key]=value;
  refreshForecast();
}

    <div class="panel-body"><div data-forecast="chart">${figures.chart}</div>
    <div class="scenario-controls">${forecastRanges.map(forecastRangeControl).join('')}</div>
    <label class="check-label"><input type="checkbox" data-control="pipeline" ${state.pipeline?'checked':''}> Include weighted open pipeline as same-month cash (illustrative assumption)</label>
    <details class="spaced" data-forecast-calculation ${state.forecastCalculationOpen?'open':''}><summary>Inspect the monthly calculation</summary><div class="table-scroll"><table><thead><tr><th>Month</th><th>Invoice receipts</th><th>Pipeline assumption</th><th>Costs</th><th>Closing cash</th></tr></thead><tbody data-forecast="months">${figures.months}</tbody></table></div></details></div></section>
    <div class="stack"><aside class="scenario-summary"><div data-forecast="summary">${figures.summary}</div>${b('reset-forecast','Reset assumptions','small spaced')}</aside>
    ${panel('What sits behind the balance','Highest outstanding account balances',concentration())}</div></div>`;
}
function timelineView(){return statGrid()+`<section class="panel"><div class="panel-head"><div><h2>Delivery, without the blind spots</h2><p>Illustrative eight-week plan · 16 Nov 2026–10 Jan 2027</p></div>${tag('16 work items')}</div><div class="timeline-scroll"><div class="timeline"><div class="timeline-header"><span>Work / owner</span><div class="timeline-weeks">${['16 Nov','23 Nov','30 Nov','7 Dec','14 Dec','21 Dec','28 Dec','4 Jan'].map(x=>`<span>${x}</span>`).join('')}</div></div>${D().work.map(w=>`<div class="timeline-row"><div class="timeline-label">${link(w)}<small>${e(w.owner)} · ${e(accountName(w.accountId))}</small></div><div class="timeline-track">${b('record',e(w.status),`timeline-bar ${w.status.toLowerCase()}`,`data-id="${w.id}" style="grid-column:${w.startWeek+1}/span ${w.durationWeeks}"`)}</div></div>`).join('')}</div></div></section><p class="footnote">Open a work item to inspect its dependency or change its owner. Planned hours are weekly workload assumptions; the bars show the wider delivery window.</p>`;}
function capacityView(withStats=true){return (withStats?statGrid():'')+`<div class="capacity-grid">${D().team.map(t=>{const net=availability(D(),t.id,'2026-11-16').available,pct=net?Math.round(t.allocated/net*100):0,over=t.allocated>net;return `<article class="panel person-card">${personAvatar(t.name)}<h3>${e(t.name)}</h3><p>${e(t.title)}</p><div class="allocation ${over?'over':''}">${net?pct+'%':t.allocated?'No capacity':'0%'} </div><div class="bar-track"><span class="${over?'overbar':''}" style="width:${Math.min(100,pct)}%"></span></div><p>${t.allocated}h allocated / ${net}h available after leave</p>${b('record','Inspect workload '+glyph('arrow'),'text-button tiny',`data-id="${t.id}"`)}</article>`;}).join('')}</div><p class="footnote">Capacity is a planning conversation, not an employee performance score. All people and allocations are fictional. This view uses the week of 16 November 2026 and deducts approved leave from contracted capacity.</p>`;}
function graphContext(){const g=relationships(D(),state.account,state.role);return `<p class="eyebrow">Connected to</p><h3>${e(g.account.name)}</h3><p>${e(g.account.segment)} · ${e(g.account.region)}<br>Account owner: ${e(g.account.owner)}</p><div class="relationship-list">${g.nodes.slice(1).map(n=>b('record',`<div>${e(n.label)}<small>${e(n.type==='domain'?D().config.singular:n.type)}</small></div>`,'',`data-id="${n.id}"`)).join('')}</div><p>Click a node to inspect the underlying record. Change function to reveal a different set of connections.</p>`;}
function graphView(){const d=D(),g=relationships(d,state.account,state.role);state.account=g.account.id;return `<div class="toolbar"><label class="row" for="graph-account">Focus account <select id="graph-account" data-select="account">${d.accounts.map(a=>`<option value="${a.id}" ${a.id===g.account.id?'selected':''}>${e(a.name)}</option>`).join('')}</select></label><span class="tiny muted">${g.nodes.length} records · ${g.edges.length} relationships · ${e(R().name)} perspective</span></div><div class="graph-layout"><section class="panel graph-stage">${relationshipGraph(g,state.graphSelected)}</section>${state.look==='atlas'?'':`<aside class="panel graph-inspector"><p class="eyebrow">Connected to</p><h3>${e(g.account.name)}</h3><p>${e(g.account.segment)} · ${e(g.account.region)}<br>Account owner: ${e(g.account.owner)}</p><div class="relationship-list">${g.nodes.slice(1).map(n=>b('record',`<div>${e(n.label)}<small>${e(n.type==='domain'?D().config.singular:n.type)}</small></div>`,'',`data-id="${n.id}"`)).join('')}</div><p>Click a node to inspect the underlying record. Change function to reveal a different set of connections.</p></aside>`}</div><div class="chart-legend spaced"><span><i style="background:var(--accent)"></i>Account / industry record</span><span><i style="background:#bc8a3a"></i>Invoice</span><span><i style="background:#478a7d"></i>Work</span><span><i style="background:#9174b7"></i>Person</span></div><p class="footnote">Links come from the synthetic dataset’s account and ownership references. This is a relationship view over relational data; it does not require or claim a deployed graph database.</p>`;}
function columnsForRole(){switch(state.role){case'finance':return ['Invoice','Account','Total','Outstanding','Due','Status'];case'saleslead':case'sales':return ['Opportunity','Owner','Contract value','Stage','Probability','Expected close'];case'operations':return ['Work item','Account','Owner','Status','Hours','Dependency'];case'people':return ['Person','Role','Contracted hours','Allocated','Unallocated after leave'];default:return [D().config.singular,'Account','Status',...D().config.schema.map(s=>s[0])];}}
function schemaValue(key,value){const type=D().config.schema.find(s=>s[0]===key)?.[1];return type==='money'?gbp(value):type==='percent'?value+'%':e(value);}

function changeWorkspaceLook(look) {
  const active = document.activeElement;
  const page = root.querySelector('#studio-main');
  const record = (modal.open ? modal : root).querySelector('[data-workspace-record]');
  const keepRecord = record?.isConnected;
  // These two views have look-specific markup. Other views can keep live forms and disclosures.
  const keepPage = page?.isConnected && page.matches('.page') && !state.gallery && !['overview', 'graph'].includes(state.view);
  state.look = look;
  render();
  if (keepPage) root.querySelector('#studio-main').replaceChildren(...page.childNodes);
  if (keepRecord) {
    const inspector = root.querySelector('[data-workspace-record]');
    if (inspector) {
      inspector.replaceWith(record);
      if (modal.open) modal.close();
    } else if (!modal.open) {
      modal.replaceChildren(record);
      modal.showModal();
    }

 }catch(error){flash(error.message);return true;}
}

function onAction(event){

  case'appearance':if(el.dataset.look==='northstar'){openNorthstar(el);break;}if(LOOKS.some(l=>l.id===el.dataset.look)){state.look=el.dataset.look;state.gallery=false;render();window.scrollTo(0,0);}break;
  case'gallery':state.gallery=true;render();window.scrollTo(0,0);break;
  case'site-home':
    if(window.parent!==window && new URLSearchParams(location.search).get('embed')==='site' && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey){
      event.preventDefault();
      window.parent.postMessage({type:'data-saver-studio-home'}, location.protocol==='file:'?'*':location.origin);
    }
    break;
  case'close-embed':if(window.parent!==window)window.parent.postMessage({type:'data-saver-studio-close'},location.protocol==='file:'||location.protocol==='about:'?'*':location.origin);break;
  case'preset':openPreset(Number(el.dataset.index));break;

  case'next':openPreset(state.preset+1);break;
  case'view':if(el.dataset.workflow)state.depthCase=D().depth.cases.find(c=>c.workflow===el.dataset.workflow)?.id;if(el.dataset.role)state.role=el.dataset.role;if(R().views.includes(el.dataset.view)){state.view=el.dataset.view;state.gallery=false;state.query='';render();}break;
  case'domain':state.role='leadership';state.view='records';state.gallery=false;state.query='';render();break;
  case'record':showRecord(el.dataset.id);break;
  case'close':closeRecord();break;
  case'focus-account':closeRecord();state.account=el.dataset.id;state.view='graph';render();break;

  case'collect':{const invoice=D().invoices.find(i=>i.id===el.dataset.id),amount=balance(invoice);if(!amount){flash('Invoice already settled.');break;}D().openingCashPence+=amount;invoice.paidPence=invoice.totalPence;invoice.status='Paid';invoice.overdueDays=0;D().activity.unshift({action:'Collection recorded',recordId:invoice.id,amount});render();showRecord(invoice.id);flash('Demo collection recorded. No real payment was made.');break;}
  case'reassign':reallocate(D(),el.dataset.id,document.querySelector('#reassign-owner').value);render();showRecord(el.dataset.id);flash('Owner changed. Team allocations recalculated.');break;
  case'reset-forecast':state.delay=0;state.costChange=0;state.pipeline=false;refreshForecast();break;
  case'export':exportData();break;
}}
